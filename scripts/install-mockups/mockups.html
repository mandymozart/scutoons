<!doctype html>
<!--
  The install tutorial's pictures (#159, viewer /app, NEWSLETTER.md "Install block"): drawn look-alikes of Safari (iPhone)
  and Chrome (Android) – no screenshots. Each .frame is one picture, rendered by render.ts (?lang=de|en) to
  viewer/static/app/<name>.<lang>.png + .2x.png. Device sizes in px are fine here (a mockup of a 390-wide phone).
-->
<html>
<head>
<meta charset="utf-8">
<style>
	* { box-sizing: border-box; }
	body { margin: 0; padding: 20px; background: #f0f0f0; font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 20px; }
	.frame { width: 360px; height: 440px; background: #fff; padding: 12px; position: relative; }
	.screen { position: absolute; inset: 12px; border: 3px solid #1c1c1e; overflow: hidden; background: #fff; }
	.screen.top { border-radius: 34px 34px 0 0; border-bottom: 0; }
	.screen.bottom { border-radius: 0 0 34px 34px; border-top: 0; }
	.page { position: absolute; left: 0; right: 0; background: url(../../viewer/static/screenshot-narrow.webp) center top / 100% auto no-repeat; }
	.dim { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.32); }
	.mark { position: absolute; border: 3px solid #e8004c; border-radius: 999px; box-shadow: 0 0 0 4px rgba(232, 0, 76, 0.18); pointer-events: none; }
	.mark.box { border-radius: 12px; }
	svg { display: block; }

	/* iOS Safari */
	.ios { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; color: #000; }
	.ios-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 128px; background: rgba(248, 248, 248, 0.97); border-top: 1px solid #d6d6d6; }
	.ios-url { position: absolute; left: 14px; right: 14px; top: 10px; height: 40px; border-radius: 12px; background: #e9e9eb; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; }
	.ios-tools { position: absolute; left: 0; right: 0; top: 60px; height: 44px; display: flex; justify-content: space-around; align-items: center; color: #007aff; }
	.ios-home { position: absolute; bottom: 8px; left: 50%; width: 120px; height: 5px; margin-left: -60px; border-radius: 3px; background: #000; }
	.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #f2f2f7; border-radius: 14px 14px 0 0; }
	.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
	.sheet-head .t { font-size: 15px; font-weight: 600; }
	.sheet-head .u { font-size: 13px; color: #6e6e73; }
	.icon { width: 44px; height: 44px; border-radius: 10px; border: 1px solid #ddd; background: #fff url(../../viewer/static/app-icon-192.png) center / 100% no-repeat; flex: none; }
	.apps { display: flex; gap: 14px; padding: 4px 14px 12px; }
	.apps div { width: 52px; height: 52px; border-radius: 13px; flex: none; }
	.group { margin: 0 12px 10px; background: #fff; border-radius: 12px; }
	.row { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 16px; border-top: 0.5px solid #d1d1d6; }
	.row:first-child { border-top: 0; }
	.row svg { color: #000; }
	.nav { height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; font-size: 15px; white-space: nowrap; background: #f2f2f7; }
	.nav .c { color: #007aff; }
	.nav .t { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: center; }
	.nav .a { color: #007aff; font-weight: 600; }
	.card { margin: 14px 12px; background: #fff; border-radius: 12px; display: flex; gap: 12px; padding: 12px; align-items: center; }
	.card .icon { width: 60px; height: 60px; border-radius: 14px; }
	.card .f { flex: 1; }
	.card .n { font-size: 16px; padding-bottom: 8px; border-bottom: 0.5px solid #d1d1d6; }
	.card .u { font-size: 14px; color: #6e6e73; padding-top: 8px; }
	.note { margin: 0 24px; font-size: 13px; color: #6e6e73; line-height: 1.35; }
	.kbd { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #d1d3d9; }

	/* Android Chrome */
	.and { font-family: Roboto, 'Segoe UI', system-ui, sans-serif; color: #1f1f1f; }
	.status { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; background: #fff; }
	.cbar { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; background: #fff; }
	.omni { flex: 1; height: 44px; border-radius: 22px; background: #f1f3f4; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 16px; }
	.tabs { width: 22px; height: 22px; border: 2px solid #444; border-radius: 5px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
	.dots { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
	.menu { position: absolute; right: 6px; top: 32px; width: 224px; background: #fff; border-radius: 16px; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25); padding: 6px 0; }
	.menu .icons { height: 48px; display: flex; justify-content: space-around; align-items: center; color: #444; border-bottom: 1px solid #e3e3e3; margin-bottom: 4px; }
	.menu .item { height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 15px; }
	.menu .item i { width: 20px; height: 20px; border-radius: 4px; background: #d5d5d5; flex: none; }
	.dialog { position: absolute; left: 22px; right: 22px; top: 96px; background: #fff; border-radius: 26px; padding: 22px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3); }
	.dialog h2 { margin: 0 0 18px; font-size: 22px; font-weight: 400; }
	.dialog .app { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
	.dialog .app .n { font-size: 16px; }
	.dialog .app .u { font-size: 14px; color: #5f6368; }
	.dialog .btns { display: flex; justify-content: flex-end; gap: 22px; font-size: 15px; font-weight: 500; color: #0b57d0; }
	.dialog .btns span { padding: 10px 6px; }
</style>
</head>
<body>

</div>

<script>
	const T = {
		de: {
			copy: 'Kopieren', readingList: 'Zur Leseliste hinzufügen', bookmark: 'Lesezeichen hinzufügen', addHome: 'Zum Home-Bildschirm',
			cancel: 'Abbrechen', addHomeTitle: 'Zum Home-Bildschirm', add: 'Hinzufügen',
			iosNote: 'SCUTOONS bekommt ein Symbol auf deinem Home-Bildschirm.',
			newTab: 'Neuer Tab', incognito: 'Neuer Inkognito-Tab', history: 'Verlauf', downloads: 'Downloads', bookmarks: 'Lesezeichen',
			share: 'Teilen …', installApp: 'App installieren', desktop: 'Desktopwebsite',
			installTitle: 'App installieren', cancelA: 'Abbrechen', install: 'Installieren'
		},
		en: {
			copy: 'Copy', readingList: 'Add to Reading List', bookmark: 'Add Bookmark', addHome: 'Add to Home Screen',
			cancel: 'Cancel', addHomeTitle: 'Add to Home Screen', add: 'Add',
			iosNote: 'SCUTOONS gets an icon on your Home Screen.',
			newTab: 'New tab', incognito: 'New Incognito tab', history: 'History', downloads: 'Downloads', bookmarks: 'Bookmarks',
			share: 'Share…', installApp: 'Install app', desktop: 'Desktop site',
			installTitle: 'Install app', cancelA: 'Cancel', install: 'Install'
		}
	};
	const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'de';
	document.documentElement.lang = lang;
	for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[lang][el.dataset.t];
	// marks around their target (a word's width differs per language), measured once the text is in
	for (const mark of document.querySelectorAll('[data-mark]')) {
		const screen = mark.parentElement.getBoundingClientRect();
		const r = document.getElementById(mark.dataset.mark).getBoundingClientRect();
		const pad = Number(mark.dataset.pad ?? 8); // around the target; the screen's 3px border is outside the box
		const padY = mark.dataset.pad ? pad : pad / 2;
		Object.assign(mark.style, {
			left: `${r.left - screen.left - 3 - pad - 3}px`,
			top: `${r.top - screen.top - 3 - padY - 3}px`,
			width: `${r.width + pad * 2 + 6}px`,
			height: `${r.height + padY * 2 + 6}px`
		});
	}
	document.body.dataset.ready = '1';
</script>
