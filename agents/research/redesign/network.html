const SIG = ['event','control','clock','audio','picture','address','vote','scene','far'];
const SHAPE = { event:'tri', control:'dot', clock:'dot', vote:'dot', audio:'sq', picture:'sq', scene:'sq', address:'dia', far:'ring' };
const col = s => `var(--s-${s})`;
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a = {}, txt) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };

function port(g, x, y, s, r = 4.2) {
  const c = col(s), k = SHAPE[s];
  if (k === 'tri') g.append(el('path', { d: `M${x - r},${y - r} L${x + r},${y} L${x - r},${y + r} Z`, fill: c }));
  else if (k === 'sq') g.append(el('rect', { x: x - r + .6, y: y - r + .6, width: 2 * r - 1.2, height: 2 * r - 1.2, fill: c }));
  else if (k === 'dia') g.append(el('path', { d: `M${x},${y - r - .5} L${x + r + .5},${y} L${x},${y + r + .5} L${x - r - .5},${y} Z`, fill: c }));
  else if (k === 'ring') g.append(el('circle', { cx: x, cy: y, r: r - .4, fill: 'none', stroke: c, 'stroke-width': 1.6 }));
  else g.append(el('circle', { cx: x, cy: y, r: r - .4, fill: c }));
}

const B_EDGES = V[3].edges.map(e => e[0] === 'c2.e' ? [e[0], e[1], e[2], e[3], { ...e[4], sel: true }] : e);
const R_NOTES = `<h2>7–9 · B beside a Reception view</h2>
  <p>The logic stays B (nested scopes, left). Devices are another organisation, so they get <b>their own view beside it</b> on the split stage (#765), not rows inside it. Select a box or cable on the left (here: the <i>storm</i> cable) and the right shows <b>who receives it and what it fires</b>: connected now, potential, or filtered out by the show's <code>where</code> facts (group, device, account, approved). Select a receiver on the right and the left dims to what reaches it.</p>
  <p>Three different ways to give the same answer: <b>Matrix</b> (who × what, exact, for checking a user group), <b>Constellation</b> (the audience as it is, for the live show), <b>Timeline</b> (when each one received it, for latency and order).</p>`;
const RB = { items: [['Home'], ['Chapter 2 · Dunes'], ['rig crow'], ['Sandbox demo', true]], path: [['Universe'], ['Show · Sandbox demo', 'b']], follows: 'pinned · show + toon', pinned: true, waits: 'Show waits ↓',
  frames: V[3].frames, nodes: V[3].nodes, edges: B_EDGES, notes: R_NOTES };
V[7] = { ...RB, side: matrix };
V[8] = { ...RB, side: constellation };
V[9] = { ...RB, side: timeline };

/* ── drawing ─────────────────────────────────────────────────────────── */
const HEAD = 2.1, ROW = 1.55;
function geom(n) {
  const rows = Math.max((n.ins || []).length, (n.outs || []).length, n.far ? 1 : 1);
  const h = n.far ? 2 : HEAD + rows * ROW + .5 + (n.pic ? 0 : 0);
  return { h };
}
function portPos(n, id, side, r) {
  const list = side === 'in' ? n.ins || [] : n.outs || [];
  const i = list.findIndex(p => p[0] === id);
  if (n.far) return [(side === 'in' ? n.x : n.x + n.w) * r, (n.y + 1) * r];
  return [(side === 'in' ? n.x : n.x + n.w) * r, (n.y + HEAD + i * ROW + ROW / 2 + .25) * r];
}

function draw() {
  const d = V[view], r = R(), svg = document.getElementById('g');
  svg.replaceChildren();
  const byId = Object.fromEntries(d.nodes.map(n => [n.id, n]));
  const top = el('g', { transform: `translate(0, ${1.5 * r})` });
  svg.append(top);

  for (const [t, y, h, sub] of d.lanes || []) {
    top.append(el('rect', { 'data-lane': 1, x: 0, y: y * r, width: 90 * r, height: h * r, rx: .36 * r, fill: 'var(--within)', opacity: .45 }));
    top.append(el('text', { x: 1.2 * r, y: (y + 1.2) * r, class: 'lane-t' }, t));
    if (sub) top.append(el('text', { x: 1.2 * r, y: (y + 2.3) * r, class: 'tm' }, sub));
  }
  for (const [y, t] of d.seams || []) {
    top.append(el('line', { x1: 0, x2: 90 * r, y1: (y + .5) * r, y2: (y + .5) * r, stroke: 'var(--line)', 'stroke-dasharray': '4 4' }));
    top.append(el('text', { x: 89 * r, y: (y + .2) * r, class: 'tm', 'text-anchor': 'end' }, '↕ ' + t));
  }
  for (const [t, x, y, w, h, chip] of d.frames || []) {
    top.append(el('rect', { x: x * r, y: y * r, width: w * r, height: h * r, rx: .5 * r, fill: 'none', stroke: 'var(--muted)', 'stroke-dasharray': '5 4', opacity: .8 }));
    top.append(el('text', { x: (x + .7) * r, y: (y + 1.15) * r, class: 'lane-t' }, t));
    if (chip) top.append(el('text', { x: (x + w - .7) * r, y: (y + 1.15) * r, class: 'tm', 'text-anchor': 'end' }, chip));
  }

  const wires = el('g'), boxes = el('g'), labels = el('g'), beads = [];
  top.append(wires, boxes, labels);

  for (const [a, b, s, label, o = {}] of d.edges) {
    const [na, pa] = a.split('.'), [nb, pb] = b.split('.');
    const A = byId[na], B = byId[nb];
    const [x1, y1] = portPos(A, pa, 'out', r), [x2, y2] = portPos(B, pb, 'in', r);
    const dx = Math.max(40, Math.abs(x2 - x1) * .45);
    const dpath = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
    const lit = live && o.lit;
    const w = el('path', { d: dpath, class: 'wire' + (lit ? ' lit' : ' dim'), stroke: col(s), 'stroke-width': o.count ? 2.6 : (s === 'event' ? 1.8 : 1.5), style: `color:${col(s)}` });
    if (s === 'far' || B.far || A.far) w.setAttribute('stroke-dasharray', '1 0');
    if (o.sel) wires.append(el('path', { d: dpath, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 7, opacity: .3 }));
    wires.append(w);
    if (lit) for (let k = 0; k < 3; k++) {
      const c = el('circle', { r: 2, fill: col(s), opacity: .85 });
      const m = el('animateMotion', { dur: '2.4s', repeatCount: 'indefinite', begin: `-${k * .8}s`, path: dpath });
      c.append(m); beads.push(c);
    }
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const txt = (label || '') + (o.count ? `  ×${o.count}` : '');
    if (txt.trim()) labels.append(el('text', { x: mx, y: my - 4, class: 'tl', fill: col(s), 'text-anchor': 'middle' }, txt));
    if (o.crosses) labels.append(el('text', { x: mx, y: my + 11, class: 'tl', fill: 'var(--muted)', 'text-anchor': 'middle' }, '⇄ ' + o.crosses));
  }

  for (const n of d.nodes) {
    const g = el('g'), { h } = geom(n), x = n.x * r, y = n.y * r, w = n.w * r;
    if (n.far) {
      g.append(el('rect', { x, y, width: w, height: 2 * r, rx: r, fill: 'var(--surface)', stroke: 'var(--s-far)', 'stroke-dasharray': '3 3' }));
      g.append(el('text', { x: x + w / 2, y: y + 1.32 * r, class: 'tm', 'text-anchor': 'middle' }, n.title));
      if (n.ins) port(g, x, y + r, 'far'); if (n.outs) port(g, x + w, y + r, 'far');
      boxes.append(g); continue;
    }
    g.append(el('rect', { x, y, width: w, height: h * r, rx: .36 * r, fill: 'var(--surface)', stroke: n.sel ? 'var(--accent)' : 'var(--line)', 'stroke-width': n.sel ? 1.5 : 1 }));
    g.append(el('path', { d: `M${x + .36 * r},${y} h${w - .72 * r} a${.36 * r},${.36 * r} 0 0 1 ${.36 * r},${.36 * r} v${HEAD * r - .36 * r} h${-w} v${-(HEAD * r - .36 * r)} a${.36 * r},${.36 * r} 0 0 1 ${.36 * r},${-.36 * r} z`, fill: 'var(--head)' }));
    let tx = x + .6 * r;
    if (n.pic) { g.append(el('rect', { x: x + .45 * r, y: y + .35 * r, width: 1.4 * r, height: 1.4 * r, rx: .2 * r, fill: 'var(--within)', stroke: 'var(--line)' })); g.append(el('path', { d: `M${x + .55 * r},${y + 1.6 * r} l${.45 * r},${-.55 * r} l${.3 * r},${.3 * r} l${.4 * r},${-.5 * r} l${.1 * r},${.75 * r}z`, fill: 'var(--muted)', opacity: .6 })); tx += 1.5 * r; }
    g.append(el('text', { x: tx, y: y + .95 * r, class: 'th' }, n.title));
    g.append(el('text', { x: tx, y: y + 1.75 * r, class: 'tm' }, n.kind || ''));
    if (n.problem) { g.append(el('circle', { cx: x + w - .7 * r, cy: y + .75 * r, r: .3 * r, fill: 'var(--warn)' })); g.append(el('title', {}, n.problem)); }
    (n.ins || []).forEach(([id, label, s], i) => {
      const py = y + (HEAD + i * ROW + ROW / 2 + .25) * r; port(g, x, py, s);
      g.append(el('text', { x: x + .65 * r, y: py + 4, class: 't' }, label));
    });
    (n.outs || []).forEach(([id, label, s], i) => {
      const py = y + (HEAD + i * ROW + ROW / 2 + .25) * r; port(g, x + w, py, s);
      g.append(el('text', { x: x + w - .65 * r, y: py + 4, class: 't', 'text-anchor': 'end' }, label));
    });
    boxes.append(g);
  }
  // fit everything into the free area (left of the notes, between the toolbars)
  top.removeAttribute('transform');
  const bb = top.getBBox(), quiet = document.body.classList.contains('quiet');
  const L = r, T = 6.6 * r, W = d.side ? innerWidth * .56 - 2 * r : innerWidth - (quiet ? 2 * r : 21.5 * r) - L, H = innerHeight - T - 4 * r - (d.side && !quiet ? 12.5 * r : 0);
  const s = Math.min(W / bb.width, H / bb.height, 1.25);
  top.setAttribute('transform', `translate(${L + (W - bb.width * s) / 2 - bb.x * s}, ${T + (H - bb.height * s) / 2 - bb.y * s}) scale(${s})`);
  wires.append(...beads);
  if (d.lanes) for (const rc of top.querySelectorAll('rect[data-lane]')) { rc.setAttribute('x', bb.x - r / s); rc.setAttribute('width', bb.width + 2 * r / s); }
}

function chrome() {
  const d = V[view];
  document.getElementById('items').innerHTML = d.items.map(([t, on]) => `<button class="${on ? 'on' : ''}">${t}</button>`).join('');
  document.getElementById('path').innerHTML = '<span class="label" style="padding:0 .4rem">Flow</span><button title="Up a level (Alt+↑)">↑</button><span class="sep"></span>' +
    d.path.map(([t, k], i) => k === 'scope' ? `<span class="scope">${t}</span>` : `<button>${k === 'b' ? `<b>${t}</b>` : t}</button>${i < d.path.length - 1 ? '›' : ''}`).join('');
  document.getElementById('tool').innerHTML = `<button title="Frame all (F)">Frame</button><button title="Direction (workspace setting)">LR ▾</button><button title="Previews in nodes">Previews</button><button class="${live ? 'on' : ''}" id="livebtn" title="Live feedback (L)">Live</button>${d.extra ? `<span class="sep"></span><button>${d.extra}</button>` : ''}${d.extraHtml ? `<span class="sep"></span>${d.extraHtml}` : ''}`;
  document.getElementById('follow').innerHTML = d.pinned
    ? `<button class="on" title="Pinned: the level stays">📌 ${d.follows}</button><button title="Follow the front item again">Follow</button>`
    : `<span class="dot" style="margin:0 .3rem 0 .5rem"></span><span style="font-size:var(--small);color:var(--muted);padding-right:.4rem">follows ${d.follows}</span><button title="Pin this level">📌</button>`;
  document.getElementById('legend').innerHTML = ['event', 'control', 'clock', 'audio', 'picture', 'address', 'vote', 'scene', 'far'].map(s => {
    const svg = `<svg width="12" height="12" viewBox="-6 -6 12 12">${shapeSvg(s)}</svg>`; return `<span>${svg}${s}</span>`;
  }).join('');
  document.getElementById('views').innerHTML = '<span class="label" style="padding:0 .4rem">draft</span>' + [1, 2, 3, 4, 5, 7].map(i => `<button class="${i === view || (i === 5 && view === 6) || (i === 7 && view > 7) ? 'on' : ''}" data-v="${i}">${{1: 'Chapter', 2: 'Network A', 3: 'Network B', 4: 'Rig', 5: 'Network C', 7: 'B + Reception'}[i]}</button>`).join('');
  document.getElementById('waits').innerHTML = `<button>${d.waits}</button>`;
  document.getElementById('notes').innerHTML = d.notes;
  document.body.classList.toggle('split', !!d.side);
  document.getElementById('side').innerHTML = d.side ? d.side() : '';
  document.querySelectorAll('#views button, #tool button[data-v], #side button[data-v]').forEach(b => b.onclick = () => go(+b.dataset.v));
  document.getElementById('livebtn').onclick = toggleLive;
}
function shapeSvg(s) {
  const c = col(s), k = SHAPE[s];
  if (k === 'tri') return `<path d="M-4,-4 L4,0 L-4,4Z" fill="${c}"/>`;
  if (k === 'sq') return `<rect x="-3.5" y="-3.5" width="7" height="7" fill="${c}"/>`;
  if (k === 'dia') return `<path d="M0,-4.5 L4.5,0 L0,4.5 L-4.5,0Z" fill="${c}"/>`;
  if (k === 'ring') return `<circle r="3.6" fill="none" stroke="${c}" stroke-width="1.6"/>`;
  return `<circle r="3.8" fill="${c}"/>`;
}
function go(v) { view = v; q.set('v', v); history.replaceState(null, '', '?' + q); chrome(); draw(); }
function toggleLive() { live = !live; document.body.classList.toggle('live', live); chrome(); draw(); }
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') go(+e.key);
  else if (e.key === 't' || e.key === 'T') { const h = document.documentElement; h.dataset.theme = h.dataset.theme === 'day' ? 'night' : 'day'; draw(); }
  else if (e.key === 'n' || e.key === 'N') { document.body.classList.toggle('quiet'); draw(); }
  else if (e.key === 'l' || e.key === 'L') toggleLive();
});
addEventListener('resize', draw);
document.fonts.ready.then(() => { chrome(); draw(); });
chrome(); draw();
</script>
</body>
</html>
