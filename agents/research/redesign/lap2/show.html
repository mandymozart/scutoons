function band(o = {}) {
  const x = o.x ?? 12, w = 750, cx = (k) => 196 + k * 138 + k * 6;

    if (o.slot && i === 1) return `<span class="slot on" style="left:${50 + off}px;top:26px">${ic('zap')}ch3.dialog-start</span>`;
    if (o.slot && !r.ev) return `<span class="slot" style="left:${50 + off}px;top:26px">${ic('zap')}</span>`;
    if (!r.ev) return '';
    return `<span class="kc ${r.ev[1] ? 'dash' : ''} ${o.chipOn && i === 1 ? 'on' : ''}" style="position:absolute;left:${50 + off}px;top:25px;height:1.2rem;font-family:var(--mono);font-size:.72rem;letter-spacing:0" title="fires on">${ic('zap')}${r.ev[0]}</span>`;
  };
  const cell = ([k, t, extra], c) => {
    const l = cx(c) + off;
    if (k === 'carry') return `<span class="carry" style="left:${l}px">↑ carries on</span>`;
    if (k === 'off') return `<span class="abs" style="left:${l + 8}px;top:14px"><span class="tg"></span></span>`;

  return `<div class="fp" style="left:${x}px;top:452px;width:${w + off}px;height:352px">${head('list', { noX: true })}

      const BX = 258, by = (i) => 452 + 86 + i * 50 + 22;
      const pr = (i) => [NX + NW - 6, ny(i) + 12];
      const cable = (a, b, o = {}) => { const [x1, y1] = a, [x2, y2] = b; return `<path d="M${x1} ${y1} C ${x1 + 30} ${y1}, ${x2 - 30} ${y2}, ${x2} ${y2}" fill="none" stroke="${o.on ? 'var(--tool-text)' : 'var(--tool-muted)'}" stroke-width="${o.on ? 1.5 : 1}" ${o.dash ? 'stroke-dasharray="3 3"' : ''} opacity="${o.on ? 1 : .7}"/>`; };
      return stage() + conductors()
        + `<div class="fp" style="left:${NX}px;top:${NY}px;width:${NW}px;height:352px">${head('node', { noX: true, tabs: `<span class="tab on" style="padding:0 .35rem">${ic('node')}Nodes</span>`, right: ['LR','TB','Fit','Note','150 %'].map(t => `<span class="tab" style="padding:0 .25rem">${t}</span>`).join('') })}
          <div class="abs label" style="left:12px;top:46px">ch 3 · events</div>
          ${nodes.map(([n, i]) => `<span class="node ${i === 0 ? 'on' : ''} ${n === 'ch3 …' ? '' : ''}" style="left:12px;top:${ny(i) - NY}px;${n === 'ch3 …' ? 'border-style:dashed' : ''}" title="${HOVER[n] || ''}">${ic('zap')}${n}</span><span class="port out ${i === 0 ? 'lit' : ''}" style="left:${NW - 11}px;top:${ny(i) - NY + 8}px"></span>`).join('')}</div>`
        + band({ x: BX, mark: [null, 'ch3.dialog-start', 'ch3 …', null] })
        + `<svg class="abs" style="left:0;top:0;width:1440px;height:868px;z-index:30;pointer-events:none">
            ${cable(pr(1), [BX + 11, by(2)], { dash: 1 })}
            ${cable(pr(0), [BX + 11, by(1)], { on: 1 })}</svg>`
        + cursor(BX + 8, by(1) + 2) + loadFlash() + library() + infoPill({ top: 410, left: 872 }) + status();
    }, pick: [12, 452, 1040, 352] },
  { name: 'v4 · In the Inspector', changed: 'Changed: “fires on” is a select with Find in the selected row’s Inspector – nothing opens on the stage; no picker panel.',
    draw: () => stage() + conductors() + band()
      + loadFlash({ x: 1076, w: 352, body: `<div style="padding:.2rem var(--editor-pad) .6rem;display:grid;grid-template-columns:5.2rem 1fr;gap:.45rem .6rem;align-items:center">
          <span class="label" style="grid-column:1/3;margin-top:.3rem">Row · 02 dialog</span>
          <span class="muted small" title="The story event that fires this row">fires on</span><span class="fld sel on" style="height:1.9rem;font-family:var(--mono);font-size:.85rem">${ic('zap')}<span style="color:var(--tool-text)">ch3.dialog-start</span></span></div>` })
      + library({ top: 216 })
      + `<div class="km" style="left:1128px;top:204px;width:300px;z-index:70"><span class="fld f" style="height:1.85rem;margin-bottom:4px">${ic('search')}<span class="caret"></span><span class="ph" style="margin-left:.1rem">Find</span></span>${evLines({ tick: true, idw: 150 }).replace(/<span class="m mono">[^<]*<\/span>/g, '')}</div>`
      + cursor(1236, 168) + infoPill() + status(),
    pick: [600, 52, 840, 600] },
  { name: 'v5 · Side by side', changed: 'Changed: nothing – the four versions’ picking moment, cropped, each with its one-line change.' },
];
const STILLS = 'stills are made in the background and shared (#842)';

function render() {
  const s = SCREENS[V];
  let deck;
  if (V < 5) deck = bar() + s.draw();
  else {
    const box = [[14, 14], [727, 14], [14, 440], [727, 440]];
    const cap = ['1 press on the ⚡ chip, type or pick – the list covers the rows below while open', 'the Toon tree must be open as a view; drag across the screen – no typing to find unless the tree’s Find', 'marks at the row’s left, a cable from the event’s node – the Nodes view beside the band takes the room; many events = a long column', 'select the row, then the Inspector’s select – the Inspector widens, the Library shows fewer tiles'];
    deck = [1, 2, 3, 4].map((v, k) => {
      const [sx, sy, sw, sh] = SCREENS[v].pick, W = 699, H = 380, k2 = Math.min(W / sw, H / sh);
      return `<div class="cmp" style="left:${box[k][0]}px;top:${box[k][1]}px;width:${W}px;height:${H}px"><div class="inner" style="transform:scale(${k2});left:${-sx * k2}px;top:${-sy * k2}px">${bar() + SCREENS[v].draw()}</div></div>
        <div class="cmpc" style="left:${box[k][0] + 4}px;top:${box[k][1] + H + 6}px;width:${W}px"><b>${SCREENS[v].name}</b> – ${cap[k]}</div>`;
    }).join('');
  }
  const idx = SCREENS.map((x, i) => `<a href="?v=${i}${DAY ? '&theme=day' : ''}" class="${i === V ? 'on' : ''}" title="${x.name}">v${i}</a>`).join('') + `<a href="?v=${V}${DAY ? '' : '&theme=day'}">${DAY ? 'night' : 'day'}</a>`;
  document.getElementById('root').innerHTML = `<div class="screen"><div class="deck">${deck}</div>
    <div class="foot"><b>${s.name}</b><span>${s.changed}${V < 5 ? ' · ' + STILLS : ''}</span><span class="idx">${idx}</span></div></div>`;
  document.title = s.name + ' · Show view · lap 2';
}
render();
addEventListener('keydown', e => {
  const n = e.key === 'ArrowRight' ? V + 1 : e.key === 'ArrowLeft' ? V - 1 : null;
  if (n === null || n < 0 || n > 5) return;
  location.search = `?v=${n}${DAY ? '&theme=day' : ''}`;
});
</script>
</body>
</html>
