<!-- Status: draft round 2 for the owner's review (#759, epic #626), 2026-11-21 – A picked on 2026-11-21, redrafted around it; concept only, no build. -->
<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taking the stage</title>
<!-- How a panel tab takes the stage and comes back (#759, round 2: A as the base). Starting point: panels.html and the host #751 built
     (creator/src/lib/shell/panels.ts, presets.ts, shared/ui/src/editor/floating-panel.svelte).
     Colours: shared/tokens/editor.css, night and day, copied 1:1 – nothing else for the UI (the art on the stages – the 3D objects,
     the figure, the phone – has its own colours, as content would). Night first; T = day.
     ?tab=flow|stage3d|character|problems|preview starts with that tab on the stage · ?split=1 adds a second tab on the right half ·
     ?over=<tab> opens it over everything · ?theme=day · ?dur=<ms> slows the motion · ?quiet folds the notes.
     Keys: M = ◱ for the last panel you touched · 1–4 = Flow / 3D stage / Character / Problems on the stage · S = split on / off ·
     O = ⤢ · Esc = back · T = day / night · N = notes. Open at 1440×900. -->
<style>
@font-face{font-family:"Noto Sans";src:url("../../../../../../deck/kit/assets/NotoSans-Regular-latin.ttf");font-weight:400}
@font-face{font-family:"Noto Sans";src:url("../../../../../../deck/kit/assets/NotoSans-Bold-latin.ttf");font-weight:700}
/* shared/tokens/editor.css – night */
:root,[data-theme=night]{
  --stage:#000000;--surface:#1a1c18;--head:#141612;--line:#3a4034;--text:#f3f3f0;--muted:#a7af9b;--control:#262922;
  --hover:#2e3229;--pressed:#f3f3f0;--pressed-text:#171916;--selected:#3a4132;--within:#23261f;--accent:#00d1ff;
  --primary:#b4ff32;--primary-line:#9ce327;--primary-ink:#171916;--danger:#c0392b;--warn:#f0a030;
  --ground:rgb(26 28 24 / 0.5);--halo:0 0 2px #1a1c18, 0 0 2px #1a1c18, 0 0 3px #1a1c18;
}
/* shared/tokens/editor.css – day */
[data-theme=day]{
  --stage:#000000;--surface:#f3f3f0;--head:#e8eae2;--line:#d9decf;--text:#171916;--muted:#4f5747;--control:#fffffb;
  --hover:#e4e8dc;--pressed:#22271e;--pressed-text:#ffffff;--selected:#d5dbc9;--within:#e2e6da;--accent:#00728d;
  --primary:#b4ff32;--primary-line:#9ce327;--primary-ink:#171916;--danger:#c0392b;--warn:#b86e0c;
  --ground:rgb(243 243 240 / 0.8);--halo:none;
}
:root{--gap:1rem;--pad:.57rem;--small:.86rem;--label:.72rem;--title:1.15rem;--row:2.15rem;--tree-row:1.8rem;--radius:.36rem;--top:3.6rem;--spacing:.15em}
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;height:100vh;overflow:hidden;background:var(--stage);color:var(--text);font:400 1rem/1.35 "Noto Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.label{font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase;color:var(--muted)}
svg.i{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── the bar: only pills, floating on the stage – no band, no background of its own ── */
.bar{position:fixed;z-index:50;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;gap:.5rem;padding:0 var(--gap);background:none;pointer-events:none}
.bar>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:.25rem;height:var(--row);padding:0 .3rem;border-radius:calc(var(--row)/2);background:var(--ground);text-shadow:var(--halo);box-shadow:0 0 0 1px var(--line),0 .2rem .6rem rgb(0 0 0/.2)}
.pill button{height:calc(var(--row) - .5rem);min-width:calc(var(--row) - .5rem);padding:0 .6rem;border:0;border-radius:1rem;background:transparent;display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.pill button:hover{background:var(--hover)}
.pill button.on{background:var(--pressed);color:var(--pressed-text);text-shadow:none}
.pill .round{padding:0;justify-content:center}
.middle{flex:1;display:flex;justify-content:center;pointer-events:none}
.path{pointer-events:auto;display:flex;align-items:center;gap:.3rem;height:var(--row);padding:0 1rem;border-radius:calc(var(--row)/2);background:var(--ground);text-shadow:var(--halo);color:var(--muted);font-size:var(--small);box-shadow:0 0 0 1px var(--line)}
.path b{color:var(--text);font-weight:400}

/* ── the stage: edge to edge, under the bar too ── */
.box{position:fixed;overflow:hidden;transition:opacity .12s}
.box.arriving{opacity:0}
.box.canvas{background:var(--stage)}
.box.page{background:var(--surface);overflow:auto}
.pagebody{padding-top:calc(var(--top) + var(--gap));padding-bottom:calc(var(--row) + 3 * var(--gap))}
.pagecol{max-width:48rem;margin:0 auto}
.pagehead{display:flex;align-items:center;gap:.5rem;margin:0 0 1rem}
.pagehead .t{font-size:var(--title)}
.seg{display:inline-flex;gap:.15rem;padding:.15rem;border-radius:1rem;background:var(--control)}
.seg button{height:1.75rem;padding:0 .75rem;border:0;border-radius:.9rem;background:transparent;font-size:var(--small);display:flex;align-items:center;gap:.35rem}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--pressed);color:var(--pressed-text)}
.divider{position:fixed;z-index:6;top:0;bottom:0;width:.8rem;margin-left:-.4rem;cursor:col-resize;display:flex;justify-content:center}
.divider::before{content:"";width:1px;height:100%;background:var(--line)}
.divider:hover::before,.divider.dragging::before{background:var(--accent)}
.drop{position:fixed;z-index:60;outline:2px dashed var(--accent);outline-offset:-.4rem;display:grid;place-items:center;pointer-events:none}
.drop span{padding:.3rem .8rem;border-radius:1rem;background:var(--surface);color:var(--accent);font-size:var(--small)}
.stagepill{position:fixed;z-index:30;transform:translateX(-50%)}
.stagepill .sep{width:1px;height:1.2rem;background:var(--line);margin:0 .15rem}
.stagepill .chip{cursor:grab}
.ghost{position:fixed;z-index:95;border-radius:var(--radius);background:var(--ground);text-shadow:var(--halo);box-shadow:0 0 0 1px var(--accent),0 .6rem 2rem rgb(0 0 0/.45);padding:.6rem .9rem;overflow:hidden;pointer-events:none}
.ghost .label{color:var(--text)}

/* ── panels (floating-panel.svelte's look) ── */
.panel{position:fixed;z-index:10;display:flex;flex-direction:column;border-radius:var(--radius);background:var(--ground);box-shadow:0 0 0 1px rgb(0 0 0/.25),0 .3rem 1rem rgb(0 0 0/.25);overflow:hidden;text-shadow:var(--halo)}
.panel.droptarget{box-shadow:0 0 0 1px var(--accent),0 .3rem 1rem rgb(0 0 0/.25)}
.head{display:flex;align-items:center;gap:.15rem;min-height:2.35rem;padding:.3rem .3rem .3rem .15rem;background:var(--head);user-select:none}
.grip{width:.9rem;color:var(--muted);text-align:center;font-size:.8rem}
.tabs{flex:1;display:flex;align-items:center;gap:.15rem;min-width:0;overflow:hidden}
.tab{flex:none;height:1.75rem;padding:0 .65rem;border:0;border-radius:.9rem;background:transparent;font-size:var(--small);display:flex;align-items:center;gap:.35rem}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--pressed);color:var(--pressed-text);text-shadow:none}
.tab.dragging{opacity:.4}
.dot{width:.45rem;height:.45rem;border-radius:50%;background:var(--accent);flex:none}
.hb{width:1.75rem;height:1.75rem;padding:0;border:0;border-radius:var(--radius);background:transparent;color:var(--muted);display:grid;place-items:center;flex:none}
.hb:hover{background:var(--hover);color:var(--text)}
.hb.on{background:var(--pressed);color:var(--pressed-text)}
.content{flex:1;overflow:auto;padding:var(--pad);transition:opacity .12s}
.content.arriving{opacity:0}

/* rows, fields, tiles – the kit's */
.rows{display:flex;flex-direction:column;gap:1px}
.row{display:flex;align-items:center;gap:.5rem;min-height:var(--tree-row);padding:0 .5rem;border-radius:var(--radius);font-size:var(--small)}
.row:hover{background:var(--hover)}
.row.sel{background:var(--selected)}
.row .n{margin-left:auto;color:var(--muted);font-size:var(--label)}
.group{margin:.7rem .5rem .25rem}
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.8rem}
.field input,.field textarea{width:100%;height:var(--row);padding:0 .55rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--control);color:var(--text);font:inherit;font-size:var(--small)}
.field textarea{height:5rem;padding:.45rem .55rem;resize:none}
.field.warn textarea{border-color:var(--warn)}
.field .hint{font-size:var(--small);color:var(--warn)}
.cols{display:grid;grid-template-columns:1fr 7rem;gap:1rem}
.slot{display:grid;place-items:center;width:9rem;aspect-ratio:390/624;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);font-size:var(--small)}
.btn{height:var(--row);padding:0 var(--pad);border:1px solid var(--line);border-radius:var(--radius);background:var(--control);font-size:var(--small)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary-line);color:var(--primary-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5rem,1fr));gap:.4rem}
.tile{aspect-ratio:1;border-radius:var(--radius);background:linear-gradient(150deg,var(--selected),var(--within))}
.prob{display:flex;align-items:center;gap:.6rem;min-height:var(--tree-row);padding:.2rem .5rem;border-radius:var(--radius);font-size:var(--small)}
.prob:hover{background:var(--hover)}
.lvl{flex:none;width:4.2rem;font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase}
.lvl.e{color:var(--danger)}.lvl.w{color:var(--warn)}
.prob .go{margin-left:auto;color:var(--muted);font-size:var(--label)}

/* the small Flow (in a panel) */
.mini{position:relative;width:100%;height:100%;min-height:12rem}
.mini svg{position:absolute;inset:0;width:100%;height:100%}
.mini line{stroke:var(--accent);stroke-width:1.5}
.mini .node{position:absolute;transform:translate(-50%,-50%);padding:.35rem .65rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--control);font-size:var(--small);white-space:nowrap;text-shadow:none}

/* the big Flow: a graph on the whole window */
.graph{position:absolute;inset:0;background-color:var(--stage);background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:1.6rem 1.6rem}
.graph svg{position:absolute;inset:0;width:100%;height:100%}
.graph path{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.75}
.graph path.hot{stroke:var(--accent);opacity:1}
.gnode{position:absolute;transform:translate(-50%,-50%);min-width:8.5rem;padding:.4rem .7rem .5rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-size:var(--small);white-space:nowrap}
.gnode .label{display:block;margin-bottom:.1rem}
.gnode.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gnode::before,.gnode::after{content:"";position:absolute;top:50%;width:.55rem;height:.55rem;margin-top:-.275rem;border-radius:50%;background:var(--stage);border:1px solid var(--muted)}
.gnode::before{left:-.3rem}.gnode::after{right:-.3rem}

/* the 3D stage: a perspective floor and a few objects */
.s3d{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 70% 45% at 50% 42%,#1b2a30,var(--stage) 70%);perspective:80rem;perspective-origin:50% 25%}
.floor{position:absolute;left:50%;top:42%;width:150rem;height:110rem;margin-left:-75rem;transform-origin:50% 0;transform:rotateX(70deg);transform-style:preserve-3d;
  background-image:linear-gradient(rgb(0 209 255/.28) 1px,transparent 1px),linear-gradient(90deg,rgb(0 209 255/.28) 1px,transparent 1px);background-size:6rem 6rem}
.floor .obj{position:absolute;transform-origin:50% 100%;transform:rotateX(-90deg)}
.poster{width:10rem;height:14rem;border:2px solid var(--accent);background:linear-gradient(170deg,#2b3a2a,#121410);display:grid;place-items:end center;padding-bottom:.8rem;color:#f3f3f0;font-size:1rem}
.pillar{width:4rem;height:26rem;background:linear-gradient(90deg,#3a4034,#1a1c18)}
.cube{width:6rem;height:6rem;background:linear-gradient(160deg,#4a5240,#23261f);border:1px solid #5a6450}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgb(0 0 0/.7),transparent)}
.horizon{position:absolute;left:0;right:0;top:0;height:44%;background:linear-gradient(var(--stage) 30%,transparent);pointer-events:none}
.gizmo{position:absolute;pointer-events:none}
.tag3d{position:absolute;padding:.2rem .55rem;border-radius:1rem;background:var(--ground);color:var(--text);text-shadow:var(--halo);font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase;box-shadow:0 0 0 1px var(--line)}

/* the character stage: a figure on a ground */
.chr{position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 45%,#22281f,var(--stage) 75%)}
.chr svg{position:absolute;inset:0;width:100%;height:100%}

/* the Preview: the reader's phone on the stage */
.phone{margin:0 auto;height:100%;max-height:36rem;aspect-ratio:390/624;border-radius:.3rem;background:linear-gradient(170deg,#23261f,#3a4132);position:relative;overflow:hidden}
.phone .bubble{position:absolute;left:12%;top:10%;padding:.4rem .7rem;border-radius:1rem;background:#262922;color:#f3f3f0;font-size:var(--small);text-shadow:none}
.phone .fig{position:absolute;left:30%;bottom:0;width:40%;height:55%;border-radius:45% 45% 0 0;background:#3a4034}
.phonestage{position:absolute;inset:0;display:grid;place-items:center;padding:calc(var(--top) + 2rem) 2rem 5rem}
.phonestage .phone{height:100%;max-height:none}

/* ── over everything ── */
.dialog{position:fixed;z-index:80;inset:0;display:none;background:rgb(0 0 0/.55)}
.dialog.open{display:block}
.dialog .dbox{position:fixed;inset:calc(var(--top) * .6) 2.5rem 2.5rem;z-index:81;display:flex;flex-direction:column;border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:0 1rem 3rem rgb(0 0 0/.5)}
.dialog .dbox.arriving{opacity:0}
.dhead{flex:none;display:flex;align-items:center;gap:.4rem;height:2.6rem;padding:0 .4rem 0 1rem;border-bottom:1px solid var(--line)}
.dhead .sp{flex:1}
.dbody{flex:1;overflow:auto;padding:1rem 1.2rem}

/* ── the draft's notes (not part of the design) ── */
.notes{position:fixed;z-index:90;left:var(--gap);bottom:var(--gap);width:30rem;max-height:calc(100vh - var(--top) - 2rem);overflow:auto;padding:.8rem 1rem;border:1px dashed var(--muted);border-radius:var(--radius);background:var(--head);color:var(--text);font-size:var(--small);box-shadow:0 .3rem 1rem rgb(0 0 0/.35)}
.notes.min{width:auto}
.notes.min .more{display:none}
.notes h3{margin:0 0 .5rem;font-size:1rem;font-weight:400;display:flex;align-items:center;gap:.5rem}
.notes.min h3{margin:0}
.notes h3 .sp{flex:1}
.notes p{margin:.35rem 0}
.notes dl{margin:.3rem 0;display:grid;grid-template-columns:5.6rem 1fr;gap:.25rem .6rem}
.notes dt{color:var(--muted)}
.notes dd{margin:0}
.notes .rec{margin-top:.6rem;padding-top:.5rem;border-top:1px solid var(--line)}
.notes .btn{white-space:nowrap}
.notes kbd{font:inherit;font-size:var(--label);padding:0 .3rem;border:1px solid var(--line);border-radius:.2rem}
</style>
</head>
<body>

<div id="stage"></div>

<div class="bar">
  <div class="pill"><button class="round" title="Main menu">☰</button><button class="round" title="Home">⌂</button></div>
  <div class="pill"><button class="on">Cat Pope › Chapter 2</button><button>Katzenpapst</button><button class="round" title="Open">+</button></div>
  <div class="middle"><span class="path">Cat Pope › <b>Chapter 2</b></span></div>
  <div class="pill"><button class="on">Edit</button><button>Play</button></div>
  <div class="pill"><button>Views</button><button>History</button><button>Publish</button></div>
  <div class="pill"><button>tilman</button></div>
</div>

<div id="panels"></div>
<div class="dialog" id="dialog"></div>
<div id="dropzone"></div>

<div class="notes" id="notes"></div>

<script>
const q = new URLSearchParams(location.search);
const DUR = +(q.get('dur') ?? 180);
const rem = 14, GAP = rem, TOP = 3.6 * rem;
const $ = s => document.querySelector(s);
const ICON = {
  main:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="6" y="8" width="12" height="8" rx="1" fill="currentColor" stroke="none" opacity=".35"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="8" width="6" height="8" rx="1"/></svg>',
  over:'<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>',
  fold:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  unfold:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  close:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  form:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>'
};
const NAMES = {tree:'Tree',toon:'Toon',problems:'Problems',flow:'Flow',preview:'Preview',stage3d:'3D stage',character:'Character',library:'Library'};
const VIEW = 'Chapter';   // the workspace's own view: the chapter form
const CANVAS = ['flow','preview','stage3d','character'];   // full-bleed backstage; everything else is a page

// ── content, small (in a panel) and big (on the stage, given its rect) ──
const MINI = [['Arrival',14,22],['Cathedral',40,50],['Confession',68,24],['Altar',72,76],['Ending',92,52]];
const MINIW = [[0,1],[1,2],[1,3],[2,4],[3,4]];
// the big graph, in % of the stage: some nodes sit under the bar's row, some under the panels – the graph is the ground
const G = [['Start','Entry',9,45],['Arrival','Group 1',11,30],['Cathedral','Group 2',35,20],['Has the key?','Condition',36,3.5],['Confession','Group 3',58,30],
  ['Altar','Group 4',39,52],['Choir','Group 5',61,63],['Ending A','Ending',66,4],['Ending B','Ending',89,52],['Crypt','Group 6',13,74],['Chorus','Song',52,84],['Bell','Sound',80,90]];
const GW = [[0,1],[1,2],[2,3],[3,4],[3,7],[2,5],[5,6],[4,7],[6,8],[1,9],[9,10],[10,8],[10,11]];
const HOT = new Set(['1-2','2-3','3-7']);
const body = {
  tree: () => `<div class="rows">${['Group 1 – Arrival','Group 2 – The cathedral','Group 3 – Confession','Group 4 – Altar','Group 5 – Ending'].map((g,i)=>`<div class="row ${i==1?'sel':''}">${g}<span class="n">${[4,6,3,5,2][i]}</span></div>`).join('')}</div>`,
  toon: () => `<div class="rows">${['Stories','Cast','Script','Credits'].map((r,i)=>`<div class="row ${i==0?'sel':''}">${r}</div>`).join('')}</div><div class="group label">Season 1</div><div class="rows">${['Chapter 1 – Feilchen','Chapter 2 – Die Kathedrale','Chapter 3'].map((r,i)=>`<div class="row ${i==1?'sel':''}">${r}</div>`).join('')}</div>`,
  problems: big => {
    const all = [['e','Slice 2.3 has no image','Group 2'],['e','Group 4 jumps to a group that is gone','Group 4'],['w','Persona "Biker" has no voice','Cast'],['w','Description is short for the reader\'s card','Chapter'],['w','Slice 2.6: lettering runs past the safe area','Group 2'],['w','Group 5 is reached from nowhere','Flow'],['w','Ending B has no cover','Flow'],['w','Song "Chorus" has no lyrics in English','Sound']];
    const list = big ? all : all.slice(0,4);
    return list.map(([l,t,w])=>`<div class="prob"><span class="lvl ${l}">${l=='e'?'Error':'Warning'}</span>${t}${big?`<span class="go">${w} ›</span>`:''}</div>`).join('');
  },
  flow: (big, r) => big ? bigFlow(r) : `<div class="mini"><svg>${MINIW.map(([a,b])=>`<line x1="${MINI[a][1]}%" y1="${MINI[a][2]}%" x2="${MINI[b][1]}%" y2="${MINI[b][2]}%"/>`).join('')}</svg>${MINI.map(([n,x,y],i)=>`<div class="node" style="left:${x}%;top:${y}%">${n}</div>`).join('')}</div>`,
  preview: (big, r) => big ? `<div class="phonestage" style="padding-left:${r.l}px;padding-right:${r.rt}px"><div class="phone"><div class="bubble">Ich bin der Papst.</div><div class="fig"></div></div></div>` : `<div class="phone"><div class="bubble">Ich bin der Papst.</div><div class="fig"></div></div>`,
  stage3d: (big, r) => big ? big3d(r) : `<div class="rows">${['Poster – Kathedrale','Pillar','Crate','Camera 1','Light – key'].map((n,i)=>`<div class="row ${i==0?'sel':''}">${n}</div>`).join('')}</div>`,
  character: (big, r) => big ? bigCharacter(r) : `<div class="rows">${['Cat Pope','Biker','Nun'].map((n,i)=>`<div class="row ${i==0?'sel':''}">${n}<span class="n">${['4 moods','2 moods','1 mood'][i]}</span></div>`).join('')}</div>`,
  library: big => `<div style="display:flex;gap:.4rem;margin-bottom:.5rem"><button class="btn" style="flex:1;text-align:left;color:var(--muted)">Search name, folder…</button><button class="btn primary">Upload</button></div><div class="tiles">${Array.from({length:big?36:9},()=>'<div class="tile"></div>').join('')}</div>`
};
function bigFlow(r){
  // the graph has its own space (1440 × 900), centred on the part the panels leave free – it still runs under them and the bar
  const ox = r.l + (r.w-r.l-r.rt-1440)/2, oy = (r.h-900)/2, P = G.map(([,,x,y])=>[x/100*1440+ox, y/100*900+oy]), half = 4.6*rem;
  const wire = ([a,b]) => { const [x1,y1] = P[a], [x2,y2] = P[b], s = x1+half, e = x2-half, c = Math.max(40, Math.abs(e-s)/2);
    return `<path class="${HOT.has(a+'-'+b)?'hot':''}" d="M${s},${y1} C${s+c},${y1} ${e-c},${y2} ${e},${y2}"/>`; };
  return `<div class="graph"><svg viewBox="0 0 ${r.w} ${r.h}">${GW.map(wire).join('')}</svg>${G.map(([n,k],i)=>`<div class="gnode ${i==2?'sel':''}" style="left:${P[i][0]}px;top:${P[i][1]}px"><span class="label">${k}</span>${n}</div>`).join('')}</div>`;
}

      ${o('pillar',45,10,4,26)}${o('pillar',101,10,4,26)}

    </div><div class="horizon"></div>
    <svg class="gizmo" style="left:${r.w/2-60}px;top:${r.h*.61-60}px;width:120px;height:120px" viewBox="0 0 120 120"><path d="M60 60V12" stroke="#4cc35a" stroke-width="2"/><path d="M60 60H110" stroke="#e5483b" stroke-width="2"/><path d="M60 60L28 86" stroke="#00d1ff" stroke-width="2"/><circle cx="60" cy="60" r="4" fill="#f3f3f0"/></svg>

    ${j(0,4.1)}${j(0,3.1)}${j(0,1.6)}${j(-.95,2.8)}${j(-1.4,1.2)}${j(.95,2.8)}${j(1.6,4.2)}
    </svg>

const chapterForm = () => `
  <div class="pagehead">${ICON.form}<span class="t">Chapter 2 – Die Kathedrale</span></div>
  <div class="cols"><div class="field"><span class="label">Title</span><input value="Die Kathedrale"></div><div class="field"><span class="label">Number</span><input value="2"></div></div>
  <div class="field"><span class="label">Season</span><div class="seg" style="align-self:flex-start"><button class="on">Season 1</button><button>Season 2</button></div></div>
  <div class="field warn"><span class="label">Description</span><textarea>Cat Pope enters the cathedral.</textarea><span class="hint">Short for the reader's card – two sentences read better.</span></div>
  <div class="field"><span class="label">Cover</span><div class="slot">Cover slot</div></div>
  <div class="field"><span class="label">Groups</span><div class="rows">${['Arrival','The cathedral','Confession','Altar','Ending'].map((g,i)=>`<div class="row">Group ${i+1} – ${g}<span class="n">${[4,6,3,5,2][i]} slices</span></div>`).join('')}</div></div>
  <div class="field"><span class="label">State</span><span style="font-size:var(--small)">Draft · not live yet</span></div>`;
const problemsPage = () => `<div class="pagehead"><span class="t">Problems</span><span class="label">2 errors · 6 warnings</span></div>${body.problems(true)}`;

// ── the chapter preset (presets.ts), plus a "Stages" panel borrowing the experience and character workspaces' stages for this draft ──
const SPEC = [
  {id:'left', tabs:['tree','toon']},
  {id:'right', tabs:['problems','flow']},
  {id:'preview', tabs:['preview','stage3d','character']},
  {id:'library', tabs:['library'], folded:true}
];
let state;
function reset(){
  state = {stage:[], split:.5, dialog:null, dialogFrom:null, focus:'right',
    panels: SPEC.map(s=>({id:s.id, tabs:[...s.tabs], on:s.tabs[0], folded:!!s.folded}))};
}
const panel = id => state.panels.find(p=>p.id===id);
const holder = tab => state.panels.find(p=>p.tabs.includes(tab));
const onStage = tab => state.stage.find(s=>s.tab===tab);
const headOnly = p => p.folded || state.stage.some(s=>s.from===p.id && s.tab===p.on);

// geometry: two columns of panels clear of the bar's row; the stage is the whole window
function geom(){
  const W = innerWidth, H = innerHeight;
  const leftW = 18*rem, rightW = 25*rem, headH = 2.35*rem;
  const g = {W, H, rects:{}};
  g.rects.left = {x:GAP, y:TOP+GAP, w:leftW, h:H-TOP-2*GAP};
  const rx = W-GAP-rightW, top = TOP+GAP, bottom = H-GAP;
  const lib = {x:rx, y:bottom-headH, w:rightW, h:headH};
  const avail = lib.y - GAP - top;
  const r = panel('right'), pv = panel('preview');
  let rh = r && headOnly(r) ? headH : avail*.56;
  let ph = pv ? (headOnly(pv) ? headH : avail - rh - GAP) : 0;
  if (r && !headOnly(r) && pv && headOnly(pv)) rh = avail - headH - GAP;
  g.rects.right = {x:rx, y:top, w:rightW, h:rh};
  g.rects.preview = {x:rx, y:top+rh+GAP, w:rightW, h:pv && headOnly(pv) ? headH : ph};
  g.rects.library = lib;
  for (const p of state.panels) if (!g.rects[p.id]) g.rects[p.id] = {x:W/2-10*rem, y:H-GAP-16*rem, w:20*rem, h:16*rem};
  g.free = {x:GAP+leftW+GAP, y:TOP+GAP, w:rx-GAP-(GAP+leftW+GAP), h:H-TOP-2*GAP};
  g.full = {x:0, y:0, w:W, h:H};
  const sx = Math.round(W*state.split);
  g.halves = [{x:0, y:0, w:sx, h:H}, {x:sx, y:0, w:W-sx, h:H}];
  return g;
}
const css = r => `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;
const stageRects = g => state.stage.length===2 ? g.halves : [g.full];

// a page keeps its content clear of the bar's row and of the panels; its ground runs under both
const clear = (r, g) => ({...r, l:Math.max(GAP*1.5, g.free.x - r.x + GAP), rt:Math.max(GAP*1.5, (r.x + r.w) - (g.free.x + g.free.w) + GAP)});
function pageBox(id, r, g, inner, extra=''){
  const {l, rt} = clear(r, g);
  return `<div class="box page" ${id} ${extra} style="${css(r)}"><div class="pagebody" style="padding-left:${l}px;padding-right:${rt}px"><div class="pagecol">${inner}</div></div></div>`;
}

function render(){
  const g = geom(), S = state.stage;
  let st = '';
  if (!S.length){
    st = pageBox('id="view"', g.full, g, chapterForm());
  } else {
    const R = stageRects(g);
    S.forEach((s,i)=>{
      const r = clear(R[i], g);
      st += CANVAS.includes(s.tab) ? `<div class="box canvas" data-stage="${s.tab}" style="${css(r)}">${body[s.tab](true, r)}</div>`
        : pageBox(`data-stage="${s.tab}"`, r, g, s.tab==='problems' ? problemsPage() : body[s.tab](true, r));
    });
    if (S.length===2) st += `<div class="divider" id="divider" style="left:${g.halves[1].x}px" title="Drag: share the stage"></div>`;
    const chips = S.map(s=>`<button class="on chip" draggable="true" data-stagechip="${s.tab}" title="${NAMES[s.tab]} on the stage – drag it back onto a panel"><span class="dot"></span>${NAMES[s.tab]}</button><button class="round" data-back="${s.tab}" title="${NAMES[s.tab]} back into its panel${s===S[S.length-1]?' (Esc)':''}">${ICON.back}</button>`).join('<span class="sep"></span>');
    st += `<div class="stagepill pill" style="left:${g.free.x+g.free.w/2}px;bottom:${GAP}px"><button id="viewpill" data-home title="Back to the workspace's view">${ICON.form}${VIEW}</button><span class="sep"></span>${chips}</div>`;
  }
  $('#stage').innerHTML = st;

  $('#panels').innerHTML = state.panels.map(p=>{
    const r = g.rects[p.id], only = headOnly(p);
    const mainHere = !!state.stage.find(s=>s.from===p.id && s.tab===p.on);
    const btns = p.folded ? `<button class="hb" data-fold="${p.id}" title="Unfold">${ICON.unfold}</button>`
      : `<button class="hb" data-over="${p.id}" title="Over everything: ${NAMES[p.on]} (O)">${ICON.over}</button>`+
        `<button class="hb ${mainHere?'on':''}" data-main="${p.id}" aria-pressed="${mainHere}" title="${mainHere?'Back into its panel (Esc)':NAMES[p.on]+' takes the stage (M)'}">${mainHere?ICON.back:ICON.main}</button>`+
        (mainHere ? '' : `<button class="hb" data-fold="${p.id}" title="Fold">${ICON.fold}</button><button class="hb" title="Close">${ICON.close}</button>`);
    return `<div class="panel" data-panel="${p.id}" style="${css({...r, h: only ? 2.35*rem : r.h})}">
      <div class="head" data-head="${p.id}"><div class="grip">⠿</div>
        <div class="tabs">${p.tabs.map(t=>{ const there = state.stage.find(s=>s.tab===t && s.from===p.id);
          return `<button class="tab ${t===p.on && !there?'on':''}" draggable="true" data-tab="${t}" data-from="${p.id}" ${there?'title="On the stage"':''}>${there?'<span class="dot"></span>':''}${NAMES[t]}</button>`; }).join('')}</div>
        ${btns}
      </div>
      ${only ? '' : `<div class="content">${body[p.on](false)}</div>`}
    </div>`;
  }).join('');

  const d = $('#dialog');
  d.classList.toggle('open', !!state.dialog);
  d.innerHTML = state.dialog ? `<div class="dbox" id="dialogbox"><div class="dhead"><span class="tab on">${NAMES[state.dialog]}</span><span class="label" style="margin-left:.4rem">over everything</span><span class="sp"></span><button class="hb" data-closeover title="Back into its panel (Esc)">${ICON.back}</button><button class="hb" data-closeover title="Close">${ICON.close}</button></div><div class="dbody">${body[state.dialog](true, {w:innerWidth-5*rem, h:innerHeight-8*rem})}</div></div>` : '';
  notes();
}

// ── motion: a ghost flies from the old rect to the new one (~180 ms), the target fades in under it ──
const rectOf = el => { const r = el.getBoundingClientRect(); return {x:r.left, y:r.top, w:r.width, h:r.height}; };
function fly(from, to, label){
  const g = document.createElement('div'); g.className = 'ghost'; g.innerHTML = `<span class="label">${label}</span>`;
  document.body.append(g);
  const k = r => ({left:r.x+'px', top:r.y+'px', width:r.w+'px', height:r.h+'px'});
  Object.assign(g.style, k(to));
  return g.animate([k(from), k(to)], {duration:DUR, easing:'cubic-bezier(.2,.7,.2,1)'}).finished.then(()=>g.remove());
}
function move(mutate, plan){
  const froms = plan.map(p=>{ const el = p.from(); return el ? rectOf(el) : null; });
  mutate(); render();
  const tos = plan.map(p=>p.to());
  tos.forEach(t=>t && t.classList.add('arriving'));
  Promise.all(plan.map((p,i)=>froms[i] && tos[i] ? fly(froms[i], rectOf(tos[i]), p.label) : null))
    .then(()=>tos.forEach(t=>t && t.classList.remove('arriving')));
}
const panelEl = id => document.querySelector(`[data-panel="${id}"]`);
const stageEl = tab => document.querySelector(`[data-stage="${tab}"]`);
const tabSrc = (pid, tab) => { const p = panel(pid); return p && p.on===tab && !headOnly(p) ? panelEl(pid).querySelector('.content') : panelEl(pid)?.querySelector(`[data-tab="${tab}"]`) ?? panelEl(pid); };
const panelDst = pid => panelEl(pid)?.querySelector('.content') ?? panelEl(pid);

// ◱ / M / 1–4: this tab alone on the stage – whatever was there flies back
function send(tab, pid){
  if (onStage(tab)) return back(tab);
  const plan = state.stage.length ? state.stage.map(s=>({from:()=>stageEl(s.tab), to:()=>tabSrc(s.from, s.tab), label:NAMES[s.tab]}))
    : [{from:()=>$('#view'), to:()=>$('#viewpill'), label:VIEW}];
  plan.push({from:()=>tabSrc(pid, tab), to:()=>stageEl(tab), label:NAMES[tab]});
  move(()=>{ state.stage = [{tab, from:pid}]; panel(pid).on = tab; panel(pid).folded = false; state.focus = pid; }, plan);
}
// a second tab dropped on a half: the stage splits (or that half is replaced); never more than two
function splitIn(tab, pid, side){
  if (onStage(tab) || !state.stage.length) return send(tab, pid);
  const plan = [];
  let next;
  if (state.stage.length===1){
    const keep = state.stage[0];
    next = side==='left' ? [{tab, from:pid}, keep] : [keep, {tab, from:pid}];   // the kept tab just gives up a half, no flight
  } else {
    const i = side==='left' ? 0 : 1, out = state.stage[i];
    next = [...state.stage]; next[i] = {tab, from:pid};
    plan.push({from:()=>stageEl(out.tab), to:()=>tabSrc(out.from, out.tab), label:NAMES[out.tab]});
  }
  plan.push({from:()=>tabSrc(pid, tab), to:()=>stageEl(tab), label:NAMES[tab]});
  move(()=>{ state.stage = next; state.split = .5; panel(pid).on = tab; panel(pid).folded = false; state.focus = pid; }, plan);
}
// one tab back into its panel; a split becomes one full stage again, the last one gives the stage back to the view
function back(tab){
  if (!state.stage.length) return;
  const s = tab ? onStage(tab) : state.stage[state.stage.length-1]; if (!s) return;
  const rest = state.stage.filter(x=>x!==s);
  const plan = [{from:()=>stageEl(s.tab), to:()=>panelDst(s.from), label:NAMES[s.tab]}];
  if (!rest.length) plan.push({from:()=>$('#viewpill'), to:()=>$('#view'), label:VIEW});
  move(()=>{ state.stage = rest; }, plan);
}
function home(){
  if (!state.stage.length) return;
  move(()=>{ state.stage = []; }, [...state.stage.map(s=>({from:()=>stageEl(s.tab), to:()=>panelDst(s.from), label:NAMES[s.tab]})),
    {from:()=>$('#viewpill'), to:()=>$('#view'), label:VIEW}]);
}
function over(tab, pid){
  move(()=>{ state.dialog = tab; state.dialogFrom = pid; }, [{from:()=>tabSrc(pid, tab), to:()=>$('#dialogbox'), label:NAMES[tab]}]);
}
function closeOver(){
  const tab = state.dialog, pid = state.dialogFrom;
  const fromRect = rectOf($('#dialogbox'));
  state.dialog = null; render();
  const to = pid && panelEl(pid) ? (headOnly(panel(pid)) ? panelEl(pid) : panelDst(pid)) : null;
  if (to){ to.classList.add('arriving'); fly(fromRect, rectOf(to), NAMES[tab]).then(()=>to.classList.remove('arriving')); }
}
function toggleSplit(){
  const S = state.stage;
  if (S.length===2) return back(S[1].tab);
  if (!S.length){ state.stage = [{tab:'flow', from:'right'}]; panel('right').on = 'flow'; render(); }
  const second = state.stage[0].tab==='preview' ? 'flow' : 'preview';
  splitIn(second, holder(second).id, 'right');
}

// ── clicks ──
document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  const ph = t.closest('[data-panel]'); if (ph) state.focus = ph.dataset.panel;
  if (d.tab && d.from){ const p = panel(d.from); p.on = d.tab; p.folded = false; return render(); }
  if (d.main){ const p = panel(d.main); return send(p.on, p.id); }
  if (d.over){ const p = panel(d.over); return over(p.on, p.id); }
  if (d.fold){ const p = panel(d.fold); p.folded = !p.folded; return render(); }
  if (d.back !== undefined) return back(d.back || null);
  if (d.home !== undefined) return home();
  if (d.closeover !== undefined) return closeOver();
  if (t.id==='notesmin') return $('#notes').classList.toggle('min');
  if (t.id==='themebtn') return toggleTheme();
  if (d.go){ const [tab, sp] = d.go.split(':'); reset(); render(); send(tab, holder(tab).id); if (sp) setTimeout(()=>splitIn('preview', 'preview', 'right'), DUR+40); }
});
$('#dialog').addEventListener('click', e=>{ if (e.target.id==='dialog') closeOver(); });

// ── keys ──
function toggleTheme(){ const h = document.documentElement; h.dataset.theme = h.dataset.theme==='day' ? 'night' : 'day'; }
const KEYTAB = {'1':'flow','2':'stage3d','3':'character','4':'problems'};
document.addEventListener('keydown', e=>{
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { if (e.key==='Escape') document.activeElement.blur(); return; }
  const k = e.key.toLowerCase();
  if (k==='escape'){ if (state.dialog) closeOver(); else back(); }
  else if (k==='m'){ const p = panel(state.focus) ?? panel('right'); send(p.on, p.id); }
  else if (k==='o'){ const p = panel(state.focus) ?? panel('right'); if (state.dialog) closeOver(); else over(p.on, p.id); }
  else if (KEYTAB[k]){ const t = KEYTAB[k]; if (onStage(t) && state.stage.length===1) back(t); else send(t, holder(t).id); }
  else if (k==='s') toggleSplit();
  else if (k==='t') toggleTheme();
  else if (k==='n') $('#notes').classList.toggle('min');
});
document.addEventListener('focusin', e=>{ const p = e.target.closest?.('[data-panel]'); if (p) state.focus = p.dataset.panel; });

// ── drag a tab onto the stage (a half, once something is there); drag a stage chip back onto a panel ──
let moving = null;
const dz = $('#dropzone');
function showDrop(r, text){ dz.innerHTML = r ? `<div class="drop" style="${css(r)}"><span>${text}</span></div>` : ''; }
function dropPlan(x){
  const g = geom(), S = state.stage, n = NAMES[moving.tab];
  if (!S.length) return {r:g.full, text:`${n} takes the stage`};
  if (onStage(moving.tab)) return null;
  const side = x < g.W/2 ? 'left' : 'right', r = side==='left' ? {x:0, y:0, w:g.W/2, h:g.H} : {x:g.W/2, y:0, w:g.W/2, h:g.H};
  if (S.length===1) return {r, side, text:`${n} splits the stage – ${side}`};
  return {r: g.halves[side==='left'?0:1], side, text:`${n} replaces ${NAMES[S[side==='left'?0:1].tab]}`};
}
document.addEventListener('dragstart', e=>{
  const t = e.target.closest('[data-tab],[data-stagechip]'); if (!t) return;
  moving = t.dataset.tab ? {tab:t.dataset.tab, from:t.dataset.from} : {tab:t.dataset.stagechip, from:'stage'};
  t.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', moving.tab);
});
document.addEventListener('dragover', e=>{
  if (!moving) return; e.preventDefault();
  document.querySelectorAll('.droptarget').forEach(x=>x.classList.remove('droptarget'));
  const p = e.target.closest('[data-panel]');
  if (moving.from==='stage'){ showDrop(null); if (p) p.classList.add('droptarget'); return; }
  if (p || e.target.closest('.bar,.stagepill,.notes')) return showDrop(null);
  const plan = dropPlan(e.clientX); showDrop(plan?.r, plan?.text);
});
document.addEventListener('drop', e=>{
  if (!moving) return; e.preventDefault();
  const m = moving, plan = dropPlan(e.clientX); moving = null; showDrop(null);
  const p = e.target.closest('[data-panel]');
  if (m.from==='stage'){
    if (!p) return render();
    const s = onStage(m.tab), into = panel(p.dataset.panel), origin = panel(s.from);
    if (into!==origin){ origin.tabs = origin.tabs.filter(t=>t!==m.tab); if (origin.on===m.tab) origin.on = origin.tabs[0]; into.tabs.push(m.tab); into.folded = false; s.from = into.id; if (!origin.tabs.length) state.panels = state.panels.filter(x=>x!==origin); }
    into.on = m.tab; return back(m.tab);
  }
  if (p || e.target.closest('.bar,.stagepill,.notes') || !plan) return render();
  plan.side ? splitIn(m.tab, m.from, plan.side) : send(m.tab, m.from);
});
document.addEventListener('dragend', ()=>{ moving = null; showDrop(null); document.querySelectorAll('.dragging,.droptarget').forEach(x=>x.classList.remove('dragging','droptarget')); });

// ── the split's divider ──
let dragging = false;
document.addEventListener('pointerdown', e=>{ if (e.target.id==='divider'){ dragging = true; e.target.classList.add('dragging'); e.target.setPointerCapture(e.pointerId); } });
document.addEventListener('pointermove', e=>{ if (!dragging) return; state.split = Math.min(.75, Math.max(.25, e.clientX/innerWidth)); render(); $('#divider')?.classList.add('dragging'); });
document.addEventListener('pointerup', ()=>{ if (dragging){ dragging = false; render(); } });
addEventListener('resize', ()=>render());

// ── the notes ──
function notes(){
  const el = $('#notes'), min = el.classList.contains('min');
  const go = (t, label, sp='') => `<button class="btn" data-go="${t}${sp}">${label}</button>`;
  el.innerHTML = `<h3><span>Taking the stage – A, round 2</span><span class="sp"></span><button class="btn" id="themebtn" title="T">Day / Night</button><button class="btn" id="notesmin" title="N">${min?'+':'–'}</button></h3>
    <div class="more">
    <div style="display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.4rem">${go('flow','Flow')}${go('stage3d','3D stage')}${go('character','Character')}${go('problems','Problems')}${go('flow','Flow | Preview',':split')}</div>
    <dl>
      <dt>The stage</dt><dd>A tab on the stage fills the whole window, edge to edge – under the bar too. The bar is only pills on it (see-through ground, halo); the panels float over it. Flow, a 3D stage, a character stage: the backstage is the whole window.</dd>
      <dt>Pages</dt><dd>A list or a form (Problems, the chapter form) keeps the ground under the bar and the panels; only its text stays clear of the bar's row and of the panels.</dd>
      <dt>Way in</dt><dd>◱ on a panel's head, <kbd>M</kbd>, or drag a tab onto the stage. The tab's panel folds to its head, a dot marks the tab. The chapter form waits in the bottom pill.</dd>
      <dt>Way back</dt><dd>◱ again, <kbd>Esc</kbd>, "Chapter" or ◱ in the bottom pill, or drag the pill's tab onto a panel. Every move flies (~180 ms).</dd>
      <dt>Split</dt><dd>With a tab on the stage, drop a second tab on the left or right half: the stage splits, a hairline divider to drag. Sending back or closing one side gives the other the whole stage again. Never more than two, no nesting, no grid. ◱ on a third tab always means "this one alone".</dd>
      <dt>⤢ over</dt><dd>Stays for browse-and-pick (the Library): a dialog over everything, the bar too; Esc or a click beside it.</dd>
    </dl>
    <p class="rec"><span class="label">Considered</span><br>
      B, sheet between the panels – a canvas never gets the whole window, and the room between the panels is narrow at 1440.<br>
      C, split inside the room between the panels – two phone-wide halves; its good part (side by side) lives on as the split above.</p>
    <p style="color:var(--muted)">Keys: <kbd>1</kbd> Flow · <kbd>2</kbd> 3D stage · <kbd>3</kbd> Character · <kbd>4</kbd> Problems · <kbd>S</kbd> split · <kbd>M</kbd> ◱ · <kbd>O</kbd> ⤢ · <kbd>Esc</kbd> back · <kbd>T</kbd> day · <kbd>N</kbd> notes. The Stages panel borrows the experience and character workspaces' stages for this draft. Not real data.</p></div>`;
}

if (q.get('theme')==='day') document.documentElement.dataset.theme = 'day';
if (q.has('quiet')) $('#notes').classList.add('min');
reset();
const start = q.get('tab') ?? q.get('main');
if (start && holder(start)){ const p = holder(start); p.on = start; state.stage = [{tab:start, from:p.id}]; }
if (q.get('split')==='1'){
  if (!state.stage.length){ state.stage = [{tab:'flow', from:'right'}]; panel('right').on = 'flow'; }
  const second = state.stage[0].tab==='preview' ? 'flow' : 'preview', hp = holder(second);
  hp.on = second; state.stage.push({tab:second, from:hp.id});
}
const ov = q.get('over');
if (ov && holder(ov)){ state.dialog = ov; state.dialogFrom = holder(ov).id; }
render();
</script>
</body>
</html>
