<style>
@font-face{font-family:"Noto Sans";src:url("file:///C:/Development/scutoons/deck/kit/assets/NotoSans-Regular-latin.ttf");font-weight:400}

:root,[data-theme=night]{
  --stage:#000000;--surface:#1a1c18;--head:#141612;--line:#3a4034;--text:#f3f3f0;--muted:#a7af9b;--control:#262922;
  --hover:#2e3229;--pressed:#f3f3f0;--pressed-text:#171916;--selected:#3a4132;--within:#23261f;--accent:#f3f3f0;
  --primary:#f3f3f0;--primary-line:#f3f3f0;--primary-ink:#171916;--warn:#f0a030;--go:#4cc35a;
  --ground:rgb(26 28 24 / 0.5);--halo:0 0 2px #1a1c18, 0 0 2px #1a1c18, 0 0 3px #1a1c18;--ai:#c58cff;--glow:#1f251c;--veil:rgb(0 0 0/.76);--shade:rgb(0 0 0/.45);
}
[data-theme=day]{
  --stage:#ffffff;--surface:#f3f3f0;--head:#e8eae2;--line:#d9decf;--text:#171916;--muted:#4f5747;--control:#fffffb;
  --hover:#e4e8dc;--pressed:#22271e;--pressed-text:#ffffff;--selected:#d5dbc9;--within:#e2e6da;--accent:#00728d;
  --primary:#f3f3f0;--primary-line:#f3f3f0;--primary-ink:#171916;--warn:#b86e0c;--go:#2e8a3e;

}
:root{--gap:1rem;--small:.86rem;--label:.72rem;--title:1.15rem;--row:2.15rem;--radius:.36rem;--top:3.6rem;--spacing:.15em}
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;height:100vh;overflow:hidden;background:var(--stage);color:var(--text);font:400 1rem/1.35 "Noto Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.label{font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase;color:var(--muted)}
svg.i{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* the one bar */
.bar{position:fixed;z-index:50;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;gap:.5rem;padding:0 var(--gap);pointer-events:none}
.bar>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:.25rem;height:var(--row);padding:0 .3rem;border-radius:calc(var(--row)/2);background:var(--ground);text-shadow:var(--halo);box-shadow:0 0 0 1px var(--line),0 .2rem .6rem rgb(0 0 0/.2);backdrop-filter:blur(6px);flex:none}
.pill button{flex:none;height:calc(var(--row) - .5rem);min-width:calc(var(--row) - .5rem);padding:0 .6rem;border:0;border-radius:1rem;background:transparent;display:flex;align-items:center;gap:.35rem;white-space:nowrap;font-size:var(--small);position:relative}
.pill button.on{color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.pill.tabs button:not(.on):not(.round){color:var(--muted)}
.pill button.lit{box-shadow:0 0 0 2px var(--accent)}
.pill button.dimws{opacity:.45}
.pill .round{padding:0;justify-content:center}
.pill .lab{display:flex;align-items:center;gap:.3rem;white-space:nowrap;padding:0 .4rem;color:var(--muted);font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase}
.pill .strip{display:flex;gap:.25rem;overflow:hidden;min-width:0;flex:1;mask-image:linear-gradient(90deg,transparent,#000 1.6rem,#000 calc(100% - 1.6rem),transparent)}
.pill .seg2{display:flex;border-radius:1rem;box-shadow:inset 0 0 0 1px var(--line);padding:.12rem}
.pill .seg2 span{padding:.1rem .55rem;border-radius:.8rem;font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase;color:var(--muted)}
.pill .seg2 span.on{color:var(--text);box-shadow:inset 0 0 0 1px var(--muted)}
.middle{flex:1;display:flex;justify-content:center;min-width:0}
.dirty{width:.42rem;height:.42rem;border-radius:50%;background:var(--warn);flex:none}
.pdot{position:absolute;right:.15rem;top:.15rem;width:.42rem;height:.42rem;border-radius:50%;background:var(--warn)}
.face{width:1.15rem;height:1.15rem;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgb(255 255 255/.7)}

/* panels: the head has no background of its own, no grip; the whole head drags */
.panel{position:fixed;z-index:20;background:var(--surface);border-radius:.6rem;box-shadow:0 0 0 1px var(--line),0 .5rem 1.5rem rgb(0 0 0/.4);display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:.2rem;height:2.3rem;padding:0 .35rem 0 .45rem;flex:none;cursor:grab}
.ph .t{height:1.7rem;padding:0 .7rem;border-radius:1rem;display:flex;align-items:center;font-size:var(--small);color:var(--muted);opacity:.8;white-space:nowrap}
.ph .t.on{color:var(--text);opacity:1;box-shadow:inset 0 0 0 1px var(--line)}
.ph .sp{flex:1}
.ph .ic{width:1.7rem;height:1.7rem;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:50%}
.pb{padding:.6rem .8rem;overflow:hidden;flex:1;font-size:var(--small)}
.field{margin:0 0 .65rem}
.field .v{margin-top:.25rem;height:2rem;border-radius:var(--radius);background:var(--control);display:flex;align-items:center;padding:0 .6rem;gap:.4rem}
.field .v.area{height:4rem;align-items:flex-start;padding-top:.4rem;color:var(--muted)}
.lrow{display:flex;align-items:center;gap:.5rem;height:1.95rem}
.lrow .m{margin-left:auto;color:var(--muted);font-size:.72rem}
.lrow.sel{background:var(--selected);border-radius:var(--radius);margin:0 -.4rem;padding:0 .4rem}

/* stage */
.art{position:fixed;inset:0;z-index:1}
.art svg{width:100%;height:100%}
.ground{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 55% 55% at 50% 50%,var(--glow),var(--stage) 72%)}

/* status bar */
.status{position:fixed;z-index:40;left:var(--gap);right:var(--gap);bottom:.6rem;height:2.1rem;border-radius:1.05rem;background:var(--ground);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;padding:0 1rem;gap:1rem;font-size:var(--small);color:var(--muted);backdrop-filter:blur(6px)}
.status .r{margin-left:auto}
.status b{font-weight:400;color:var(--warn)}

/* menus */
.menu{position:fixed;z-index:60;background:var(--surface);border-radius:.6rem;box-shadow:0 0 0 1px var(--line),0 .6rem 1.8rem rgb(0 0 0/.5);padding:.35rem;font-size:var(--small);min-width:17rem}
.menu .row{display:flex;align-items:center;gap:.55rem;height:2.1rem;padding:0 .6rem;border-radius:var(--radius);white-space:nowrap}
.menu .row.hi{background:var(--hover)}
.menu .row .meta{margin-left:auto;color:var(--muted);font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase}
.menu .row.off{color:var(--muted)}
.menu .hr{height:1px;background:var(--line);margin:.35rem .2rem}
.menu .head{padding:.45rem .6rem .2rem}
.seg{display:flex;gap:.1rem;margin-left:auto}
.seg span{width:1.75rem;height:1.55rem;display:flex;align-items:center;justify-content:center;border-radius:.8rem;color:var(--muted)}
.seg span.on{color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}

/* pages */
.page{position:fixed;inset:0;overflow:hidden;padding:calc(var(--top) + 1.5rem) 0 4rem}
.col{max-width:72rem;margin:0 auto;padding:0 2rem}
h1{font-size:1.5rem;font-weight:400;margin:0 0 .3rem}
h2{font-size:var(--title);font-weight:400;margin:0}
.sub{color:var(--muted);font-size:var(--small)}
.chip{display:inline-flex;align-items:center;gap:.35rem;height:1.75rem;padding:0 .7rem;border-radius:.9rem;background:transparent;box-shadow:0 0 0 1px var(--line);font-size:var(--small);color:var(--muted)}
.chip.on{color:var(--text);box-shadow:0 0 0 1px var(--text)}
.box{background:var(--surface);border-radius:.6rem;box-shadow:0 0 0 1px var(--line);padding:.8rem 1rem}
.list .li{display:flex;align-items:center;gap:.6rem;height:2.05rem;font-size:var(--small);border-bottom:1px solid var(--line)}
.list .li:last-child{border:0}
.list .li .m{margin-left:auto;color:var(--muted);font-size:var(--label)}
.btn{display:inline-flex;align-items:center;gap:.4rem;height:2.1rem;padding:0 1rem;border-radius:1.05rem;border:0;background:var(--control);box-shadow:0 0 0 1px var(--line);font-size:var(--small)}
.btn.primary{background:var(--primary);color:var(--primary-ink);box-shadow:none}

/* dashboard (app switcher) */
.dboard{position:fixed;z-index:47;top:calc(var(--top) + .6rem);left:1.4rem;right:1.4rem;bottom:3.4rem}
.dsearch{display:flex;align-items:center;gap:.6rem;height:2.9rem;padding:0 1rem;border-radius:1.45rem;background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--muted)}
.dsearch .kbd{margin-left:auto}
.twobox{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-top:.8rem}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;align-items:start}
.wcard{background:var(--surface);border-radius:.7rem;box-shadow:0 0 0 1px var(--line);overflow:hidden;padding-bottom:.6rem;position:relative}
.wcard.focus{box-shadow:0 0 0 2px var(--accent)}
.wcard.lift{box-shadow:0 0 0 1px var(--text),0 1rem 2rem rgb(0 0 0/.6)}
.wcard .wthumb{height:6rem;position:relative;background:#0b0c0a}
.wcard .wthumb svg{position:absolute;inset:0;width:100%;height:100%}
.wcard .x{position:absolute;right:.4rem;top:.4rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--ground);display:flex;align-items:center;justify-content:center}
.wcard .front{position:absolute;left:.5rem;top:.5rem;padding:.1rem .5rem;border-radius:.8rem;background:var(--ground);font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase}
.wcard .wname{padding:.5rem .75rem 0;display:flex;align-items:center;gap:.4rem}
.wcard .what{padding:.12rem .75rem 0;color:var(--muted);font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wviews{display:flex;align-items:center;gap:.4rem;margin:.5rem .6rem 0;padding:.3rem .5rem;border-radius:var(--radius);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--small)}
.wcard .wviews.open{box-shadow:inset 0 0 0 1px var(--text)}
.wcard .wviews .meta{margin-left:auto;color:var(--muted);font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.wcard.new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;color:var(--muted);background:transparent;border:1px dashed var(--line);box-shadow:none;font-size:var(--small);min-height:9.4rem}
.dfoot{position:fixed;z-index:47;left:1.4rem;right:1.4rem;bottom:.6rem;height:2.1rem;display:flex;align-items:center;gap:.6rem;padding:0 .4rem;color:var(--muted);font-size:var(--small)}
.dfoot .sep{width:1px;height:1rem;background:var(--line)}

/* first login */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.ctile{position:relative;height:8.2rem;border-radius:.8rem;background:var(--surface);box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:.9rem;color:var(--muted)}
.ctile > svg{position:absolute;left:.9rem;top:.9rem}
.ctile .cn{font-size:1.05rem}
.ctile .cm{font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase;margin-top:.2rem}
.ctile.on{color:var(--text);box-shadow:0 0 0 1px var(--text)}
.ctile .ck{position:absolute;right:.7rem;top:.7rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--text);color:var(--surface);display:flex;align-items:center;justify-content:center}

/* notes */
.note{position:fixed;z-index:70;max-width:20rem;padding:.55rem .75rem;border-radius:.5rem;background:#fff6c8;color:#2a2610;font-size:.78rem;line-height:1.42;box-shadow:0 .3rem 1rem rgb(0 0 0/.5)}
.note b{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.12rem}
.note.ai{background:#efe0ff;color:#2b1240}
.note i{font-style:normal;background:rgb(0 0 0/.08);padding:0 .25rem;border-radius:.2rem}
body.quiet .note{display:none}
.kbd{margin-left:.6rem;padding:.05rem .45rem;border-radius:.3rem;box-shadow:0 0 0 1px var(--line);font-size:.72rem;color:var(--muted);white-space:nowrap}

/* launcher */
.launch{position:fixed;z-index:70;left:50%;top:15%;transform:translateX(-50%);width:42rem;background:var(--surface);border-radius:.8rem;box-shadow:0 0 0 1px var(--line),0 1rem 3rem rgb(0 0 0/.6);overflow:hidden}
.launch .in{display:flex;align-items:center;gap:.6rem;height:3.4rem;padding:0 1rem;font-size:1.25rem;border-bottom:1px solid var(--line)}
.launch .in .caret{width:2px;height:1.4rem;background:var(--accent)}
.launch .grp{padding:.35rem .4rem .15rem}
.launch .grp .label{padding:.25rem .6rem}
.launch .grp.cur .label{color:var(--text)}
.launch .r{display:flex;align-items:center;gap:.6rem;height:2.3rem;padding:0 .6rem;border-radius:var(--radius);font-size:var(--small)}
.launch .r.hi{box-shadow:inset 0 0 0 1px var(--accent)}
.launch .r .m{margin-left:auto;color:var(--muted);font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase}
.launch .foot{display:flex;gap:1.2rem;padding:.5rem 1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.75rem}
.dim{position:fixed;inset:0;z-index:46;background:var(--shade)}

/* drag + snap */
.ghost{position:fixed;z-index:55;border:2px dashed var(--accent);border-radius:.6rem;background:rgb(243 243 240/.07)}
.zone{position:fixed;z-index:56;border-radius:.5rem;border:1px dashed var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase;background:rgb(0 0 0/.7)}
.zone.on{background:rgb(243 243 240/.22);border-style:solid}
.preview{position:fixed;z-index:53;background:rgb(243 243 240/.13);border:2px solid var(--accent)}
.offzone{position:fixed;z-index:57;background:linear-gradient(90deg,transparent,rgb(229 72 59/.3));display:flex;align-items:center;justify-content:center;color:#a7af9b;font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase}
.cursor{position:fixed;z-index:90;padding:.25rem .7rem;border-radius:1rem;background:var(--pressed);color:var(--pressed-text);font-size:var(--small);box-shadow:0 .3rem .8rem rgb(0 0 0/.5);white-space:nowrap}

/* frames (a screen drawn small inside a screen) */
.frame{position:fixed;z-index:30;overflow:hidden;border-radius:.6rem;box-shadow:0 0 0 1px var(--line),0 1rem 2.5rem rgb(0 0 0/.6);background:#000}
.frame .inner{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;overflow:hidden}
.fcap{position:fixed;z-index:31;font-size:var(--small);color:var(--muted)}
.fcap b{color:var(--text);font-weight:400;font-size:1rem;display:block}

/* user sheet */
.sheet{position:fixed;z-index:62;left:50%;transform:translateX(-50%);bottom:0;width:34rem;background:var(--surface);border-radius:1rem 1rem 0 0;box-shadow:0 0 0 1px var(--line),0 -1rem 3rem rgb(0 0 0/.6);padding:.6rem .8rem 2.6rem;font-size:var(--small)}
.sheet .handle{width:3rem;height:.3rem;border-radius:.2rem;background:var(--muted);margin:0 auto .8rem;opacity:.6}
.sheet .row{display:flex;align-items:center;gap:.7rem;height:2.6rem;padding:0 .6rem;border-radius:var(--radius)}
.sheet .row.hi{box-shadow:inset 0 0 0 1px var(--accent)}
.sheet .row .m{margin-left:auto;color:var(--muted);font-size:var(--label);letter-spacing:var(--spacing);text-transform:uppercase}
.sheet .hr{height:1px;background:var(--line);margin:.4rem .2rem}
.av{width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff;flex:none}

/* the screen selector: a small pill at the bottom, the whole list on hover */
.tabsel{position:fixed;z-index:95;left:50%;bottom:.85rem;transform:translateX(-50%);display:flex;align-items:center;gap:.2rem;padding:.15rem .3rem;border-radius:1rem;background:rgb(40 44 36/.92);box-shadow:0 0 0 1px #3a4034;font-size:.72rem;max-width:calc(100vw - 2rem);flex-wrap:wrap;justify-content:center}
.tabsel a{white-space:nowrap;color:#cfd6c4;text-decoration:none;padding:.1rem .5rem;border-radius:.8rem;display:none}
.tabsel a.on,.tabsel:hover a{display:block}
.tabsel a.on{box-shadow:inset 0 0 0 1px #f3f3f0;color:#f3f3f0}
.tabsel .arr{color:#a7af9b;padding:0 .3rem}
.tabsel:hover .arr{display:none}
</style>
<style>
/* palette D (lap 2 redraw, 2026-11-24 – RULES H4, H11, kit-d.html): no accent, no lime – on, selected and the primary are the text colour /
   the pressed fill; grounds see-through (the text colour at 6 / 10 / 16 %); tabs without a border at rest, the active one brighter;
   blur only on the overlay level (H15): panels and menus have none, menus opaque */
:root,[data-theme]{--accent:var(--text);--primary:var(--pressed);--primary-line:var(--pressed);--primary-ink:var(--pressed-text);
  --control:color-mix(in srgb,var(--text) 6%,transparent);--hover:color-mix(in srgb,var(--text) 10%,transparent);
  --selected:color-mix(in srgb,var(--text) 16%,transparent);--within:color-mix(in srgb,var(--text) 10%,transparent);
  --head:color-mix(in srgb,var(--text) 5%,transparent)}
.tab.on,.t.on{box-shadow:none!important;color:var(--text)}
.pill button.on,.ph .t.on{box-shadow:none!important;color:var(--text)}
.seg span.on{box-shadow:none!important;background:var(--pressed);color:var(--pressed-text)}
.panel{backdrop-filter:none!important}.menu{backdrop-filter:none!important;background:var(--surface)!important}
</style>

  <div style="position:fixed;z-index:30;right:14px;bottom:10px;font-size:.72rem;color:var(--muted);opacity:.7">Esc / Ctrl Space</div>
  ${note(40, 40, 'Full screen over everything', 'Bar, panels and status bar are gone; only the view (here the sheet) is left, with a tiny hint bottom right. In: Ctrl Space on the view under the pointer (as Blender) · the Views list’s 4th state · dragging past the top edge and holding ≈ 0.5 s · the pad’s shoulder button · a two-finger spread. Out: Esc or the same again. Not a fling up – a fling only closes (point 60).', '', '22rem')}`;
}

/* ── 20 · motion: the transitions ── */
function motion() {
  const rows = [['Hot zones while dragging','appear on drag start: fade 120 ms ease-out; the zone under the pointer lights in 100 ms','A'],
    ['Panel → snap place','the panel morphs from where it was dropped into its place: 180 ms cubic-bezier(.2,.8,.2,1)','B'],
    ['Hold → full screen','the top-edge line fills during the hold (500 ms linear = the hold), then 220 ms ease-out to full screen','C'],
    ['Take the stage','the view grows from its panel to the stage: 200 ms ease-out, the stage behind crossfades',''],
    ['Full screen in / out','bar + panels fade 120 ms, the view grows 220 ms ease-out · out 180 ms ease-in-out',''],
    ['Collapse by double-click','the body folds into the head: 160 ms ease-out (expand the same)','D'],
    ['Fling to close','follows the finger’s speed past the edge, then fades 140 ms ease-in; Ctrl Z brings it back','E'],
    ['Dashboard open / close','stage scales to .97 + blur 200 ms, cards rise 8 px with a 20 ms stagger · close 160 ms',''],
    ['Item / workspace switch','panels crossfade 150 ms; the stage item keeps its place, nothing slides','']];
  const demo = (k, t, inner) => `<div style="background:var(--surface);border-radius:.6rem;box-shadow:0 0 0 1px var(--line);padding:.6rem;height:9.6rem;position:relative;overflow:hidden"><div class="label" style="margin-bottom:.4rem">${k} · ${t}</div><div style="position:absolute;left:.6rem;right:.6rem;top:2rem;bottom:.6rem;border-radius:.4rem;background:#0b0c0a;overflow:hidden">${inner}</div></div>`;
  return `<style>
  @keyframes zoneLit{0%,15%{opacity:0}25%{opacity:1;background:transparent}45%,80%{opacity:1;background:rgb(243 243 240/.25);border-style:solid}100%{opacity:0}}
  @keyframes zoneFade{0%,15%{opacity:0}25%,80%{opacity:.6}100%{opacity:0}}
  @keyframes snapMove{0%,20%{left:30%;top:30%;width:30%;height:40%}45%,85%{left:50%;top:0;width:50%;height:100%}100%{left:30%;top:30%;width:30%;height:40%}}
  @keyframes holdFill{0%,15%{width:0}55%{width:100%}100%{width:100%}}
  @keyframes holdFull{0%,55%{inset:20% 25% 20% 25%;border-radius:.4rem}68%,92%{inset:0;border-radius:0}100%{inset:20% 25% 20% 25%}}
  @keyframes fold{0%,25%{height:4.6rem}40%,70%{height:1.3rem}85%,100%{height:4.6rem}}
  @keyframes fling{0%,20%{transform:translateX(0);opacity:1}45%{transform:translateX(260%);opacity:0}70%{transform:translateX(0);opacity:0}85%,100%{transform:translateX(0);opacity:1}}
  .mz{position:absolute;border:1px dashed var(--accent);border-radius:.3rem;animation:zoneFade 3s infinite}
  .mz.lit{animation:zoneLit 3s infinite}
  @media (prefers-reduced-motion: reduce){.mo *{animation-duration:0s!important;animation-iteration-count:1!important}}
  </style>
  <div style="position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,var(--glow),var(--stage) 70%)"></div>
  <div class="page mo" style="padding-top:2rem"><div class="col" style="max-width:86rem;display:grid;grid-template-columns:1.25fr 1fr;gap:2rem">
   <div><h1>Motion</h1><div class="sub" style="margin-bottom:.8rem">Short, 100–220 ms: ease-out for arriving, ease-in for leaving. With reduced motion: no movement, a ≤ 80 ms crossfade; the hold shows as a filling line only.</div>
    <div class="box" style="padding:.3rem .9rem"><div class="list">${rows.map(([n,d,k]) => `<div class="li" style="height:auto;min-height:2.6rem;padding:.35rem 0;align-items:flex-start"><span style="width:12.5rem;flex:none">${n}${k ? ` <span class="kbd" style="margin-left:.3rem">${k}</span>` : ''}</span><span class="sub">${d}</span></div>`).join('')}</div></div></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem;align-content:start;padding-top:3.2rem">
    ${demo('A','hot zones light up', `<span class="mz" style="left:4%;top:6%;width:20%;height:22%"></span><span class="mz" style="right:4%;top:6%;width:20%;height:22%"></span><span class="mz" style="left:28%;top:6%;width:44%;height:12%"></span><span class="mz lit" style="right:4%;top:34%;width:10%;height:60%"></span><span class="mz" style="left:4%;top:34%;width:10%;height:60%"></span>`)}
    ${demo('B','panel → right half', `<span style="position:absolute;background:var(--surface);box-shadow:0 0 0 1px var(--accent);border-radius:.3rem;animation:snapMove 3s cubic-bezier(.2,.8,.2,1) infinite"></span>`)}
    ${demo('C','hold → full screen', `<span style="position:absolute;left:0;right:0;top:0;height:4px;background:rgb(243 243 240/.15)"><span style="display:block;height:100%;background:var(--accent);animation:holdFill 3s linear infinite"></span></span><span style="position:absolute;background:#2d1a24;box-shadow:0 0 0 1px var(--accent);animation:holdFull 3s cubic-bezier(.2,.8,.2,1) infinite"></span>`)}
    ${demo('D','double-click: collapse', `<span style="position:absolute;left:15%;right:15%;top:12%;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:.3rem;overflow:hidden;animation:fold 3s ease-out infinite"><span style="display:block;padding:.15rem .4rem;font-size:.7rem">Voice · Cast</span></span>`)}
    ${demo('E','fling to close', `<span style="position:absolute;left:20%;top:20%;width:40%;height:60%;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:.3rem;animation:fling 3s ease-in infinite"></span><span style="position:absolute;right:0;top:0;bottom:0;width:12%;background:linear-gradient(90deg,transparent,rgb(229 72 59/.35))"></span>`)}
   </div></div></div>
  ${note(1060, 640, 'Transitions say what happened', 'Owner: animations for these transitions and when things get activated, like the hot zones. Proposed timings; the demos A–E run live in the page (points 58, 60, 61).', '', '20rem')}`;
}

/* ── 0 · the bars: deck and creator today, and one bar for both ── */
function bars() {
  const PL = (inner) => `<span class="pill">${inner}</span>`;
  const B = (t, on = '') => `<button class="${on}">${t}</button>`;
  const R = (i) => `<button class="round">${ic(i)}</button>`;
  const row = (y, title, items, sub) => `<div style="position:fixed;left:0;right:0;top:${y}px"><div class="label" style="padding:0 1rem .4rem">${title}</div>
    <div class="bar" style="position:relative;top:auto">${items}</div>${sub ? `<div class="sub" style="padding:.2rem 1rem 0">${sub}</div>` : ''}</div>`;
  const deck = PL(R('menu') + `<button class="round" style="opacity:.6">⌂</button>`) + PL(B(ic('show') + 'three-crows', 'on') + B(ic('film') + 'Nave at night') + R('plus')) + PL(B('▶') + '<span class="lab">120.0 BPM · INT</span>') + PL(B('Panic'))
    + '<span class="middle"></span>' + PL(B(ic('user') + 'tilman') + '<span class="lab">CPU 12% · GPU 60 fps</span><span class="lab" style="font-family:monospace">0.1.0 · f3d884c</span>');
  const creator = PL(R('menu') + `<button class="round" style="opacity:.6">⌂</button>`) + PL(B(f('#2d8a4e') + 'Weiche Priesterin', 'on') + B(ic('film') + 'Chapter 3') + R('plus'))
    + '<span class="middle"><span class="pill" style="padding:0 .9rem;color:var(--muted);font-size:var(--small)">Characters › Weiche Priesterin</span></span>'
    + PL(R('undo') + R('redo')) + PL(B(ic('views') + 'Views')) + PL(B(ic('hist') + 'History')) + PL(B(ic('pub') + 'Publish')) + PL(B(ic('user') + 'tilman')) + PL('<span class="lab" style="font-family:monospace">0.1.0 · 5e76406</span>');
  return `<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 50% 60%,var(--glow),var(--stage) 70%)"></div>
  ${row(30, 'Deck editor today (deck/editor/src/bar.rs)', deck, 'Left: menu · Home · item tabs · tempo + Panic. Right: account · CPU / GPU · version. Panels are listed inside the menu.')}
  ${row(160, 'Creator today', creator, 'Left: menu · Home · item tabs. Middle: the path. Right: undo / redo · Views · History · Publish · account · version.')}
  <div style="position:fixed;left:0;right:0;top:300px"><div class="label" style="padding:0 1rem .4rem">One bar for both – the creator (nothing plays)</div><div style="position:relative;height:var(--top)">${bar({ dirty: false }).replace('position:fixed', 'position:absolute').replace('class="bar"', 'class="bar" style="position:absolute"')}</div></div>
  <div style="position:fixed;left:0;right:0;top:400px"><div class="label" style="padding:0 1rem .4rem">One bar for both – the deck editor (something plays)</div><div style="position:relative;height:var(--top)">${deckBar('Show', { front: 0 }).replace('class="bar"', 'class="bar" style="position:absolute"')}</div>
    <div class="sub" style="padding:.3rem 1rem 0">Left: item tabs, a scrolling strip (no Home). Middle: workspace tabs, flat, most used first. Right, icons only: the play pill (Edit / Play, BPM, clock source) only where something plays · undo / redo · Publish only when something needs it · account · the menu, far right = the dashboard.</div></div>
  ${note(40, 560, 'Moved out of the bar', 'Home → the menu button’s dashboard (point 38). Views → the front card in the dashboard; History → a view (point 36). Version, CPU / GPU → the dashboard’s bottom line, a one-time status note on update (point 34). The path → Open anything (point 24).', '', '24rem')}
  ${note(420, 560, 'One place for the menu', 'Far right in both apps (points 32, 36). Icons without text (point 37). Publish hides when nothing needs it (point 35).', '', '20rem')}`;
}

const SCREENS = [['bars','0 Bars',bars],['dash','1 Dashboard',dash],['work','2 Workspace',work],['views','3 Views',views],['snap','4 Snap',snap],['save','5 Save',save],['launch','6 Open anything',launch],['tabs','7 Tabs',tabs],['crafts','8 Crafts?',crafts],['first','9 First dashboard',first],
  ['admin','10 Admin',admin],['gen','11 Generate',gen],['flow','11b Flow',flow],['scene','12 Scene',scene],['rig','13 Rigging',rig],['xr','14 XR',xr],['show','15 Show',show],['deckfirst','16 Deck first open',deckfirst],['resume','17 Resume',resume],['user','18 User menu',user],['full','19 Full screen',full],['motion','20 Motion',motion]];

function render() {
  const s = SCREENS.find(x => x[0] === view) || SCREENS[1];
  view = s[0];
  document.getElementById('app').innerHTML = s[2]();
  document.getElementById('sel').innerHTML = '<span class="arr">‹</span>' + SCREENS.map(([k,n]) => `<a href="?view=${k}" class="${k===view?'on':''}" data-v="${k}">${n}</a>`).join('') + '<span class="arr">›</span>';
}
const go = (k) => { view = k; history.replaceState(null, '', '?view=' + view + (document.body.classList.contains('quiet') ? '&quiet' : '')); render(); };
document.addEventListener('click', (e) => { const a = e.target.closest('[data-v]'); if (a) { e.preventDefault(); go(a.dataset.v); } });
document.addEventListener('keydown', (e) => {
  const i = SCREENS.findIndex(x => x[0] === view);
  if (/^[0-9]$/.test(e.key)) go(SCREENS[Number(e.key)][0]);
  if (e.key === 'ArrowRight') go(SCREENS[(i + 1) % SCREENS.length][0]);
  if (e.key === 'ArrowLeft') go(SCREENS[(i - 1 + SCREENS.length) % SCREENS.length][0]);
  if (e.key === 't' || e.key === 'T') { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'day' ? 'night' : 'day'; }
  if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('quiet');
});
render();
</script>
</body>
</html>
