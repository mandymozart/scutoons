const RH = 20;

function geo(n) {

  return [side === 'in' ? n.x : n.x + n.w, n.y + g.hh + i * RH + RH / 2];

function graph(G) {
  const by = Object.fromEntries(G.nodes.map(n => [n.id, n]));
  const cab = (c) => {
    const [x1, y1] = portXY(by[c.a[0]], 'out', c.a[1]), [x2, y2] = portXY(by[c.b[0]], 'in', c.b[1]);
    const dx = Math.max(30, (x2 - x1) * .45);
    const d = `M${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    const lab = c.label ? `<text x="${x1 + (x2 - x1) * .62}" y="${y1 + (y2 - y1) * .62 - 8}" text-anchor="middle" font-size="10.5" fill="var(--tool-muted)" font-family="var(--editor-sans)" stroke="var(--editor-stage)" stroke-width="3" paint-order="stroke">${c.label}</text>` : '';
    return `<path d="${d}" fill="none" stroke="${SIG(c.kind || ((by[c.a[0]].outs || [])[c.a[1]] || [])[1] || 'event')}" stroke-width="${c.lit ? 1.7 : 1}" opacity="${c.lit ? 1 : .55}" ${c.dash ? 'stroke-dasharray="3 3"' : ''}/>${lab}`;
  };
  const ports = G.nodes.map(n => {
    let s = '';
    (n.ins || []).forEach((p, i) => { const [x, y] = portXY(n, 'in', i); s += shape(p[1], x, y, p[2] && p[2].lit); });
    (n.outs || []).forEach((p, i) => { const [x, y] = portXY(n, 'out', i); s += shape(p[1], x, y, p[2] && p[2].lit); });
    if (n.stub) { const [x, y] = portXY(n, 'in', 0); s += shape('far', x, y, n.on); }
    return s;
  }).join('');
  return (G.frames || []).map(frame).join('') + G.nodes.map(spore).join('')
    + `<svg class="cv" style="z-index:3">${(G.cables || []).map(cab).join('')}</svg><svg class="cv" style="z-index:4">${ports}</svg>`;
}

}

  { id: '6', name: 'v6 · The generator for a storyboard shot', bar: { tab: `${ic('node')}sb-25-1<span class="muted">›</span>generator`, ws: -1 }, changed: 'New: drawn in the deck, where the canvas lives (in the creator it shows through the deck’s wasm, #764). Opened from the shot’s picture slot (the Storyboard’s step 5) – the shot’s prompt and reference are placed, the output spore is set by the slot (a picture, 1:3); one hooked spore is woven between; what it yields comes back to the slot. In lap 2 the creator still has the stub.',
    draw: () => sporesPanel(BIG, shotGenGraph(), { crumb: '<b>Storyboard</b> <span class="tr">› sb-25-1 › generator</span>' })
      + `<div class="abs" style="left:36px;top:470px;right:36px;display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;z-index:6"><span class="label" style="margin-right:.4rem" title="the spores to weave in – today’s list">＋</span>${['Library', 'Sheet', 'Crop', 'Pose', 'Condition', 'Skills', 'Reference'].map(n => `<span class="kc">${n}</span>`).join('')}<span style="width:1px;height:1rem;background:var(--tool-line);margin:0 .3rem"></span>${['Image', 'Upscale', 'Video', '3D model', 'Rig', 'Voice'].map(n => `<span class="kc" title="a hook: an agent, an LLM or an external tool runs it">${ic('zap')}${n}</span>`).join('')}</div>` + status() },
];
const STILLS = 'stills are made in the background and shared (#842)';

const VQ = Q.get('v') || '0';
const VI = Math.max(0, SCREENS.findIndex(s => s.id === VQ));
function render() {
  const s = SCREENS[VI];
  const idx = SCREENS.map((x, i) => `<a href="?v=${x.id}${DAY ? '&theme=day' : ''}" class="${i === VI ? 'on' : ''}" title="${x.name}">v${x.id}</a>`).join('') + `<a href="?v=${s.id}${DAY ? '' : '&theme=day'}">${DAY ? 'night' : 'day'}</a>`;
  document.getElementById('root').innerHTML = `<div class="screen"><div class="deck">${bar(s.bar) + s.draw()}</div>
    <div class="foot"><b>${s.name}</b><span>${s.changed}${VI < 5 ? ' · ' + STILLS : ''}</span><span class="idx">${idx}</span></div></div>`;
  document.title = s.name + ' · Spores view · lap 2';
}
render();
addEventListener('keydown', e => {
  const n = e.key === 'ArrowRight' ? VI + 1 : e.key === 'ArrowLeft' ? VI - 1 : null;
  if (n === null || n < 0 || n >= SCREENS.length) return;
  location.search = `?v=${SCREENS[n].id}${DAY ? '&theme=day' : ''}`;
});
</script>
