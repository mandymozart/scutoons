function shape(kind, x, y, lit) {
  const c = SIG(kind), fill = lit ? c : 'var(--tool-popover)', o = lit ? 1 : .8;
  const t = `<title>${kind === 'asset' ? 'a file (a model) – no signal in the table yet' : kind}</title>`;
  if (kind === 'event') return `<path opacity="${o}" d="M${x - 4} ${y - 5}L${x + 5} ${y}L${x - 4} ${y + 5}Z" fill="${fill}" stroke="${c}" stroke-width="1.3" stroke-linejoin="round">${t}</path>`;
  if (kind === 'scene' || kind === 'picture' || kind === 'asset') return `<rect opacity="${o}" x="${x - 4}" y="${y - 4}" width="8" height="8" fill="${fill}" stroke="${c}" stroke-width="1.3">${t}</rect>`;
  if (kind === 'value' || kind === 'clock') return `<circle opacity="${o}" cx="${x}" cy="${y}" r="3.4" fill="${c}">${t}</circle>`;
  if (kind === 'address') return `<path opacity="${o}" d="M${x} ${y - 5}L${x + 5} ${y}L${x} ${y + 5}L${x - 5} ${y}Z" fill="${fill}" stroke="${c}" stroke-width="1.3">${t}</path>`;

}

/* a line: [id, where it comes from, who listens, {cur, grey (the reason), title}] · a group: {h, path, later, lines} */
function picker(o) {
  const line = ([id, path, ls, f = {}]) => `<div class="kmi ${f.cur ? 'cur' : ''} ${f.grey ? 'grey' : ''}" title="${f.title || (f.grey ? f.grey : path)}"><span class="tick ${f.cur ? 'lit' : ''}"></span><span class="w mono" style="width:${o.idw || 190}px">${id}</span><span class="m mono">${f.grey || path}</span>${ls ? `<span class="ls">${ls}</span>` : ''}</div>`;
  const grp = (g) => `<div class="kmh ${g.later ? 'grey' : ''}" style="${g.later ? 'opacity:.55' : ''}"><span class="label">${g.h}</span>${g.path ? `<span class="muted small mono">${g.path}</span>` : ''}${g.later ? `<span class="kc" style="margin-left:auto" title="${g.title || ''}">later</span>` : ''}</div>${(g.lines || []).map(line).join('')}`;
  const pills = ['This toon', 'Show', 'Universe'].map((t, i) => `<span class="kc ${i === o.scope ? 'on' : ''}">${t}</span>`).join('');
  return `<div class="km" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;z-index:70">
    <span class="fld f" style="height:1.9rem;margin-bottom:5px">${ic('search')}<span class="caret"></span><span class="ph" style="margin-left:.1rem">Find</span></span>
    <div class="scopes">${pills}</div>
    ${line(['manual', '', '', { title: MANUAL }])}
    ${o.groups.map(g => g.h ? grp(g) : g.lines.map(line).join('')).join('')}</div>`;
}

        patch: { m3d: { k: MARK.done }, rig: { k: MARK.done }, glb: { k: MARK.done } } },

        patch: { slot: { s: 'v2 · rigged GLB' } } },

    ],
  },
};
const C = CHAINS[D];
const N = C.steps.length;
let STEP = Math.min(N - 1, Math.max(0, parseInt(Q.get('step') || '0', 10) || 0));

/* ── geometry: spores as spores-view.html, plus the edge ports of a frame (the generator's ⚡ and its outs) ── */
function geo(n) {
  if (n.edge) return { hh: 0, h: Math.max((n.ins || []).length, (n.outs || []).length) * RH };
  const hh = n.pill ? 24 : 24 + (n.s ? 16 : 0);
  const rows = n.pill ? 0 : Math.max((n.ins || []).length, (n.outs || []).length);
  return { hh, h: hh + rows * RH + (rows ? 4 : 0) };
}
function portXY(n, side, i) {
  if (n.edge === 'in') return [side === 'in' ? n.x : n.x + n.w, n.y + RH / 2];
  if (n.edge === 'out') return [side === 'in' ? n.x - n.w : n.x, n.y + i * RH + RH / 2];
  const g = geo(n);
  if (n.pill) return [side === 'in' ? n.x : n.x + n.w, n.y + Math.round(g.h / 2)];
  return [side === 'in' ? n.x : n.x + n.w, n.y + g.hh + i * RH + RH / 2];
}
const cablePath = (by, c) => {
  const [x1, y1] = portXY(by[c.a[0]], 'out', c.a[1]), [x2, y2] = portXY(by[c.b[0]], 'in', c.b[1]);
  const dx = Math.max(30, (x2 - x1) * .45);
  return `M${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
};

/* ── the state of a step: what is lit now, what was lit, which hops are done ── */
function state(k) {
  const by = Object.fromEntries(C.nodes.map(n => [n.id, JSON.parse(JSON.stringify(n))]));
  const cab = Object.fromEntries(C.cables.map(c => [c.id, c]));
  const st = { by, now: new Set(), arrive: [], was: new Set(), hop: {}, ports: new Set(), dim: new Set() };
  for (let i = 0; i <= k; i++) {
    const s = C.steps[i];
    const acts = s.lit || (s.hops ? [cab[s.hops[0]].a[0]] : []);
    const arr = (s.hops || []).map(h => cab[h].b[0]);
    (s.hops || []).forEach(h => { st.hop[h] = i === k ? 'now' : 'done'; st.ports.add(cab[h].a[0] + ':o' + cab[h].a[1]); st.ports.add(cab[h].b[0] + ':i' + cab[h].b[1]); });
    (s.ports || []).forEach(p => st.ports.add(p));
    (s.dim || []).forEach(p => st.dim.add(p));
    Object.entries(s.patch || {}).forEach(([id, p]) => Object.assign(by[id], p));
    if (i < k) [...acts, ...arr].forEach(id => st.was.add(id));
    else { acts.forEach(id => st.now.add(id)); st.arrive = arr; }
  }
  st.now.forEach(id => st.was.delete(id));
  st.arrive.forEach(id => st.was.delete(id));
  return st;
}

/* ── drawing ── */
function sporeD(n, st, showArrivals) {
  const id = n.id;
  if (n.edge === 'in') {
    const [p] = n.ins, lit = st.ports.has(id + ':i0');
    return `<div class="edg" data-id="${id}" style="left:${n.x + 10}px;top:${n.y}px;width:${n.w - 16}px">${islot({ slot: p[2].slot, st: lit ? 'on' : 'set' })}</div>`;
  }
  if (n.edge === 'out') return n.outs.map((o, i) => {
    const cls = st.dim.has(`${id}:o${i}`) ? 'dim' : st.ports.has(`${id}:o${i}`) ? 'lit' : '';
    return `<div class="edg o ${cls}" style="left:${n.x - n.w}px;top:${n.y + i * RH}px;width:${n.w - 10}px" title="a generation’s state">${o[0]}</div>`;
  }).join('');
  const g = geo(n);
  const on = st.now.has(id) || (showArrivals && st.arrive.includes(id));
  const was = st.was.has(id) && !on;
  const cls = ['spo', on && 'on', was && 'was', n.pill && 'pill'].filter(Boolean).join(' ');
  const ins = n.ins || [], outs = n.outs || [], rows = n.pill ? 0 : Math.max(ins.length, outs.length);
  let body = n.s && !n.pill ? `<div class="s">${n.s}</div>` : '';
  for (let i = 0; i < rows; i++) {
    const a = ins[i], b = outs[i];
    let left = '';
    if (a) left = a[2] && 'slot' in a[2]
      ? `<span style="display:flex;align-items:center;gap:.35rem;min-width:0">${islot({ slot: a[2].slot, st: (st.ports.has(id + ':i' + i) || (st.pick === id)) ? 'on' : a[2].slot ? 'set' : '' })}</span>`
      : `<span>${a[0]}</span>`;
    const ol = b && st.ports.has(id + ':o' + i) ? 'lit' : '';
    body += `<div class="pr">${left}<span class="o ${ol}" ${b && b[2] && b[2].title ? `title="${b[2].title}"` : ''}>${b ? b[0] : ''}</span></div>`;
  }
  const play = n.play ? `<span class="kib alone pb" data-act="play" title="${TIMER ? 'Pause' : 'Play'}">${TIMER ? `<svg class="i" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>` : ic('play')}</span>` : '';
  return `<div class="${cls}" data-id="${id}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${g.h}px" title="${n.title || ''}"><div class="t"><span style="overflow:hidden;text-overflow:ellipsis">${n.t}</span>${n.k ? `<span class="k">${n.k}</span>` : ''}${play}</div>${body}</div>`;
}
function frameD(f) {
  return `<div class="fr" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px"><div class="fh"><span class="nm" ${f.title ? `title="${f.title}"` : ''}>${f.t}</span>${f.kind ? `<span class="fk">${f.kind}</span>` : ''}${runChip(f.run)}</div></div>`;
}
const cabKind = (c) => c.kind || ((((C.nodes.find(n => n.id === c.a[0]) || {}).outs || [])[c.a[1]] || [])[1]) || 'event';
function canvas(st, showArrivals) {
  const by = st.by;
  const cab = (c) => {
    const s = st.hop[c.id] || 'rest';
    return `<path id="cab-${c.id}" class="cab ${s}" style="stroke:${SIG(cabKind(c))}" d="${cablePath(by, c)}"/>`;
  };
  let ports = '';
  for (const n of C.nodes) {
    if (n.edge === 'in') { const [x, y] = portXY(n, 'in', 0); ports += shape('event', x, y, st.ports.has(n.id + ':i0')); continue; }
    if (n.edge === 'out') { n.outs.forEach((p, i) => { const [x, y] = portXY(n, 'out', i); ports += `<g opacity="${st.dim.has(n.id + ':o' + i) ? .35 : 1}">${shape(p[1], x, y, st.ports.has(n.id + ':o' + i))}</g>`; }); continue; }
    (n.ins || []).forEach((p, i) => { const [x, y] = portXY(n, 'in', i); ports += shape(p[1], x, y, st.ports.has(n.id + ':i' + i)); });
    (n.outs || []).forEach((p, i) => { const [x, y] = portXY(n, 'out', i); ports += shape(p[1], x, y, st.ports.has(n.id + ':o' + i)); });
  }
  return C.frames.map(frameD).join('') + C.nodes.map(n => sporeD(by[n.id], st, showArrivals)).join('')
    + `<svg class="cv" id="cables" style="z-index:3">${C.cables.map(cab).join('')}</svg><svg class="cv" id="ports" style="z-index:4">${ports}</svg>`;
}
function logPanel(k) {
  const lines = C.steps.slice(0, k + 1).map((s, i) => `<div class="lgl ${i === k ? 'new' : ''}"><span class="ln">${i}</span><span class="lnm">${s.n}</span><span class="lw">${s.log[0]}</span><span class="lr2">${s.log[1]}</span></div>`).join('');
  return `<div class="fp" style="left:24px;top:590px;width:600px;height:162px;z-index:30">${head('term', { name: 'Log', noX: 1 })}<div class="bd lgb">${lines}</div></div>`;
}
function stepper(k) {
  const dots = C.steps.map((s, i) => `<span class="sd ${i === k ? 'cur' : i < k ? 'done' : ''}" data-step="${i}" title="${i} · ${s.n}"></span>`).join('');
  return `<div class="abs stp" style="left:0;right:0;top:772px;z-index:30"><span class="kp"><span class="kt" data-act="reset" title="back to step 0">Reset</span>
    <span class="kib muted" data-act="prev" title="previous step">${ic('l')}</span><span class="dots">${dots}</span><span class="kib muted" data-act="next" title="next step">${ic('r')}</span></span></div>`;
}
function pickerAt(st) {
  const o = C.picker, n = st.by[o.node];
  const x = P[0] + n.x + 8, y = P[1] + n.y + geo(n).hh + RH + 8;
  return picker({ x: o.right ? Math.min(x, 1440 - 12 - o.w) : x, y, w: o.w, scope: 2, idw: o.idw, groups: o.groups });
}

let TIMER = null, BEADS = [];
function render(animate) {
  BEADS.forEach(clearTimeout); BEADS = [];
  const s = C.steps[STEP], st = state(STEP);
  const anim = animate && !CALM && (s.hops || []).length > 0;
  if (s.picker) st.pick = C.picker.node;
  const panel = `<div class="fp" style="left:${P[0]}px;top:${P[1]}px;width:${P[2]}px;height:${P[3]}px">${head('node', { noX: true, tabs: `<span class="tab on">${ic('node')}Spores</span>${crumb('<b>Universe</b>')}`, right: VIEWBAR() })}
    <div class="abs" id="cvs" style="left:0;top:0;width:100%;height:100%;border-radius:inherit;background-image:radial-gradient(circle,var(--tool-line) 1px,transparent 1.2px);background-size:1.6rem 1.6rem">${canvas(st, !anim)}</div></div>`;
  const other = D === 'xr' ? 'gen' : 'xr';
  const th = DAY ? '&theme=day' : '';
  const tabs = Object.entries(CHAINS).map(([k, c]) => `<a href="?d=${k}${th}" class="${k === D ? 'on' : ''}" title="?d=${k}">${c.tab}</a>`).join('')
    + `<a href="?d=${D}&step=${STEP}${DAY ? '' : '&theme=day'}" class="th">${DAY ? 'night' : 'day'}</a>`;
  document.getElementById('root').innerHTML = `<div class="screen"><div class="deck">${bar() + panel + (s.picker ? pickerAt(st) : '') + logPanel(STEP) + stepper(STEP) + status()}</div>
    <div class="foot"><b>${STEP} · ${s.n}</b><span class="fw" title="${s.what.replace(/<[^>]+>/g, '')}">${s.what}</span><span class="kc today" title="today">${s.today}</span><span class="idx">${tabs}</span></div></div>`;
  document.title = `${C.tab} · ${STEP} ${s.n} · Spores demo`;
  history.replaceState(null, '', `?d=${D}&step=${STEP}${th}`);
  if (anim) beads(s);
}
/* a bead along each hop's cable, one after another; the next spore lights when it arrives */
function beads(s) {
  const per = Math.max(.3, Math.min(.8, .95 / s.hops.length));
  const svg = document.getElementById('cables');
  const cab = Object.fromEntries(C.cables.map(c => [c.id, c]));
  s.hops.forEach((h, i) => {
    BEADS.push(setTimeout(() => {
      const ns = 'http://www.w3.org/2000/svg';
      const b = document.createElementNS(ns, 'circle'); b.setAttribute('r', '3.6'); b.setAttribute('class', 'bead'); b.setAttribute('style', 'fill:' + SIG(cabKind(cab[h])));
      const m = document.createElementNS(ns, 'animateMotion'); m.setAttribute('dur', per + 's'); m.setAttribute('fill', 'freeze'); m.setAttribute('begin', 'indefinite');
      const mp = document.createElementNS(ns, 'mpath'); mp.setAttribute('href', '#cab-' + h);
      m.appendChild(mp); b.appendChild(m); svg.appendChild(b); m.beginElement();
      BEADS.push(setTimeout(() => {
        b.remove();
        const el = document.querySelector(`#cvs [data-id="${cab[h].b[0]}"]`);
        if (el && el.classList.contains('spo')) { el.classList.remove('was'); el.classList.add('on'); }
      }, per * 1000));
    }, i * per * 1000));
  });
}
function go(k, animate = true) { STEP = Math.max(0, Math.min(N - 1, k)); render(animate); }
function stop() { clearInterval(TIMER); TIMER = null; }
function play() {
  if (TIMER) { stop(); render(false); return; }
  if (STEP >= N - 1) STEP = 0;
  TIMER = setInterval(() => { if (STEP >= N - 1) { stop(); render(false); return; } go(STEP + 1); }, 1200);
  go(STEP + 1);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-step]');
  if (!t) return;
  if (t.dataset.step) { stop(); go(+t.dataset.step); return; }
  const a = t.dataset.act;
  if (a === 'play') play();
  else if (a === 'reset') { stop(); go(0, false); }
  else if (a === 'prev') { stop(); go(STEP - 1); }
  else if (a === 'next') { stop(); go(STEP + 1); }
});
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stop(); go(STEP + 1); }
  if (e.key === 'ArrowLeft') { stop(); go(STEP - 1); }
});
render(true);
</script>
