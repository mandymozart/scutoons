  let s = S.find(x => x.id.toUpperCase() === id) || S[0];
  const ch = s.changes.length ? s.changes.map((c, i) => `<span class="n">${i + 1}</span>${c}`).join('') : s.idle ? s.idle : s.sec === 'F' ? ' – nothing: a question screen, its picture waits for the owner’s words' : ' – nothing (in the set as it is)';
  document.getElementById('frame').innerHTML = `<div class="app">${s.render()}</div><div class="foot"><span class="id">${s.id}</span><span>${s.name}</span><span class="ch"><span style="color:#a7af9b">Base: ${s.base}</span> · <b style="color:#ffd84a;font-weight:600">Changed:</b>${ch}</span></div>`;
  document.title = `${s.id} ${s.name} – lap 2 draft`;
  let h = '';
  for (const [k, t] of Object.entries(SECTIONS)) {
    h += `<h3>${t}</h3>` + S.filter(x => x.sec === k).map(x => `<a href="?s=${x.id}${DAY ? '&theme=day' : ''}" class="${x === s ? 'on' : ''}"><span>${x.id}</span><span>${x.name}</span><span class="b">${x.base}</span></a>`).join('');
  }
  document.getElementById('idx').innerHTML = h;
  window.__cur = s;
}
document.getElementById('idxtab').onclick = () => document.getElementById('idx').classList.toggle('open');
document.addEventListener('keydown', e => {
  const i = S.indexOf(window.__cur);
  const go = (n) => { const t = S[(n + S.length) % S.length]; location.search = `?s=${t.id}${DAY ? '&theme=day' : ''}`; };
  if (e.key === 'ArrowRight' || e.key === '›' || e.key === '.') go(i + 1);
  if (e.key === 'ArrowLeft' || e.key === '‹' || e.key === ',') go(i - 1);
  if (e.key === 't' || e.key === 'T') location.search = `?s=${window.__cur.id}${DAY ? '' : '&theme=day'}`;
  if (e.key === 'i' || e.key === 'I') document.getElementById('idx').classList.toggle('open');
  if (e.key === 's' || e.key === 'S') document.querySelectorAll('.dash.over').forEach(d => d.classList.toggle('off'));
});
render();
</script>
</body>
</html>
