<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspaces round 1</title>
<!-- #673 / epic #626 – draft round 1 of every workspace (owner 2026-11-20). Floating panels with universal tabs (osct #308,
     #318, #329), the deck's night tokens, opened items as tabs by address, the Library and Home as the way in, Links
     (where used · events · deck) as the flow between them. ?w=home|library|toons|chapter|characters|catalog|map|
     storyboard|experiences|flows|generations. Draft only. -->
<style>
@font-face{font-family:"Noto Sans";src:url("../../../deck/kit/assets/NotoSans-Regular-latin.ttf");font-weight:400}
@font-face{font-family:"Noto Sans";src:url("../../../deck/kit/assets/NotoSans-Bold-latin.ttf");font-weight:700}
:root{--surface:#1a1c18;--head:#141612;--line:#3a4034;--text:#f3f3f0;--muted:#a7af9b;--control:#262922;--hover:#2e3229;
--pressed:#f3f3f0;--pressed-text:#171916;--selected:#3a4132;--accent:#00d1ff;--primary:#b4ff32;--warn:#f0a030;--go:#4cc35a;--danger:#e5483b;
--glass:rgba(26,28,24,.55);--glass2:rgba(26,28,24,.86);--pad:.57rem;--small:.86rem;--label:.72rem;--row:2.15rem;--tr:1.8rem;--r:.36rem;
--mono:"IBM Plex Mono",ui-monospace,monospace;
--s0:#00d1ff;--s1:#f0a030;--s2:#b36bff;--s3:#4cc35a;--s4:#ff6b8a;--s5:#e6d24a}
*{box-sizing:border-box}html{font-size:14px}
body{margin:0;height:100vh;overflow:hidden;background:#000;color:var(--text);font:400 1rem/1.35 "Noto Sans",system-ui,sans-serif;position:relative}
.lbl{font-size:var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:var(--small)}.sp{flex:1}.warn{color:var(--warn)}.ok{color:var(--go)}.acc{color:var(--accent)}
.bg{position:absolute;inset:0;overflow:hidden}
/* top bar */
.bar{position:absolute;top:1rem;left:1rem;right:1rem;display:flex;gap:.5rem;align-items:center;z-index:3}
.pill{display:flex;align-items:center;gap:.2rem;background:var(--glass2);border:1px solid var(--line);border-radius:2rem;padding:.2rem;height:2.55rem;white-space:nowrap}
.logo{font-weight:700;letter-spacing:.04em;padding:0 .5rem 0 .7rem}
.ib{width:var(--row);height:var(--row);border-radius:50%;display:inline-grid;place-items:center;color:var(--text)}
.ws{display:flex;align-items:center;gap:.45rem;height:var(--row);padding:0 .8rem;border-radius:1.2rem;background:var(--control)}
.ws b{font-weight:400}
.tab{display:flex;align-items:center;gap:.4rem;height:var(--row);padding:0 .35rem 0 .65rem;border-radius:1.2rem;color:var(--muted)}
.tab.on{background:var(--pressed);color:var(--pressed-text)}
.tab .x{width:1.3rem;height:1.3rem;display:grid;place-items:center;font-size:.75rem;opacity:.55}
.tab img{width:1.2rem;height:1.2rem;border-radius:50%;object-fit:cover}
.seg{display:flex;gap:2px}.seg span{height:var(--row);padding:0 .75rem;border-radius:1.2rem;display:flex;align-items:center}
.seg span.on{background:var(--pressed);color:var(--pressed-text)}.seg span.play{color:var(--go)}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--go);display:inline-block;margin-right:.35rem}
/* panels */
.p{position:absolute;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;z-index:2}
.p.solid{background:var(--glass2)}
.ph{display:flex;align-items:center;gap:.2rem;padding:.3rem .35rem .3rem .2rem;flex:none}
.grip{width:.9rem;align-self:stretch;display:grid;place-items:center;color:var(--line);cursor:grab;font-size:.8rem;letter-spacing:-.15em}
.pt{font-size:var(--small);padding:.18rem .6rem;border-radius:1rem;color:var(--muted);white-space:nowrap}
.pt.on{background:var(--pressed);color:var(--pressed-text)}
.ph .f{margin-left:auto;color:var(--muted);font-size:.75rem;padding:0 .3rem}
.pb{overflow:hidden;flex:1;min-height:0;position:relative}
.mini{position:absolute;z-index:2;display:flex;align-items:center;gap:.45rem;height:2.35rem;padding:0 .8rem 0 .4rem;border:1px solid var(--line);border-radius:2rem;background:var(--glass2);white-space:nowrap;font-size:var(--small)}
.mini .grip{width:.8rem}
.ghost{position:absolute;z-index:4;padding:.25rem .7rem;border-radius:1rem;background:var(--pressed);color:var(--pressed-text);font-size:var(--small);box-shadow:0 .4rem 1rem #000a;transform:rotate(-3deg)}
.drop{position:absolute;z-index:4;width:2px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.note{position:absolute;z-index:5;max-width:19rem;font-size:var(--small);line-height:1.4;background:#fffbe6;color:#1d1d14;padding:.5rem .65rem;border-radius:var(--r);box-shadow:0 .3rem .9rem #0008}
.note b{font-weight:700}
.note::before{content:"Draft note";display:block;font-size:var(--label);letter-spacing:.08em;text-transform:uppercase;color:#7a6a00;margin-bottom:.15rem}
/* content */
.search{margin:0 var(--pad) var(--pad);height:var(--row);border:1px solid var(--line);background:var(--control);border-radius:var(--r);display:flex;align-items:center;padding:0 .6rem;color:var(--muted);gap:.4rem}
.chips{display:flex;gap:.3rem;padding:0 var(--pad) var(--pad);flex-wrap:wrap}
.chip{font-size:var(--small);padding:.08rem .55rem;border:1px solid var(--line);border-radius:1rem;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--pressed);color:var(--pressed-text);border-color:var(--pressed)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.tr{height:var(--tr);display:flex;align-items:center;gap:.45rem;padding:0 var(--pad) 0 calc(var(--pad) + var(--d,0)*1.05rem);white-space:nowrap;overflow:hidden}
.tr.sel{background:var(--selected)}.tr.in{background:rgba(35,38,31,.6)}
.tr .c{width:.8rem;color:var(--muted);font-size:.65rem;flex:none}
.tr img,.tr .sw{width:1.25rem;height:1.25rem;border-radius:50%;object-fit:cover;flex:none;background:var(--control)}
.tr .n{margin-left:auto;font-family:var(--mono);font-size:var(--label);color:var(--muted);padding-left:.4rem}
.grp{padding:.55rem var(--pad) .2rem}
.sec{border-top:1px solid var(--line)}
.sh{height:var(--row);display:flex;align-items:center;gap:.5rem;padding:0 var(--pad)}
.sh .c{color:var(--muted);font-size:.65rem;width:.8rem}.sh .s{margin-left:auto;color:var(--muted);font-size:var(--small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.si{padding:0 var(--pad) .75rem;display:grid;gap:.42rem}
.prop{display:grid;grid-template-columns:6.3rem minmax(0,1fr);align-items:center;gap:.5rem;min-height:var(--row)}
.prop>span:first-child{color:var(--muted);font-size:var(--small)}
.fd{height:var(--row);border:1px solid var(--line);background:var(--control);border-radius:var(--r);display:flex;align-items:center;padding:0 .6rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot{height:4.2rem;border:1px dashed var(--line);border-radius:var(--r);display:flex;align-items:center;gap:.6rem;padding:.3rem;color:var(--muted);font-size:var(--small)}
.slot img{height:100%;aspect-ratio:1;object-fit:cover;border-radius:calc(var(--r) - 1px)}
.slot.full{border-style:solid}
.toggle{width:1.875rem;height:1.125rem;border-radius:1rem;background:var(--text);position:relative;display:inline-block}
.toggle::after{content:"";position:absolute;width:.75rem;height:.75rem;border-radius:50%;background:var(--surface);top:.1875rem;left:.9375rem}
/* canonical sheet: reads like a page, every value edits in place */
.sheet{padding:.2rem 1rem 1rem;line-height:1.55}
.sheet h2{font-size:1.15rem;font-weight:700;margin:.4rem 0 .1rem}
.sheet .sub{color:var(--muted);font-size:var(--small);margin-bottom:.6rem}
.sheet p{margin:.45rem 0}
.sheet .v{border-bottom:1px dashed #5a6450;padding:0 .1rem}
.sheet .ref{color:var(--accent);border-bottom:1px solid #0e5566}
.sheet .h{font-size:var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:.9rem 0 .2rem}
.state{font-size:var(--label);text-transform:uppercase;letter-spacing:.08em;padding:.02rem .45rem;border-radius:1rem;border:1px solid var(--go);color:var(--go)}
.state.draft{border-color:var(--muted);color:var(--muted)}.state.warn{border-color:var(--warn);color:var(--warn)}
/* links: where used · events · deck */
.lk{display:grid;grid-template-columns:auto 1fr auto;gap:.15rem .5rem;align-items:center;padding:.15rem var(--pad);font-size:var(--small)}
.lk .k{font-family:var(--mono);font-size:var(--label);color:var(--muted)}
.ev{display:flex;align-items:center;gap:.35rem;padding:.25rem var(--pad);font-size:var(--small);white-space:nowrap}
.ev .on{font-family:var(--mono);font-size:var(--label);padding:.05rem .4rem;border-radius:var(--r);background:var(--control);border:1px solid var(--line)}
.ev .ar{color:var(--muted)}
.ev .to{color:var(--accent)}
/* tiles */
.tiles{display:grid;gap:.5rem;padding:0 var(--pad) var(--pad)}
.tile{position:relative;aspect-ratio:1;border-radius:var(--r);background:#0c0d0b;border:1px solid var(--line);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:contain}
.tile.cover img{object-fit:cover}
.tile .k{position:absolute;left:.3rem;top:.3rem;font-size:var(--label);background:var(--glass2);padding:.02rem .35rem;border-radius:.3rem;color:var(--muted)}
.tile .u{position:absolute;right:.3rem;top:.3rem;font-family:var(--mono);font-size:var(--label);background:var(--glass2);padding:.02rem .35rem;border-radius:.3rem}
.tile .u.zero{border:1px dashed var(--muted);color:var(--muted)}
.tile .q{position:absolute;right:.3rem;bottom:.3rem;font-family:var(--mono);font-size:var(--label);background:var(--glass2);padding:.02rem .35rem;border-radius:.3rem;color:var(--muted)}
.tile .nm{position:absolute;left:0;right:0;bottom:0;padding:.9rem .4rem .25rem;background:linear-gradient(transparent,#000d);font-size:var(--small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.sel{outline:2px solid var(--accent);outline-offset:1px}
.tile.want{border-style:dashed;border-color:var(--warn);display:grid;place-items:center;color:var(--warn);font-size:var(--label);text-transform:uppercase;letter-spacing:.08em}
.strip{display:flex;gap:.45rem;padding:0 var(--pad) var(--pad);overflow:hidden}
.card{flex:none;width:7.5rem}
.card .th{height:4.6rem;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#000;position:relative}
.card .th img{width:100%;height:100%;object-fit:cover}
.card .t{font-size:var(--small);color:var(--muted);display:flex;justify-content:space-between;padding-top:.2rem;white-space:nowrap}
.card.sel .th{outline:2px solid var(--accent);outline-offset:1px}.card.sel .t{color:var(--text)}
textarea,.txt{font:inherit;color:var(--text)}
.txt{padding:.4rem 1rem 1rem;line-height:1.6;font-size:.95rem}
.txt .sl{font-family:var(--mono);font-size:var(--label);color:var(--muted);letter-spacing:.06em;margin-top:.7rem}
.txt .who{color:var(--accent);font-size:var(--small);letter-spacing:.06em;text-transform:uppercase}
.txt .cur{background:rgba(0,209,255,.12);border-left:2px solid var(--accent);margin-left:-.6rem;padding-left:.5rem}
svg text{font-family:"Noto Sans",sans-serif}
</style>
</head>
<body>
<script>
const R='../../../media/', C=R+'characters/', CP=R+'catpope/';
const W=innerWidth,H=innerHeight,rem=14,g=rem,T=g+2.55*rem+g;
const ch=(c,v,m)=>`${C}${c}/${c}_${v}-${m}.webp`;
const w=new URLSearchParams(location.search).get('w')||'home';
const ICON={home:'⌂',library:'▤',toons:'▦',chapter:'▥',characters:'☺',catalog:'◈',map:'⌖',storyboard:'▶',experiences:'◳',flows:'⟴',generations:'✶'};
const NAME={home:'Home',library:'Library',toons:'Toons',chapter:'Chapter',characters:'Characters',catalog:'Catalog',map:'Map',storyboard:'Storyboard',experiences:'Experiences',flows:'Flows',generations:'Generations'};
let out='';
const add=s=>out+=s;
function bar({tabs=[],play=false,saved=true}={}){
  add(`<div class="bar"><div class="pill"><span class="logo">SCUTOONS</span><span class="ib">☰</span></div>
  <div class="pill"><span class="ws"><span>${ICON[w]}</span><b>${NAME[w]}</b><span class="muted">▾</span></span>${tabs.map((t,i)=>`<span class="tab ${i===0?'on':''}">${t.img?`<img src="${t.img}">`:`<span>${t.i||''}</span>`}<span>${t.n}</span><span class="x">✕</span></span>`).join('')}${tabs.length?'<span class="ib">＋</span>':''}</div>
  <span class="sp"></span>
  ${saved?`<div class="pill"><span style="padding:0 .7rem;font-size:var(--small)" class="muted"><span class="dot"></span>Saved 14:02</span></div>`:''}
  ${play?`<div class="pill"><div class="seg"><span class="on">Edit</span><span class="play">▶ Play</span></div></div>`:''}
  <div class="pill"><span style="padding:0 .6rem" class="mono">EN ▾</span><span class="ib">?</span></div></div>`);
}
// a floating panel; x,y,w,h in px; tabs = universal panel tabs
function P(x,y,wd,ht,tabs,body,o={}){
  add(`<div class="p ${o.solid?'solid':''}" style="left:${x}px;top:${y}px;width:${wd}px;height:${ht}px"><div class="ph"><span class="grip">⋮⋮</span>${tabs.map((t,i)=>`<span class="pt ${i===(o.on||0)?'on':''}">${t}</span>`).join('')}<span class="f">—</span></div><div class="pb">${body}</div></div>`);
}
function M(x,y,label,extra=''){add(`<div class="mini" style="left:${x}px;top:${y}px"><span class="grip">⋮⋮</span>${label}${extra}</div>`)}
function NOTE(x,y,html,wd){add(`<div class="note" style="left:${x}px;top:${y}px;${wd?`max-width:${wd}px`:''}">${html}</div>`)}
const tr=(d,label,o={})=>`<div class="tr ${o.sel?'sel':''} ${o.in?'in':''}" style="--d:${d}"><span class="c">${o.c??''}</span>${o.img?`<img src="${o.img}" onerror="this.style.visibility='hidden'">`:o.sw?`<span class="sw" style="background:${o.sw}"></span>`:''}<span>${label}</span>${o.n!==undefined?`<span class="n ${o.nw?'warn':''}">${o.n}</span>`:''}</div>`;
const sec=(open,name,sum,body='')=>`<div class="sec"><div class="sh"><span class="c">${open?'▾':'▸'}</span><span class="lbl">${name}</span><span class="s">${sum}</span></div>${open?`<div class="si">${body}</div>`:''}</div>`;
const prop=(k,v)=>`<div class="prop"><span>${k}</span>${v.startsWith('<')?v:`<div class="fd">${v}</div>`}</div>`;
const links=(rows)=>rows.map(([k,n,s])=>`<div class="lk"><span class="k">${k}</span><span>${n}</span><span class="muted mono" style="font-size:var(--label)">${s||''}</span></div>`).join('');
const ev=(on,to,deck)=>`<div class="ev"><span class="on">${on}</span><span class="ar">→</span><span class="to">${to}</span>${deck?`<span class="ar">→</span><span class="acc">⚡ ${deck}</span>`:''}</div>`;
const LINKS=(used,evs,deck)=>`<div class="grp lbl">Used in · ${used.length}</div>${links(used)}<div class="grp lbl">Events</div>${evs.join('')}<div class="grp lbl">Deck</div>${links(deck)}`;
const tile=(src,k,n,o={})=>o.want?`<div class="tile want">wanted<span class="nm" style="color:var(--warn)">${n}</span></div>`:`<div class="tile ${o.sel?'sel':''} ${o.cover?'cover':''}"><img src="${src}" onerror="this.style.opacity=0"><span class="k">${k}</span><span class="u ${o.u===0?'zero':''}">${o.u??''}</span>${o.q?`<span class="q">${o.q}</span>`:''}<span class="nm">${n}</span></div>`;

// ─────────────────────────────── HOME
if(w==='home'){
  add(`<div class="bg" style="background:radial-gradient(ellipse at 30% 20%,#1f241a,#000 65%)"></div>`);
  bar({saved:false});
  const L=g, cw=W-2*g;
  // the way in: search everything + workspaces
  P(L,T,cw*0.62,5.4*rem,['Find'],`<div style="padding:.2rem var(--pad) 0"><div class="search" style="margin:0;height:2.6rem;font-size:1.1rem">⌕ <span>Search toons, chapters, characters, items, places, experiences, generations …</span><span class="sp"></span><span class="mono muted">Ctrl K</span></div></div>`,{solid:true});
  const ws=['library','toons','chapter','characters','catalog','map','storyboard','experiences','flows','generations'];
  P(L,T+5.4*rem+g,cw*0.62,13.6*rem,['Workspaces'],`<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem;padding:0 var(--pad) var(--pad)">${ws.map(k=>`<div style="border:1px solid var(--line);border-radius:var(--r);padding:.6rem .7rem;background:var(--control)"><div style="font-size:1.3rem">${ICON[k]}</div><div>${NAME[k]}</div><div class="muted" style="font-size:var(--label)">${{library:'412 assets',toons:'3 toons',chapter:'Feilchen open',characters:'7 · 4 wanted',catalog:'86 items',map:'14 places',storyboard:'c3 · 22 shots',experiences:'1 poster',flows:'universe',generations:'3 running'}[k]}</div></div>`).join('')}</div>`,{solid:true});
  const y2=T+19*rem+2*g;
  P(L,y2,cw*0.62,H-y2-g,['Continue','Recent'],`<div class="strip" style="flex-wrap:wrap;gap:.6rem">${[
    [CP+'s1/c1/s1c1-slice-3.webp','Chapter','S1 · C3 Feilchen','slice 12 · 2 h ago'],
    [ch('catpope','portrait','happy'),'Character','CatPope › Regular','moods · yesterday'],
    [CP+'s1/s1-cover-portrait.webp','Experience','Poster · Feilchen','surfaces · today'],
    [CP+'s1/c1/s1c1-key-visual.webp','Storyboard','C3 · shot 7','generating'],
    [CP+'map/painted/terrain-abstract.webp','Map','CatPope world','places'],
    [R+'scutoons/items/record_player.webp','Item','Record player','collage'],
  ].map(([s,k,n,t])=>`<div class="card" style="width:11.5rem"><div class="th" style="height:6.8rem"><img src="${s}"></div><div class="t"><span style="color:var(--text)">${n}</span></div><div class="t"><span>${k}</span><span>${t}</span></div></div>`).join('')}</div>`);
  const rx=L+cw*0.62+g, rw=W-rx-g;
  P(rx,T,rw,15.5*rem,['Waiting for you'],`${[
    ['Poster art – print on 12 Dec','experience:poster-feilchen','warn'],
    ['3 generations to review','storyboard:catpope:3',''],
    ['Kanon: Yellow Mouse – agreed?','character:yellowmouse',''],
    ['Chapter 4 not live yet','chapter:catpope/s1/c4','draft'],
  ].map(([t,a,s])=>`<div class="ev" style="justify-content:space-between"><span>${t}</span><span class="state ${s}">${s||'open'}</span></div><div class="ev" style="padding-top:0"><span class="mono muted" style="font-size:var(--label)">${a}</span></div>`).join('')}`,{solid:true});
  P(rx,T+15.5*rem+g,rw,11*rem,['Wanted','Problems'],`<div class="tiles" style="grid-template-columns:repeat(4,1fr)">${tile('','','CatPope · dizzy',{want:1})}${tile('','','Mountain tiger',{want:1})}${tile('','','Crypt place',{want:1})}${tile('','','Poster art',{want:1})}</div><div class="ev muted">12 wanted · 3 problems → open in Generations</div>`);
  const y3=T+26.5*rem+2*g;
  P(rx,y3,rw,H-y3-g,['Toons'],`${[['catpope','CatPope','S1 · 3 / 5 live'],['yellowmouse','Yellow Mouse','S1 · drafting'],['billthefrog','Bill the Frog','pilot']].map(([i,n,s])=>tr(0,n,{img:ch(i,'avatar','neutral'),n:s})).join('')}`);
  NOTE(W*0.33,H-9*rem,'<b>The way in:</b> Home = find anything, the workspaces, what you were doing, what waits for you. Everything opens as a tab in its workspace by its address (<span class="mono">chapter:catpope/s1/c3</span>).',300);
}

// ─────────────────────────────── LIBRARY (full window browser)
if(w==='library'){
  add(`<div class="bg" style="background:#0d0f0b"></div>`);
  bar({});
  const lw=15*rem, dw=24*rem;
  P(g,T,lw,H-T-g,['Places'],`<div class="search">⌕ <span>Search</span></div>
   <div class="grp lbl">Scope</div>${tr(0,'This toon · CatPope',{sel:1,n:412})}${tr(0,'All toons',{n:1240})}${tr(0,'Unused',{n:37,nw:1})}${tr(0,'Wanted',{n:12,nw:1})}
   <div class="grp lbl">Kinds</div>${[['Characters',7],['Moods',18],['Items',86],['Places',14],['Slices',212],['Covers',3],['Audio',64],['Video',41],['3D models',22],['Generations',318],['Rigs · modules',19],['Scenes',8],['Experiences',1]].map(([k,n],i)=>tr(0,k,{n,sel:false,in:i===2})).join('')}`,{solid:true});
  const gx=g+lw+g, gw=W-gx-g-dw-g;

  NOTE(gx+gw*0.45,H-8.5*rem,'<b>Generations for any subject</b> (a shot, a mood, a place, a poster): <b>Wanted</b> is the inbox, lineage left → right, approved results land in the <b>Library</b> with their history.',300);
