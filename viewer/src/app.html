<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- the boot screen (owner 2026-10-16: "before the app is fully loaded our screen is a dull white"): the page's
		     skeleton (header, buttons, cover, text, rows), the animated logo and "Patience …" in the middle and a thin line at
		     the top for the app code loaded so far – until the app draws its first element. Plain CSS here: the app's tokens
		     aren't loaded yet -->
		<style>
			#sc-boot {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				overflow: hidden;
				background: #fff;
				color: #000;
				font: 1rem/1.4 'IBM Plex Mono', ui-monospace, monospace;
			}
			/* the page's shape while it loads (owner 2026-10-16: "realistisches HTML und minimal CSS … für Logo-Bereich,
			   Navigation, Header und darunter – klassischer Skeleton-Loader, minimal animiert"): the header with the logo
			   and the round buttons, the cover, the text, the button, the chapter rows – grey blocks under one soft sweep */
			#sc-boot .sk {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
			}
			#sc-boot .sk i {
				display: block;
				background: #ececec;
			}
			#sc-boot .sk::after {
				content: '';
				position: absolute;
				inset: 0;
				background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.55) 50%, transparent 70%);
				background-size: 250% 100%;
				animation: sc-sweep 1.6s ease-in-out infinite;
			}
			@keyframes sc-sweep {
				from {
					background-position: 120% 0;
				}
				to {
					background-position: -20% 0;
				}
			}
			#sc-boot .sk-head {
				flex: none;
				display: flex;
				align-items: center;
				gap: 0.5rem;
				height: 7.5rem;
				padding: 0 0.75rem 1.5rem;
				background: #f4f4f4;
			}
			#sc-boot .sk-logo {
				width: 2.25rem;
				height: 4rem;
				margin-right: auto;
				border-radius: 0.25rem;
			}
			#sc-boot .sk-head .round {
				width: 3.75rem;
				height: 3.75rem;
				border-radius: 50%;
				border: 2px solid #e2e2e2;
				background: #fff;
			}
			#sc-boot .sk-cover {
				flex: none;
				height: min(55vh, 36rem);
			}
			#sc-boot .sk-body {
				width: min(40rem, 100%);
				box-sizing: border-box;
				margin: 0 auto;
				padding: 2rem 1rem;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
			}
			#sc-boot .sk-line {
				height: 1rem;
			}
			#sc-boot .sk-button {
				width: 13rem;
				height: 3.25rem;
				margin-top: 1rem;
			}
			#sc-boot .sk-row {
				display: flex;
				gap: 1rem;
				margin-top: 1.5rem;
			}
			#sc-boot .sk-row i:first-child {
				flex: none;
				width: 7rem;
				height: 4.5rem;
			}
			#sc-boot .sk-row span {
				flex: 1;
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}
			/* the logo and "Patience …" in the middle, over the page's shape */
			#sc-boot .mid {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.75rem;
			}
			#sc-boot .mid img {
				width: min(12rem, 45vw);
				height: auto;
			}
			#sc-boot .text {
				padding: 0 0.5rem;
				background: #fff;
			}
			/* the code loaded so far: a thin line at the very top (an app, not a game) */
			#sc-boot .bar {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				height: 2px;
			}
			#sc-boot .fill {
				display: block;
				width: 0;
				height: 100%;
				background: #000;
				transition: width 0.15s linear;
			}
			@media (min-width: 64rem) {
				#sc-boot .sk-head {
					height: 6rem;
					padding: 0 1.5rem;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#sc-boot .sk::after {
					animation: none;
					background: none;
				}
			}
		</style>
		%sveltekit.head%
		<!-- Favicons -->
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<!-- installable web app (agents/research/PWA.md): the manifest + iOS's own tags (iOS reads the title and the
		     status bar from these; no apple-touch-startup-image: the launch screen is the background colour, white like the
		     boot screen below) -->
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="SCUTOONS" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />

		<!-- fonts: self-hosted by @scutoons/tokens (imported in routes/+layout.svelte), no font CDN -->
		<link rel="stylesheet" type="text/css" href="/css/styles.css" />
		<link rel="stylesheet" type="text/css" href="/css/animations.css" />

		<!-- no third-party CDN (owner 2026-10-09): every script and style comes from our own deployment or cdn.scutoons.com –
		     Howler is bundled from npm -->
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- data-expect: the app code a page needs before it draws, uncompressed (the reader measured 2026-10-16, agents/research/LOADING.md: ~877 KB in 58 files
		     before the first paint) – only the bar's scale; it grows when more arrives. The reader's own Loader
		     (lib/components/loader.svelte, the same picture) carries data-sc-booting while a page fetches its content -->
		<div id="sc-boot" data-expect="900000">
			<div class="sk" aria-hidden="true">
				<div class="sk-head"><i class="sk-logo"></i><i class="round"></i><i class="round"></i><i class="round"></i><i class="round"></i><i class="round"></i></div>
				<i class="sk-cover"></i>
				<div class="sk-body">
					<i class="sk-line" style="width: 92%"></i>
					<i class="sk-line" style="width: 78%"></i>
					<i class="sk-line" style="width: 55%"></i>
					<i class="sk-button"></i>
					<div class="sk-row"><i></i><span><i class="sk-line" style="width: 70%"></i><i class="sk-line" style="width: 40%"></i></span></div>
					<div class="sk-row"><i></i><span><i class="sk-line" style="width: 62%"></i><i class="sk-line" style="width: 35%"></i></span></div>
				</div>
			</div>
			<div class="mid">
				<img src="%sveltekit.assets%/SCUTOONS-logo-animated.svg" alt="" />
				<span class="text"></span>
			</div>
			<span class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="fill"></span></span>
		</div>
		<div id="sc-app" style="display: contents">%sveltekit.body%</div>
		<script>
			(() => {
				const boot = document.getElementById('sc-boot');
				const app = document.getElementById('sc-app');
				const bar = boot.querySelector('.bar');
				const fill = boot.querySelector('.fill');
				boot.querySelector('.text').textContent = document.documentElement.lang === 'de' ? 'Geduld ...' : 'Patience ...';
				// the bar: bytes of the app's own files (/_app/) arrived so far against the expected size (never full before
				// the app draws)
				let expect = Number(boot.dataset.expect) || 1000000;
				let loaded = 0;
				const show = () => {
					if (loaded > expect * 0.95) expect = loaded / 0.95;
					const share = Math.round((loaded / expect) * 100);
					fill.style.width = share + '%';
					bar.setAttribute('aria-valuenow', String(share));
				};
				let files = null;
				try {
					files = new PerformanceObserver((list) => {
						for (const entry of list.getEntries()) if (entry.name.includes('/_app/')) loaded += entry.decodedBodySize || entry.encodedBodySize || 0;
						show();
					});
					files.observe({ type: 'resource', buffered: true });
				} catch {
					/* no PerformanceObserver: the logo alone */
				}
				// away as soon as the app has drawn something (its first element that isn't a script) – but not while it only
				// waits (an element with data-sc-booting: the sign-in gate checking the session)
				const drawn = () => [...app.children].some((el) => el.tagName !== 'SCRIPT') && !app.querySelector('[data-sc-booting]');
				const done = () => {
					files?.disconnect();
					boot.remove();
				};
				if (drawn()) return done();
				const watch = new MutationObserver(() => {
					if (!drawn()) return;
					watch.disconnect();
					done();
				});
				watch.observe(app, { childList: true, subtree: true });
				// never stuck: whatever the app shows after 10 s (an API that doesn't answer) is better than the logo
				setTimeout(() => {
					watch.disconnect();
					if (boot.isConnected) done();
				}, 10000);
			})();
		</script>
	</body>
</html>
