<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCUTOONS Animated Logo Preview</title>
    <style>

    </style>
</head>
<body>
    <div style="display: flex; gap: 40px; align-items: center; justify-content: center; min-height: 100vh; background: #f0f0f0; flex-wrap: wrap;">
        <div style="text-align: center;">
            <h2 style="margin-bottom: 20px;">Phone Frame Version</h2>
            <img src="assets/scutoons-logo-animated.svg" alt="SCUTOONS Animated Logo - Phone" width="256" height="256" style="border: 2px solid #ccc;">
            <p style="margin-top: 10px; color: #666;">For general use</p>
        </div>
        <div style="text-align: center;">
            <h2 style="margin-bottom: 20px;">Favicon Version</h2>
            <img src="assets/scutoons-logo-animated-favicon.svg" alt="SCUTOONS Animated Logo - Favicon" width="256" height="256" style="border: 2px solid #ccc;">
            <p style="margin-top: 10px; color: #666;">For favicon (no frame, full square)</p>
        </div>
        <div style="text-align: center;">
            <h2 style="margin-bottom: 20px;">Favicon at 32x32</h2>
            <img src="assets/scutoons-logo-animated-favicon.svg" alt="SCUTOONS Animated Logo - Favicon Small" width="32" height="32" style="border: 2px solid #ccc; image-rendering: auto;">
            <p style="margin-top: 10px; color: #666;">How it looks as actual favicon</p>
        </div>
    </div>
