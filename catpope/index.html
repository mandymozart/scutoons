<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katzenpapst - SCUTOONS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../assets/styles.css">
    <link rel="stylesheet" type="text/css" href="assets/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="../">    <img src="../SCUTOONS-logo.svg" alt="SCUTOONS"/></a>
        </div>
        <div></div>
        <nav>
            <ul>
                <li><a href="#" onclick="scutoon.renderToonView(); return false;">Katzenpapst</a></li>
                <li><a href="#" onclick="scutoon.renderChapterView(1); return false;">Kapitel 1</a></li>
            </ul>
        </nav>
    </header>
    
    <div class="content">
        <!-- Content will be dynamically loaded here -->
        <div class="loading">Lädt...</div>
    </div>
    <script src="assets/app.js"></script>
    <script>
        // Initialize the Scutoon app
        const scutoon = new Scutoon('.', 'de');
        
        // Check URL parameters for initial view
        const urlParams = new URLSearchParams(window.location.search);
        const view = urlParams.get('view') || 'toon';
        const chapter = urlParams.get('chapter') || 1;
        const season = urlParams.get('season') || 1;
        const language = urlParams.get('language') || 'de';
        
        // Initialize with the specified view
        document.addEventListener('DOMContentLoaded', () => {
            scutoon.init(view, chapter, season, language);
        });
    </script>
</body>
</html>
