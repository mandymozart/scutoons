on: push
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: Checkout code with LFS
      uses: actions/checkout@v4
      with:
        lfs: true
        fetch-depth: 0
      
    - name: Pull LFS files
      run: git lfs pull
    
