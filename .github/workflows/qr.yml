# The qr app (qr.scutoons.com: QR landing page, verify page, proxies to the API; plain PHP, qr/).
# Checks on pushes to platform / pull requests that touch it, and as the test step of the deploy (deploy.yml). Target: deploy/targets.json → "qr";
# the steps: .github/workflows/deploy-app.yml; docs: qr/README.md, deploy/README.md.
# The printed-URL suite (qr/tests/public-urls.php) needs a database with codes – it runs locally with `composer test`
# in server/ (agents/PLATFORM.md "RULE: printed / public URLs never change").
on:
  push:
    branches:
      - platform
    paths:
      - 'qr/**'
      - 'shared/tokens/**'
      - '.github/workflows/qr.yml'
  pull_request:
    paths:
      - 'qr/**'
      - 'shared/tokens/**'
      - '.github/workflows/qr.yml'
  workflow_call:

name: 🧪 qr app (qr.scutoons.com)

jobs:
  test:
    name: 🧪 Lint + offline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: qr
    steps:
      - name: 🚚 Get the code
        uses: actions/checkout@v4

      - name: 🐘 PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl
          coverage: none

      - name: 🔍 php -l
        run: find src public templates tests -name '*.php' -print0 | xargs -0 -n1 php -l

      # public/assets/tokens is a generated copy of @scutoons/tokens (tokens CSS + IBM Plex Mono woff2)
      - name: 🎨 Tokens copy in sync
        run: node bin/sync-tokens.mjs --check

      # Without an API: the pages that need none answer, a scan shows the friendly fallback, proxies say 502
      - name: 🧪 Smoke test with the API down
        run: |
          QRAPP_API_URL=http://127.0.0.1:9 QRAPP_CACHE_DIR=/tmp/qr-cache php -S 127.0.0.1:9001 -t public public/router.php > /tmp/qr.log 2>&1 &
          sleep 1
          check() { status=$(curl -s -o /tmp/body -w '%{http_code}' "http://127.0.0.1:9001$1"); echo "$1 → $status"; [ "$status" = "$2" ] || { cat /tmp/body; exit 1; }; }
          check '/' 200
          check '/verify.html' 200
          check '/version.json' 200
          check '/assets/tokens/scutoons-tokens.css' 200
          check '/assets/tokens/fonts/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2' 200
          check '/?c=abcDEF12' 503 && grep -q 'Scanning works, try again in a minute' /tmp/body
          check '/?c=not%20a%20code' 404
          check '/api/validate/?c=abcDEF12' 502
          check '/?login=token' 302
