# The API (server/ → api.scutoons.com, document root api/public/). qr.scutoons.com is the qr app (qr.yml).
# Tests on every push / pull request that touches the server; deploys only from main.
# Target: deploy/targets.json → "api"; the steps: .github/workflows/deploy-app.yml; docs: deploy/README.md,
# server/docs/DEPLOY.md.
on:
  push:
    branches:
      - main
      - platform
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy-app.yml'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and list only, no upload
        type: boolean
        default: false

name: 🚀 API (api.scutoons.com)

env:
  SERVER_DIR: server

jobs:
  test:
    name: 🧪 Unit tests + PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVER_DIR }}
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, zip, curl
          coverage: none
          tools: composer:v2

      - name: 📦 Composer install (with dev tools)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 🧪 PHPUnit
        run: vendor/bin/phpunit

      - name: 🔍 PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # Deploys to api/ on the host (deploy/targets.json → "api": composer install --no-dev in a staging copy, generated
  # config.php from the production environment; api/storage/, db/, logs/ are never uploaded nor deleted).
  # DB migrations are not run by the deploy – see the warning in the run and server/docs/DATABASE.md.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: api
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit