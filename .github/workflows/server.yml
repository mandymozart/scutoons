# The PHP server (qr.scutoons.com + api.scutoons.com, one folder whose document root is <folder>/public).
# Tests on every push / pull request that touches the server; deploys only from main (FTP, all-inkl).
# Server folder: server/
# Setup, secrets and the cutover from the old plain-PHP layout: server/docs/DEPLOY.md
on:
  push:
    branches:
      - main
      - platform
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

name: 🚀 Server (qr.scutoons.com, api.scutoons.com)

env:
  SERVER_DIR: server

jobs:
  test:
    name: 🧪 Unit tests + PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVER_DIR }}
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, zip, curl
          coverage: none
          tools: composer:v2

      - name: 📦 Composer install (with dev tools)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 🧪 PHPUnit
        run: vendor/bin/phpunit

      - name: 🔍 PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  web-deploy:
    name: 🎉 Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # The host has no shell: vendor/ is built here and uploaded
      - name: 📦 Composer install (production)
        working-directory: ${{ env.SERVER_DIR }}
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      # Same secret / variable names as the old qr.scutoons.com workflow. Values must not contain a single quote.
      - name: 🔑 Generate config.php
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          cat > config.php << 'EOF'
          <?php
          // Generated by .github/workflows/server.yml – do not edit on the server. Keys: docs/CONFIGURATION.md
          define('GENERATE_PASSWORD', '${{ secrets.GENERATE_PASSWORD }}');
          define('DB_HOST', '${{ vars.DB_HOST }}');
          define('DB_NAME', '${{ vars.DB_NAME }}');
          define('DB_USER', '${{ secrets.DB_USER }}');
          define('DB_PASS', '${{ secrets.DB_PASS }}');
          define('AUTH_SECRET', '${{ secrets.AUTH_SECRET }}');
          define('MAIL_TRANSPORT', 'smtp');
          define('MAIL_FROM', '${{ vars.MAIL_FROM }}');
          define('SMTP_HOST', '${{ vars.SMTP_HOST }}');
          define('SMTP_PORT', '${{ vars.SMTP_PORT }}');
          define('SMTP_SECURE', '${{ vars.SMTP_SECURE }}');
          define('SMTP_USER', '${{ secrets.SMTP_USER }}');
          define('SMTP_PASS', '${{ secrets.SMTP_PASS }}');
          // The frontends that may call the API from a browser (viewer, creator, admin, shop)
          define('ALLOWED_ORIGINS', 'https://scutoons.com,https://www.scutoons.com,https://creator.scutoons.com,https://admin.scutoons.com,https://shop.scutoons.com');
          EOF

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./${{ env.SERVER_DIR }}/
          # The server folder (both qr. and api. point at its public/); default: the FTP account's root as before
          server-dir: ${{ vars.SERVER_FTP_DIR || './' }}
          # Never uploaded (and never deleted on the server): local data, private storage, secrets, dev tooling
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            db*/**
            logs/**
            storage/**
            tests/**
            tools/**
            docs/**
            bin/**
            migrations/**
            **/.htpasswd
            config.local.php
            config.local.php.example
            phpunit.xml.dist
            phpstan.neon.dist
            .phpunit.cache/**
            .phpstan.cache/**
            README.md
