# The API (server/ → api.scutoons.com, document root api/public/): unit tests + PHPStan. qr.scutoons.com is the qr app (qr.yml).
# Runs on pushes to platform and pull requests that touch the server, and as the test step of the deploy
# (deploy.yml calls it before the API goes out – deploying is deploy.yml's job).
# Target: deploy/targets.json → "api"; docs: deploy/README.md, server/docs/DEPLOY.md.
on:
  push:
    branches:
      - platform
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_call:

name: 🧪 API (api.scutoons.com)

env:
  SERVER_DIR: server

jobs:
  test:
    name: 🧪 Unit tests + PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVER_DIR }}
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🐘 PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, zip, curl
          coverage: none
          tools: composer:v2

      - name: 📦 Composer install (with dev tools)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 🧪 PHPUnit
        run: vendor/bin/phpunit

      - name: 🔍 PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
