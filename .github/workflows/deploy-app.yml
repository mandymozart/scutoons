# Reusable: deploys ONE app as described in deploy/targets.json (the single source of truth for targets – host path,
# protocol, build, include/exclude; docs deploy/README.md). Called by deploy.yml (pushes to main, one target at a time) and the
# manual buttons viewer.yml, shop.yml, creator.yml, admin.yml, embassy.yml, deploy-all.yml – no target is written into any
# workflow. All callers share the concurrency group `production-deploy`: only one FTP upload at a time (all-inkl drops
# parallel connections, ECONNRESET – owner 2026-10-02).
# Secrets and variables: GitHub environment `production` (list: .env.example). They reach deploy/deploy.mjs as JSON,
# so adding a value to a target is a change in targets.json + the environment, not here.
# To move an app to another host (bunny.net, Cloudflare): change its protocol in targets.json and add an upload step
# for that protocol below (see deploy/README.md).
on:
  workflow_call:
    inputs:
      app:
        description: target name in deploy/targets.json
        required: true
        type: string
      dry-run:
        description: build + stage + list only, no upload
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: 🎉 Deploy ${{ inputs.app }}${{ inputs.dry-run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
      VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - name: 🚚 Get the code
        uses: actions/checkout@v4

      - name: 📦 Node.js 22 (deploy/deploy.mjs, frontend builds)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔎 What this target needs (deploy/targets.json)
        id: setup
        run: node deploy/deploy.mjs "${{ inputs.app }}" --setup >> "$GITHUB_OUTPUT"

      - name: 📦 npm ci (workspace root)
        if: steps.setup.outputs.npm == 'true'
        run: npm ci

      # the browser deck's wasm (#198: deck-space → space_web + live_core into viewer/static/live/, git-ignored) – built
      # here, not committed (owner 2026-10-31: "build is cleaner"); wasm-bindgen's CLI must match the crate (deck/Cargo.lock)
      - name: 🦀 Rust + wasm32 (the browser deck's wasm)
        if: steps.setup.outputs.wasm == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: 🦀 Cargo cache
        if: steps.setup.outputs.wasm == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: deck
      - name: 🦀 wasm-bindgen CLI 0.2.129
        if: steps.setup.outputs.wasm == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: 🧊 Build the wasm (npm run build:wasm -w shared/live-deck)
        if: steps.setup.outputs.wasm == 'true'
        run: npm run build:wasm -w shared/live-deck

      - name: 🐘 PHP 8.3 + Composer
        if: steps.setup.outputs.php == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: 📋 Build, stage and plan
        id: plan
        run: node deploy/deploy.mjs "${{ inputs.app }}" --github --list=summary ${{ inputs.dry-run && '--dry-run' || '' }}

      - name: 📂 Upload via FTP
        id: ftp
        if: steps.plan.outputs.protocol == 'ftp' && !inputs.dry-run
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ steps.plan.outputs.local_dir }}
          server-dir: ${{ steps.plan.outputs.server_dir }}
          exclude: ${{ steps.plan.outputs.exclude }}
          log-level: standard

      # all-inkl now and then resets a data connection; one more go after a minute (the action's sync state on the server
      # means only what is still missing is uploaded)
      - name: ⏳ Upload failed – wait 60 s
        if: steps.ftp.outcome == 'failure'
        run: echo "::warning title=${{ inputs.app }}::FTP upload failed, retrying in 60 s" && sleep 60

      - name: 📂 Upload via FTP (retry)
        if: steps.ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ steps.plan.outputs.local_dir }}
          server-dir: ${{ steps.plan.outputs.server_dir }}
          exclude: ${{ steps.plan.outputs.exclude }}
          log-level: standard

      # the API is live: its pending DB migrations run now (BACKLOG 10.61, server/docs/DATABASE.md "Migrations") –
      # dry run + apply on the server, the changed rows backed up there; a failed run fails this job
      - name: 🗄️ DB migrations
        if: inputs.app == 'api' && !inputs.dry-run
        env:
          MIGRATE_KEY: ${{ secrets.MIGRATE_KEY }}
        run: |
          if [ -z "$MIGRATE_KEY" ]; then echo "::warning title=DB migrations::No MIGRATE_KEY secret – pending migrations were not run"; exit 0; fi
          status=$(curl -sS -o migrate.json -w '%{http_code}' -X POST https://api.scutoons.com/api/deploy/migrate -H "X-Migrate-Key: $MIGRATE_KEY")
          {
            echo "### Database migrations"
            if [ "$(jq -r '.run' migrate.json)" = null ]; then echo "Nothing pending."; else
              echo "**$(jq -r '.run.status' migrate.json)**: $(jq -r '.run.files | join(", ")' migrate.json)"
              echo '```'
              jq -r '.run.log // "", .run.error // empty' migrate.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 200 ]; then echo "::error title=DB migrations::HTTP $status – see the run summary"; cat migrate.json; exit 1; fi

      - name: ⚠️ Reminder
        if: steps.plan.outputs.reminder != ''
        run: echo "::warning title=${{ inputs.app }}::${{ steps.plan.outputs.reminder }}"
