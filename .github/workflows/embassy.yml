# Manual deploy of the embassy (embassy.scutoons.com). Target (host path, build, include/exclude):
# deploy/targets.json → "embassy"; the steps: .github/workflows/deploy-app.yml; docs: deploy/README.md.
# Released with the 2026-10-04 rollout (owner): "embassy" is in deploy/targets.json order, so deploy.yml deploys it on
# pushes to main like every other app. This workflow is the manual single-app run.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and list only, no upload
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

name: 🚀 Deploy embassy (embassy.scutoons.com)

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: embassy
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
