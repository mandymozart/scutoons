# The rig module compile service's image (#281, LIVE.md B.4): deck/build/Dockerfile → ghcr.io/mandymozart/scutoons-build
# (`:latest` + `:<commit sha>`) → bunny.net Magic Containers, the SECOND container of the app `scutoons-live` (beside the
# relay, live-image.yml), switched to the new image by bunny's own action (a rolling update of the pod - the relay's open
# sockets drop, so never during a show). Its own workflow (per-app deploy jobs stay separate - DECISIONS 2026-10-20).
#
# Settings, all in the GitHub environment `production` (Settings → Environments → production):
#   variable BUNNY_LIVE_APP_ID       the app's id - the same as live-image.yml's (the app is one: scutoons-live)
#   variable BUNNY_BUILD_CONTAINER   the name of the build container inside that app
#   secret   BUNNY_API_KEY           the bunny account's API key (the one live-image.yml uses)
# Until all three are set, a push skips the whole run with a notice (green) and "Run workflow" builds and pushes the image
# only - that is how the first image gets to ghcr.io before the second container exists.
#
# Deploy freeze: before building the workflow asks https://live.scutoons.com/status (`{ sessions, live }`, the relay in the
# same pod) and refuses while `live > 0` (a session with a conductor). "Run workflow" with `force` updates anyway. A relay
# that doesn't answer counts as not live. An update of either container restarts the pod, so both workflows share one
# concurrency group and never run at the same time.
on:
  push:
    branches:
      - main
    paths:
      - deck/build/**
      # the SDK it bakes in, and the lock its dependencies are vendored at
      - deck/module/**
      - deck/module-macros/**
      # what the service links for its strict test run (#344): the deck's module host, the descriptor type, the core
      - deck/module-host/**
      - deck/catalog/**
      - deck/core/**
      - deck/Cargo.lock
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      force:
        description: Update even while a show is live (the pod restarts, the open sockets drop)
        type: boolean
        default: false

name: 🛠 Module build image

permissions:
  contents: read
  packages: write

concurrency:
  group: bunny-live-app
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mandymozart/scutoons-build
  STATUS_URL: https://live.scutoons.com/status

jobs:
  image:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: What runs (the bunny settings)
        id: gate
        env:
          APP_ID: ${{ vars.BUNNY_LIVE_APP_ID }}
          CONTAINER: ${{ vars.BUNNY_BUILD_CONTAINER }}
          HAS_KEY: ${{ secrets.BUNNY_API_KEY != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$CONTAINER" ] && [ "$HAS_KEY" = true ]; then
            bunny=true
          else
            bunny=false
          fi
          if [ "$bunny" = true ] || [ "$EVENT" = workflow_dispatch ]; then build=true; else build=false; fi
          if [ "$bunny" = false ]; then
            echo "::notice title=Module build::bunny is not set up yet (BUNNY_LIVE_APP_ID, BUNNY_BUILD_CONTAINER, BUNNY_API_KEY in the environment production) – $( [ "$build" = true ] && echo 'the image is built and pushed, bunny is not updated' || echo 'nothing to do' )"
          fi
          echo "bunny=$bunny" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Deploy freeze (no update while a show is live)
        if: steps.gate.outputs.bunny == 'true'
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          body=$(curl -fsS -m 10 "$STATUS_URL" 2>/dev/null || true)
          live=$(printf '%s' "$body" | jq -r '.live // empty' 2>/dev/null || true)
          if ! [[ "$live" =~ ^[0-9]+$ ]]; then
            echo "::warning title=Module build::$STATUS_URL did not answer with a status – counted as not live"
            exit 0
          fi
          echo "status: $body"
          if [ "$live" -gt 0 ]; then
            if [ "$FORCE" = true ]; then
              echo "::warning title=Module build::$live live session(s) – updating anyway (force)"
            else
              echo "::error title=Module build::$live live session(s) – not updating during a show. Run the workflow again after it, or with force."
              exit 1
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.gate.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.build == 'true'
        with:
          context: deck
          file: deck/build/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=build-image
          cache-to: type=gha,scope=build-image,mode=max

      - name: Update the bunny.net app
        if: steps.gate.outputs.bunny == 'true'
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.BUNNY_LIVE_APP_ID }}
          api_key: ${{ secrets.BUNNY_API_KEY }}
          container: ${{ vars.BUNNY_BUILD_CONTAINER }}
          image_tag: ${{ github.sha }}
