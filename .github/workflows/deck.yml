# The deck suite (deck/ Cargo workspace: relay, bridge, adapters, protocol – agents/research/CYBERDECKS.md) and its
# TypeScript twin (shared/live, generated from the same schema). Build + test on every platform the bridge ships for
# (CYBERDECKS.md §2: Linux x86_64 + aarch64 decks, macOS, Windows). Nothing here deploys; the per-app deploy jobs are
# untouched (deploy.yml, issue 73 / DECISIONS 2026-10-20).
#
# By hand only (owner 2026-10-31, #216: "the Rust runner definitely local now … for later, when we don't iterate so
# often, on GitHub"): macOS counts 10×, Windows 2× of the Actions minutes. Before every push the same steps run on this
# machine – `npm run deck:ci` (scripts/deck-ci.mjs), called by the pre-push hook (`npm run hooks` installs it). To run
# here again on push, put back the `push` / `pull_request` triggers with the deck paths (git history: before #216).
on:
  workflow_dispatch:

name: 🦀 Deck (relay, bridge, adapters)

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: deck

jobs:
  # The schema's two outputs are committed; a stale one fails here (shared/live `npm run check`).
  protocol:
    name: 📐 Protocol schema → TS + Rust current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm run check -w shared/live
        working-directory: .

  # The browser Live engine (#184): deck/live-core built for wasm32, then shared/live-core's check runs its tests
  # against it (the wire fixture TS ↔ Rust, the rings, the engine with the real wasm). The browser deck's 3D (#198):
  # deck-space for wasm32 (deck/space-web, wgpu: WebGPU + WebGL2) and shared/live-deck's check.
  live-core:
    name: 🕸 live-core + space-web (wasm32 + shared/live-core, shared/live-deck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deck
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm run build:wasm -w shared/live-core
        working-directory: .
      - run: npm run check -w shared/live-core
        working-directory: .
      - name: 🧊 space-web (deck-space as wasm32, the browser's 3D)
        run: cargo build --profile wasm-web --target wasm32-unknown-unknown -p space-web
      - name: ⏱ deck-events as wasm32 (#236, the event layer – the browser runs it too)
        run: cargo check --target wasm32-unknown-unknown -p deck-events
      # #366: the relay client's wasm (relay-web) – live-deck's tests run the core's scripted links through client.ts
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm run build:wasm -w shared/live-deck -- --relay
        working-directory: .
      - run: npm run check -w shared/live-deck
        working-directory: .

  native:
    name: 🦀 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deck
      - name: 🔊 ALSA headers (midir on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }}
      - name: 📏 Binary sizes (the dogma's size column, CYBERDECKS.md §2)
        shell: bash
        run: ls -l target/${{ matrix.target }}/release/relay* target/${{ matrix.target }}/release/bridge* | grep -v '\.d$'

  # Class B / C decks (RK3588, Pi 5): a cross build with `cross` (docker, the arm64 ALSA headers from Cross.toml).
  # Build only – the tests run on x86_64 above; a qemu run comes with the first real board.
  aarch64-linux:
    name: 🦀 Linux aarch64 (cross)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deck
      - run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - run: cross build --release --target aarch64-unknown-linux-gnu
      - run: ls -l target/aarch64-unknown-linux-gnu/release/relay target/aarch64-unknown-linux-gnu/release/bridge
