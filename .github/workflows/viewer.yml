# Manual deploy of the viewer (scutoons.com) only – Actions → this workflow → Run workflow. Pushes to main are deployed by
# deploy.yml (one run, one FTP upload at a time); this button waits for a running deploy (same concurrency group).
# Target: deploy/targets.json → "viewer"; the steps: .github/workflows/deploy-app.yml; docs: deploy/README.md.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and list only, no upload
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

name: 🚀 Deploy viewer (scutoons.com)

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: viewer
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
