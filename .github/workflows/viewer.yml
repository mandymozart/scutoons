on:
  push:
    branches:
      - main
    paths:
      - 'viewer/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/viewer.yml'

name: 🚀 Deploy viewer (scutoons.com)

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: 🔨 Install (workspace root) and build viewer
      run: npm ci && npm run build -w viewer
      env:
        # optional repository variables; the app falls back to the production URLs when unset
        VITE_API_URL: ${{ vars.VITE_API_URL }}
        VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
        VITE_CREATOR_URL: ${{ vars.VITE_CREATOR_URL }}

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      with:
        server: ftp.scutoons.com
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./viewer/build/
        server-dir: /
        log-level: verbose
