# Deploys the viewer (scutoons.com) on every push to main that touches it. Target (host path, build, include/exclude):
# deploy/targets.json → "viewer"; the steps: .github/workflows/deploy-app.yml; docs: deploy/README.md.
on:
  push:
    branches:
      - main
    paths:
      - 'viewer/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'deploy/**'
      - '.github/workflows/deploy-app.yml'
      - '.github/workflows/viewer.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and list only, no upload
        type: boolean
        default: false

name: 🚀 Deploy viewer (scutoons.com)

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: viewer
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
