# The Ask service's container image (tools/mcp/Dockerfile, agents/CUTOVER.md 10.28): built on every push to main that
# changes what the service is made of, pushed to the GitHub Container Registry as
#   ghcr.io/mandymozart/scutoons-ask:latest   and   ghcr.io/mandymozart/scutoons-ask:<commit sha>
# bunny.net Magic Containers pulls it from there (tools/mcp/README.md "Production"). Nothing is deployed by this
# workflow – bunny updates the container when the image changes (or by hand in the bunny dashboard).
# By hand: Actions → "Ask image" → Run workflow.
on:
  push:
    branches:
      - main
    paths:
      - tools/mcp/**
      - shared/api/**
      - shared/content/src/**
      - creator/src/lib/editor/text-presets.ts
      - viewer/src/lib/visual-novel/README.md
      - package-lock.json
      - .github/workflows/ask-image.yml
  workflow_dispatch:

name: 🤖 Ask image

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/mcp/Dockerfile
          push: true
          tags: |
            ghcr.io/mandymozart/scutoons-ask:latest
            ghcr.io/mandymozart/scutoons-ask:${{ github.sha }}
