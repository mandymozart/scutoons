<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- sc-boot:style (generated from shared/boot by `npm run boot:sync` – edit there) -->
		<style>
			/* The boot screen of every app (viewer, creator, admin) – edit HERE, then `npm run boot:sync` writes it into each
			   app's src/app.html (between the sc-boot markers; `npm run check` fails when an app.html is out of date). Plain CSS:
			   the app's tokens and its root font size aren't loaded yet, so --r mirrors the root size of shared/tokens/base.css
			   (16px, ≥ 768px: 24px, ≤ 480px: 14px). Owner 2026-10-16: the skeleton "mit der realen App deckungsgleich", only
			   buttons and text blocks (no pictures, frames or backgrounds – except the chapter list's thumbnails), the logo and
			   "Patience …" exactly as the reader's page loader (lib/components/loader.svelte), the progress a thin line on top. */
			#sc-boot {
				--r: 16px;
				/* the app's --control-height (shared/tokens/tokens.css): 2rem + the borders; touch screens at least 44px */
				--ch: calc(2 * var(--r) + 4px);
				--sk: #ececec;
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				overflow: hidden;
				background: #fff;
				color: #000;
				font: var(--r) 'IBM Plex Mono', ui-monospace, monospace;
			}
			@media (min-width: 768px) {
				#sc-boot {
					--r: 24px;
				}
			}
			@media (max-width: 480px) {
				#sc-boot {
					--r: 14px;
				}
			}
			@media (pointer: coarse) {
				#sc-boot {
					--ch: max(44px, calc(2 * var(--r) + 4px));
				}
			}

			/* the skeleton (boot.js builds it by the address; the reader only): every block where the app draws it */
			#sc-boot .sk {
				position: absolute;
				inset: 0;
			}
			#sc-boot .sk i {
				position: absolute;
				display: block;
				box-sizing: border-box;
				background: var(--sk);
			}
			#sc-boot .sk::after {
				content: '';
				position: absolute;
				inset: 0;
				background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.55) 50%, transparent 70%);
				background-size: 250% 100%;
				animation: sc-sweep 1.6s ease-in-out infinite;
			}
			@keyframes sc-sweep {
				from {
					background-position: 120% 0;
				}
				to {
					background-position: -20% 0;
				}
			}
			/* the header (main-menu.svelte and the toggles): the logo top left, five round buttons top right */
			#sc-boot .sk .logo {
				top: calc(0.5 * var(--r));
				left: 0;
				width: calc(3 * var(--r));
				height: calc(3 * var(--r));
				background: none;
			}
			#sc-boot .sk .logo img {
				display: block;
				width: 100%;
				height: 100%;
				opacity: 0.25;
			}
			#sc-boot .sk .round {
				top: calc(0.5 * var(--r));
				right: calc(0.5 * var(--r) + var(--n) * (var(--ch) + 0.5 * var(--r)));
				width: var(--ch);
				height: var(--ch);
				border: 2px solid #dcdcdc;
				border-radius: 50%;
				background: #fff;
			}
			/* the toon page on a phone (≤ 480px: the cover is a square of the screen's width – left white): the description,
			   the start button, the season's heading, the chapter rows */
			#sc-boot .sk .text {
				height: calc(0.85 * var(--r));
			}
			#sc-boot .sk .start {
				left: calc(50vw - 7.45 * var(--r));
				width: calc(14.9 * var(--r));
				height: var(--ch);
			}
			#sc-boot .sk .thumb {
				left: var(--r);
				width: calc(5.5 * var(--r));
				height: calc(3.5 * var(--r));
			}
			@media (min-width: 481px) {
				#sc-boot .sk .page {
					display: none;
				}
			}

			/* the landing page (viewer routes/+page.svelte, measured 2026-10-17): the masthead's wordmark and slogan over a rule,
			   "TOONS" and the toon tiles (frame, picture square, name + meta, the first one's "Read" button) – in the flow, with the
			   page's own paddings (--hp: 16 px on a phone, 2 rem from 768 px) */
			#sc-boot .hm {
				--hp: calc(1.1429 * var(--r));
				position: absolute;
				inset: 0;
				padding-top: calc(4 * var(--r));
			}
			#sc-boot .hm i {
				position: static;
			}
			#sc-boot .hm-sec {
				padding: 0 var(--hp);
			}
			#sc-boot .hm-mast {
				padding-top: calc(0.5 * var(--r));
				padding-bottom: calc(1.7143 * var(--r));
				border-bottom: 2px solid #dcdcdc;
			}
			#sc-boot .hm .wordmark {
				width: 100%;
				aspect-ratio: 2.546;
			}
			/* one line of the slogan / the heading at their line heights (p 1.4, on a phone 1.3; h2 1.5rem × 1.2) */
			#sc-boot .hm .slogan {
				margin-top: var(--r);
				width: 62%;
				height: calc(1.4 * var(--r));
			}
			@media (max-width: 480px) {
				#sc-boot .hm .slogan {
					height: calc(1.3 * var(--r));
				}
			}
			#sc-boot .hm-toons {
				padding-top: calc(2.8571 * var(--r));
			}
			#sc-boot .hm .heading {
				width: 5.5ch;
				height: calc(1.8 * var(--r));
				margin-bottom: calc(1.1429 * var(--r));
				font-size: calc(1.5 * var(--r));
			}
			#sc-boot .hm-tiles {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: calc(0.8571 * var(--r));
			}
			#sc-boot .hm .tile {
				box-sizing: border-box;
				border: 2px solid #dcdcdc;
				background: #fff;
			}
			#sc-boot .hm .tile.first {
				grid-column: 1 / -1;
			}
			#sc-boot .hm .tile .pic {
				aspect-ratio: 1;
				border-bottom: 2px solid #dcdcdc;
			}
			#sc-boot .hm .tile .body {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				padding: calc(0.7143 * var(--r));
			}
			#sc-boot .hm .tile.first .body {
				padding: var(--r);
			}
			#sc-boot .hm .tile .txt {
				flex: 1;
				display: flex;
				flex-direction: column;
				gap: calc(0.3 * var(--r));
			}
			#sc-boot .hm .tile .name {
				width: 60%;
				height: var(--r);
			}
			#sc-boot .hm .tile .meta {
				width: 80%;
				height: calc(0.7 * var(--r));
			}
			#sc-boot .hm .tile .read {
				flex: none;
				width: calc(7.4 * var(--r));
				height: calc(3 * var(--r));
			}
			#sc-boot .sk .round.solo {
				--n: 0;
			}
			@media (min-width: 768px) {
				#sc-boot .hm {
					--hp: calc(2 * var(--r));
				}
				#sc-boot .hm-mast {
					padding-bottom: calc(2 * var(--r));
				}
				#sc-boot .hm-toons {
					padding-top: calc(3 * var(--r));
				}
				#sc-boot .hm .heading {
					margin-bottom: calc(1.3333 * var(--r));
				}
				#sc-boot .hm-tiles {
					grid-template-columns: repeat(3, minmax(0, 1fr));
					gap: calc(1.3333 * var(--r));
				}
				#sc-boot .hm .tile.first {
					grid-column: auto;
				}
				#sc-boot .hm .tile .body,
				#sc-boot .hm .tile.first .body {
					flex-direction: column;
					align-items: stretch;
					gap: calc(0.5 * var(--r));
					padding: calc(0.8333 * var(--r));
				}
				#sc-boot .hm .tile .read {
					width: calc(6 * var(--r));
					height: calc(2.2 * var(--r));
				}
			}

			/* the logo and "Patience …" in the middle: exactly the page loader (its logo at its own size, the text below) */
			#sc-boot .mid {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
			}
			#sc-boot .mid img {
				display: block;
			}

			/* the app's code loaded so far: a thin line at the very top */
			#sc-boot .bar {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				height: 2px;
			}
			#sc-boot .fill {
				display: block;
				width: 0;
				height: 100%;
				background: #000;
				transition: width 0.15s linear;
			}

			@media (prefers-reduced-motion: reduce) {
				#sc-boot .sk::after {
					animation: none;
					background: none;
				}
			}
		</style>
		<!-- /sc-boot:style -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- sc-boot:body (generated from shared/boot by `npm run boot:sync` – edit there) -->
		<div id="sc-boot" data-expect="1300000">
			<div class="mid">
				<img src="%sveltekit.assets%/SCUTOONS-logo-animated.svg" alt="" />
				<span class="say"></span>
			</div>
			<span class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="fill"></span></span>
		</div>
		<div id="sc-app" style="display: contents">%sveltekit.body%</div>
		<script>
			// The boot screen's script (shared/boot – edit here, `npm run boot:sync` writes it into each app.html). Runs inline right
	// after #sc-boot, before the app's code: draws the reader's page skeleton for the address (data-skeleton="reader"),
	// "Patience …", the thin line for the app code loaded so far, and goes away as soon as the app has drawn something.
	(() => {
		const boot = document.getElementById('sc-boot');
		const app = document.getElementById('sc-app');
		const bar = boot.querySelector('.bar');
		const fill = boot.querySelector('.fill');
		// the page loader's words (viewer messages common.loading)
		boot.querySelector('.mid .say').textContent = document.documentElement.lang === 'de' ? 'Geduld ...' : 'Patience ...';

		// the reader: its controls where the app draws them (the header on every toon page and chapter), on a toon page on a
		// phone also the description, the start button, the season heading and the chapter rows – only buttons and text,
		// no pictures (owner 2026-10-16: "deckungsgleich", "nur Buttons und Textblöcke"). Positions measured on the app
		// (375 px wide, root 14px): the cover is a square of the screen's width, the text starts 2 rem below it
		if (boot.dataset.skeleton === 'reader') {
			const parts = location.pathname.split('/').filter(Boolean);
			if (parts[0] === 'de' || parts[0] === 'en') parts.shift();
			const other = ['account', 'attributions', 'contact', 'events', 'stores'];
			const toon = parts.length === 1 && !other.includes(parts[0]);
			if (parts.length === 0) {
				// the landing page: the logo and the menu button, the masthead (wordmark + slogan over a rule), "TOONS" and the
				// tiles – a published toon full width with its Read button, then the coming ones two (desktop three) a row
				const tile = (first) =>
					`<i class="tile${first ? ' first' : ''}"><i class="pic"></i><span class="body"><span class="txt"><i class="name"></i><i class="meta"></i></span>${first ? '<i class="read"></i>' : ''}</span></i>`;
				const sk = document.createElement('div');
				sk.className = 'sk';
				sk.setAttribute('aria-hidden', 'true');
				sk.innerHTML =
					`<i class="logo"><img src="${boot.querySelector('.mid img').getAttribute('src')}" alt="" /></i><i class="round solo"></i>` +
					'<div class="hm"><div class="hm-sec hm-mast"><i class="wordmark"></i><i class="slogan"></i></div>' +
					`<div class="hm-sec hm-toons"><i class="heading"></i><div class="hm-tiles">${tile(true)}${tile(false)}${tile(false)}</div></div></div>`;
				boot.prepend(sk);
			} else if (toon || parts[1] === 'chapter') {
				const at = (cls, css) => `<i class="${cls}" style="${css}"></i>`;
				// below the cover: n rem down from its bottom edge
				const y = (rem) => `top:calc(100vw + ${rem} * var(--r))`;
				const x = (rem) => `left:calc(${rem} * var(--r))`;
				let html = `<i class="logo"><img src="${boot.querySelector('.mid img').getAttribute('src')}" alt="" /></i>`;
				for (let n = 0; n < 5; n++) html += at('round', `--n:${n}`);
				if (toon) {
					// the description: three lines of 1.3 rem
					html += at('page text', `${y(2.2)};${x(1)};width:calc(100vw - 2 * var(--r))`);
					html += at('page text', `${y(3.5)};${x(1)};width:calc(100vw - 2 * var(--r))`);
					html += at('page text', `${y(4.8)};${x(1)};width:calc(60vw - var(--r))`);
					html += at('page start', y(6.93));
					// the season heading, then the chapter rows (thumbnail, title, number on the right)
					html += at('page text', `${y(13.1)};${x(1)};height:calc(1.1 * var(--r));width:65vw`);
					for (let i = 0; i < 3; i++) {
						const top = 15.5 + i * 4.57;
						html += at('page thumb', y(top));
						html += at('page text', `${y(top + 0.8)};${x(7.5)};width:calc(${[10, 4.5, 3][i]} * var(--r))`);
						html += at('page text', `${y(top + 1.2)};right:var(--r);width:calc(${[3, 1.2, 1.2][i]} * var(--r));height:calc(0.75 * var(--r))`);
					}
				}
				const sk = document.createElement('div');
				sk.className = 'sk';
				sk.setAttribute('aria-hidden', 'true');
				sk.innerHTML = html;
				boot.prepend(sk);
			}
		}

		// the line: bytes of the app's own files (/_app/) arrived so far against the expected size (never full before the
		// app draws)
		let expect = Number(boot.dataset.expect) || 1000000;
		let loaded = 0;
		const show = () => {
			if (loaded > expect * 0.95) expect = loaded / 0.95;
			const share = Math.round((loaded / expect) * 100);
			fill.style.width = share + '%';
			bar.setAttribute('aria-valuenow', String(share));
		};
		let files = null;
		try {
			files = new PerformanceObserver((list) => {
				for (const entry of list.getEntries()) if (entry.name.includes('/_app/')) loaded += entry.decodedBodySize || entry.encodedBodySize || 0;
				show();
			});
			files.observe({ type: 'resource', buffered: true });
		} catch {
			/* no PerformanceObserver: the logo alone */
		}
		// away as soon as the app has drawn something (its first element that isn't a script) – but not while it only waits
		// (an element with data-sc-booting: the sign-in gate checking the session, the reader's own loader)
		const drawn = () => [...app.children].some((el) => el.tagName !== 'SCRIPT') && !app.querySelector('[data-sc-booting]');
		const done = () => {
			files?.disconnect();
			boot.remove();
		};
		if (drawn()) return done();
		const watch = new MutationObserver(() => {
			if (!drawn()) return;
			watch.disconnect();
			done();
		});
		watch.observe(app, { childList: true, subtree: true });
		// never stuck: whatever the app shows after 10 s (an API that doesn't answer) is better than the logo
		setTimeout(() => {
			watch.disconnect();
			if (boot.isConnected) done();
		}, 10000);
	})();
		</script>
		<!-- /sc-boot:body -->
	</body>
</html>
