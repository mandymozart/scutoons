<!-- SCUTOONS Figma bridge – the plugin UI: the WebSocket to the local relay (127.0.0.1 only), passing commands to code.js
     and results back. Reconnects on its own while the plugin is open. -->
<style>
	body { font: 0.75rem/1.4 system-ui, sans-serif; margin: 0.75rem; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); }
	b { font-weight: 600; }
	#dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #c33; margin-right: 0.375rem; }
	#dot.on { background: #2a2; }
	#log { color: var(--figma-color-text-secondary, #777); margin-top: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<div><span id="dot"></span><b>SCUTOONS bridge</b> <span id="state">connecting …</span></div>
<div id="log">relay ws://localhost:3056 – start it with<br>node tools/figma-bridge/relay.mjs</div>
<script>
	const URL = 'ws://localhost:3056/plugin'; // Figma's manifest takes host names only, no IPs
	const dot = document.getElementById('dot'), state = document.getElementById('state'), log = document.getElementById('log');
	let ws = null, count = 0;
	function connect() {
		ws = new WebSocket(URL);
		ws.onopen = () => { dot.className = 'on'; state.textContent = 'connected'; };
		ws.onclose = () => { dot.className = ''; state.textContent = 'waiting for the relay …'; setTimeout(connect, 2000); };
		ws.onerror = () => {};
		ws.onmessage = (e) => {
			let msg;
			try { msg = JSON.parse(e.data); } catch { return; }
			count++;
			log.textContent = `#${count} ${msg.cmd}`;
			parent.postMessage({ pluginMessage: msg }, '*');
		};
	}
	window.onmessage = (e) => {
		const msg = e.data && e.data.pluginMessage;
		if (msg && ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
	};
	connect();
</script>
