<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sketch → 3D</title>
	<link rel="stylesheet" href="app.css">
	<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
	<aside class="side">
		<h1>Sketch → 3D</h1>

		<fieldset>
			<legend>Bild</legend>
			<label class="drop" id="drop" title="Ein Bild oder ein Charakterblatt (Vorne, ¾, Hinten nebeneinander) hierher ziehen oder klicken">
				<img id="thumb" alt=""><span>Bild / Blatt ziehen oder wählen</span>
				<input type="file" id="file" accept="image/*" hidden>
			</label>
			<select id="character" title="Die A-Pose einer Figur aus media/characters"><option value="">– Figur (A-Pose) –</option></select>
			<div id="panels" class="panels" title="Die Figuren des Bildes: welche ist vorne, welche (falls vorhanden) die reine Seitenansicht"></div>
		</fieldset>

		<fieldset>
			<legend>Form</legend>
			<div class="seg" id="mode">
				<button type="button" data-v="inflate" class="on" title="Die Silhouette wird aufgeblasen (Figuren, Tiere, Requisiten)">Aufblasen</button>
				<button type="button" data-v="lathe" title="Die Silhouette wird um die Mittellinie gedreht (Flasche, Vase, Baumstamm)">Drehen</button>
			</div>
			<div class="seg" id="input">
				<button type="button" data-v="auto" class="on" title="Transparenz → freigestellt, sonst einfarbiger Hintergrund">Auto</button>
				<button type="button" data-v="alpha" title="Freigestelltes Bild (Transparenz)">Frei</button>
				<button type="button" data-v="background" title="Figur auf einfarbigem Hintergrund (z. B. Weiß)">Grund</button>
				<button type="button" data-v="sketch" title="Dunkle Linien auf hellem Grund">Skizze</button>
			</div>
			<label>Toleranz <output id="tolV"></output><input type="range" id="tol" min="2" max="40" step="1" title="Hintergrund: wie nah eine Farbe am Hintergrund sein darf"></label>
			<label>Auflösung <output id="rowsV"></output><input type="range" id="rows" min="48" max="200" step="8"></label>
			<label>Tiefe <output id="depthV"></output><input type="range" id="depth" min="0.3" max="1.6" step="0.05"></label>
			<label>Glätten <output id="smoothV"></output><input type="range" id="smooth" min="0" max="20" step="1"></label>
			<label>Dreiecke <output id="trisV"></output><input type="range" id="tris" min="200" max="8000" step="100"></label>
			<label>Farben <output id="colorsV"></output><input type="range" id="colors" min="0" max="32" step="1" title="0 = jede Fläche ihre eigene Farbe"></label>
			<label>Größe (m) <output id="heightV"></output><input type="range" id="height" min="0.2" max="3" step="0.05"></label>
			<label class="check"><input type="checkbox" id="mono"> Ohne Farbe (Ton)</label>
			<label class="check"><input type="checkbox" id="rig"> Skelett (A-Pose)</label>
		</fieldset>

		<div class="actions">
			<input id="name" placeholder="Name" title="Dateiname: tools/sketch3d/out/<name>.glb">
			<button id="save" type="button" class="primary">GLB speichern</button>
		</div>
		<p id="status" class="status"></p>
		<ul id="models" class="models"></ul>
	</aside>

	<main class="stage">
		<div class="viewbar">
			<div class="seg" id="view">
				<button type="button" data-v="shaded" class="on">Fläche</button>
				<button type="button" data-v="wire">Gitter</button>
				<button type="button" data-v="ink">Schwarz-Weiß</button>
			</div>
			<label class="check"><input type="checkbox" id="bones"> Knochen</label>
			<select id="pose" title="Posen aus dem Storyboard (figures.js)"><option value="">A-Pose (Ruhe)</option></select>
			<span id="info" class="info"></span>
		</div>
		<div id="viewport" class="viewport"></div>
	</main>

	<aside class="debug">
		<h2>Silhouette + Gelenke</h2>
		<canvas id="maskCanvas"></canvas>
		<ul id="warn" class="warn"></ul>
	</aside>

	<script type="module" src="app.js"></script>
</body>
</html>
