# deck-core – the platform-free core of the stage (#182, research/LIVE-NIGHT-2026-10-29.md §4): the module registry, the
# control graph and the DSP / analysis modules. No GPU, no audio device, no network – so the same crate builds for the
# deck (native, deck/native) and for the browser (wasm32, deck/lab/core-wasm in a Web Worker).
# A module is a cargo feature: a build carries only the modules its scenes need (deck/scene-features).
[package]
name = "deck-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["control", "analysis", "tempo"]
# LFOs, math, smoothing – the control domain (one f32 per frame)
control = []
# sound → control values (an FFT: level, bass, mid, high)
analysis = ["dep:rustfft"]
# the tempo map (beat = f(audio frame)), quantize grids, tap tempo, the least squares fit – deck/native's tempo clock
tempo = []

[dependencies]
deck-catalog = { path = "../catalog" }
rustfft = { version = "6", optional = true, default-features = false }
# the pure-Rust libm (plan §3.1/§3.4: the one dependency allowed): transcendentals with the same bits on every target
libm = "0.2"
toml = { workspace = true }
serde = { workspace = true }
