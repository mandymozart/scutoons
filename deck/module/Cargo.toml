# deck-module – the SDK for rig modules (#280, research/RIG-EDITING.md §4): a creator writes an instrument as a Rust
# crate against this one, compiled to wasm32-unknown-unknown and run in wasmtime (deck) or the browser's engine
# (live-core). One dependency, the pure-Rust `libm` (ABI-V2 §6: the same bits native and wasm, `deck_module::math`); the
# module's wasm stays small and the compile service has little to vet. The `host`
# feature adds the descriptor check (on deck-catalog's `Descriptor`) for whoever loads a module – never for the module itself.
[package]
name = "deck-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# the loader's side: `parse` / `validate` on deck-catalog's `Descriptor`, `read_descriptor` (the wasm's `deck.module` section), the Io offsets
host = ["dep:deck-catalog", "dep:serde_json"]

[dependencies]
deck-module-macros = { path = "../module-macros" }
libm = "0.2"
deck-catalog = { path = "../catalog", optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
deck-catalog = { path = "../catalog" }
deck-core = { workspace = true, features = ["tempo"] }
deck-module = { path = ".", features = ["host"] }
serde_json = { workspace = true }
