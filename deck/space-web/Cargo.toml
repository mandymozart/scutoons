# space-web – deck-space in the browser (#198): the being and its set drawn with wgpu into a canvas – WebGPU where the
# browser has an adapter, else WebGL2 (the owner's S22: navigator.gpu is there, its adapter is null) – behind a small
# wasm-bindgen API the page drives (its values in, the being's buttons out: one state). Build: `npm run build:wasm -w
# shared/space-web` (cargo for wasm32 + wasm-bindgen --target web). Natively the crate is empty (the workspace's
# builds and tests stay as they were).
[package]
name = "space-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
deck-space = { path = "../space", default-features = false, features = ["gpu"] }
# #364: the monitor beside the governor (deck-core is platform-free; its monitor is always built)
deck-core = { workspace = true }
# #465: a scene's control domain (its LFOs, its links), as the native deck runs it
deck-engine = { path = "../engine", features = ["space"] }
# #465: a Live outlet's logic (route, plan, compose, preload, recompose), as the native deck plays it
deck-outlet = { path = "../outlet" }
# #475: a flash answered step by step (flashed.rs), as the native deck answers it on its thread; #481: the deck's own
# UI for the person at it, painted by the core (face.rs)
deck-show = { path = "../show" }
# #478: the Live page's model (the roles this deck may take, no role, its name) – the native deck's F6 page
deck-ui = { path = "../ui" }
# #470: the browser deck pairs with deck-link's handshake and schedule (sans-IO – the page fetches and signs)
deck-link = { path = "../link", default-features = false, features = ["handshake"] }
protocol = { workspace = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
image = { version = "0.25", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
# the CLI that writes the JS glue must be the same version (wasm-bindgen-cli 0.2.129)
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
