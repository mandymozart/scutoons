# deck-space – the 3D space and the being (#188, #198), lifted out of deck-native so the same code draws on the deck
# (deck-native, native) and in the browser (deck/space-web, wasm32). The core – the scene model (graph, params, scene) and
# the tempo's `Now` – is always there; the space itself is the feature `being`, its GPU passes `gpu`, the loaders on
# threads and from files (set, portraits, image decoding in Rust) `native`. Everything but `native` builds for
# wasm32-unknown-unknown (deck.yml checks it).
[package]
name = "deck-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# everything by default (`cargo test -p deck-space` covers it all); deck-native and space-web pick theirs
default = ["being", "gpu", "native"]
# the space: the set's glTF (meshopt), the being (tethered buttons, hoses, bubbles, the head, labels), the camera,
# picking and drag, the feelings, the conductor's mirrored beings, the deck stream's wire forms
being = ["dep:glam", "dep:ab_glyph", "dep:image", "dep:bytemuck"]
# the GPU side: the space's passes and the scene renderer every deck draws with (stage.rs, wgpu)
gpu = ["being", "dep:wgpu", "dep:deck-outlet", "dep:deck-link", "dep:font8x8", "dep:qrcodegen", "dep:resvg"]
# loaders on threads and from files: a set's .glb, the portraits from a folder, images decoded in Rust (WebP, PNG)
native = ["being", "image/png", "image/webp"]
# the generator (src/bin/deck-schema.rs): kinds.json, the JSON Schema and the TS types from the catalog and
# the documents' types (#315). Never in a wasm build.
schema = ["dep:schemars", "deck-catalog/schema"]

[dependencies]
deck-core = { workspace = true, features = ["tempo"] }
# the node-kind catalog: ports, domains and parameter ranges of every kind (#315)
deck-catalog = { path = "../catalog" }
# the rig's mood horizon (rig/horizon.rs): deck-events' horizon walker (#236)
deck-events = { path = "../events" }
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
# the rig bundle's wire form (rig/bundle.rs) and the being's wire forms
serde_json.workspace = true
# the relay protocol's serde types: the being on the wire (deck.rs `graph`, space/wire.rs)
protocol = { workspace = true }
glam = { version = "0.28", optional = true }
ab_glyph = { version = "0.2", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
# resizing and mip levels; decoding only with `native` (the browser decodes the web's images)
image = { version = "0.25", default-features = false, optional = true }
wgpu = { version = "25", optional = true }
# the outlet's planes and their crossfade, drawn by the scene renderer (stage.rs)
deck-outlet = { path = "../outlet", optional = true }
# what every deck draws over the scene (stage.rs): the HUD's and the build label's model, the pairing card's texts and
# QR, the splash's logo; #478: the Live page's session, which the relay client (relay.rs) fills – so not behind `gpu`
deck-ui = { path = "../ui" }
deck-link = { path = "../link", default-features = false, optional = true }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"], optional = true }
qrcodegen = { version = "1.8", optional = true }
resvg = { version = "0.45", default-features = false, optional = true }
schemars = { version = "1", optional = true }

# the acceptance test of the events adapters (tests/story_to_rig.rs): a chapter event routed to a core rig
[dev-dependencies]
deck-events = { path = "../events" }

[[bin]]
name = "deck-schema"
path = "src/bin/deck-schema.rs"
required-features = ["schema"]
