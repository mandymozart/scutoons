# deck-media – the deck's own media playback in the core (plan §2.9, P13b): demux, the decode backends, the player that
# decodes ahead and gives the frame for the heard time, the derivative choice. Platform-free: the host brings the bytes.
[package]
name = "deck-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# MP4 / MOV (rerun's ISO BMFF reader: sample tables, fragmented files, unknown fourccs such as HAP's kept by name)
re_mp4 = "0.5"
# WebM / Matroska (no dependencies of its own)
matroska-demuxer = "0.8"
# HAP's chunks
snap = "1.1"
# the sound (the version deck-native's chapter music already uses)
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mkv", "vorbis", "flac", "pcm"] }
# a hardware decoder that fails or does not start says so (the host installs the subscriber)
tracing.workspace = true

# AV1: rav1d does not build for wasm32-unknown-unknown (its API imports C types `libc` lacks there); wasip1 and native do
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8"] }
libc = "0.2"

[dev-dependencies]
wasmtime = { version = "38", default-features = false, features = ["cranelift", "runtime", "std"] }
