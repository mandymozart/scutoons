# deck-media-hw – the hardware decode-only adapters behind deck-media's `DecodeBackend` (plan §2.9, P13c): Media
# Foundation with the GPU's D3D11 video decoder (DXVA) on Windows. A platform adapter: the core keeps demux, the choice,
# decode-ahead, seeking and timing; an adapter only turns packets into NV12 pictures and says what its GPU decodes.
[package]
name = "deck-media-hw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deck-media = { path = ".." }
tracing.workspace = true

# the version wgpu's DX12 backend already brings (gpu-allocator): no new crate, only its Media Foundation and D3D11 parts
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
