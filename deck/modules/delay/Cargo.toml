# delay – echoes synced to the beat or free in ms, with feedback, damping, ping-pong and a chorus. Build for the deck / browser:
# `cargo build --release --target wasm32-unknown-unknown -p delay-module`
[package]
name = "delay-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-module = { path = "../../module", features = ["host"] }
