# transpose – notes in, the same notes out, moved in pitch. Build for the deck / browser:
# `cargo build --release --target wasm32-unknown-unknown -p transpose-module`
[package]
name = "transpose-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-module = { path = "../../module", features = ["host"] }
