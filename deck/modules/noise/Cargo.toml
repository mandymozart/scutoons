# noise – seeded white or pink noise, free-running or opened by a gate. Build for the deck / browser:
# `cargo build --release --target wasm32-unknown-unknown -p noise-module`
[package]
name = "noise-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-module = { path = "../../module", features = ["host"] }
