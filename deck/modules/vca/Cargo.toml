# vca – a gain a control signal can play. Build for the deck / browser:
# `cargo build --release --target wasm32-unknown-unknown -p vca-module`
[package]
name = "vca-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-module = { path = "../../module", features = ["host"] }
