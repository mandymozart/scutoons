# env – an envelope a gate plays: ADSR, AD or AR, as audio and as a control value. Build for the deck / browser:
# `cargo build --release --target wasm32-unknown-unknown -p env-module`
[package]
name = "env-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-module = { path = "../../module", features = ["host"] }
