# osc – one oscillator, up to seven detuned voices, pitched by notes. Build for the deck / browser:
# `cargo build --release --target wasm32-unknown-unknown -p osc-module`
[package]
name = "osc-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-module = { path = "../../module", features = ["host"] }
