# reverb – an algorithmic reverb, an eight-line feedback delay network. Build for the deck / browser:
# `cargo build --release --target wasm32-unknown-unknown -p reverb-module`
[package]
name = "reverb-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-module = { path = "../../module", features = ["host"] }
