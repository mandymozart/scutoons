# drumseq – a drum sequencer: 8 lanes × 16 steps on the tempo clock, accent and swing, a notes output a lane. Build for the
# deck / browser: `cargo build --release --target wasm32-unknown-unknown -p drumseq-module`
[package]
name = "drumseq-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-module = { path = "../../module", features = ["host"] }
