# stepseq – a 16-step sequencer as a module (ABI v2): each step a slider, its level the pitch; emits `music.note` events on the
# tempo clock (tests: the notes, the sliders, the loop length; the wasm equals the native run). Build for the deck:
# `cargo build --release --target wasm32-unknown-unknown -p stepseq-module`
[package]
name = "stepseq-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-core = { workspace = true }
deck-module = { path = "../../module", features = ["host"] }
deck-module-host = { path = "../../module-host" }
