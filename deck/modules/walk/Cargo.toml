# walk – the built-in `walk` node as a module (#280): the SDK's example and its proof (tests: same notes, same cv as
# deck-events' random walk). Build for the deck / browser: `cargo build --release --target wasm32-unknown-unknown -p walk-module`
[package]
name = "walk-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deck-module = { path = "../../module" }

[dev-dependencies]
deck-events = { path = "../../events" }
deck-core = { workspace = true }
deck-module = { path = "../../module", features = ["host"] }
serde_json = { workspace = true }
