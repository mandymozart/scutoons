# `cross build --target aarch64-unknown-linux-gnu` (class B / C decks). midir links ALSA: the arm64 headers go into
# cross's image before the build; pkg-config is told where they are.
[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture arm64",
  "apt-get update",
  "apt-get install -y --no-install-recommends libasound2-dev:arm64",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = ["CARGO_INCREMENTAL", "CARGO_TERM_COLOR"]
volumes = []

[build.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS=1", "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig"]
