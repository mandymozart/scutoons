# The RME Fireface in class-compliant mode as one multichannel sink (#285, #318): WirePlumber's default for it is a UCM
# "HiFi" profile (a loopback sink per output pair, the AES out as the default); the Pro Audio profile gives one sink with
# every output (the UCX II: 20, AUX0…AUX19, analog 1/2 first), which deck-native opens with all its channels.
# WirePlumber 0.5 rule syntax; `~` = a regular expression. The X1 set it by hand once (`wpctl set-profile`) – this makes a
# freshly imaged deck do the same.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-RME_Fireface.*" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
]
