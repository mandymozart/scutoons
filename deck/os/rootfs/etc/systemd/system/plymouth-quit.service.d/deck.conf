# The logo stays up through deck-firstboot (#179): plymouth quits when the kiosk starts (deck-kiosk.service does it
# itself, right before cage; this is the fallback), and leaves its last frame on screen until cage draws.
[Unit]
After=deck-kiosk.service deck-firstboot.service

[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
