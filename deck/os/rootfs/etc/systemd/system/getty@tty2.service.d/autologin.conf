# tty2 is the deck's shell (README "tty2 is a shell", owner 2026-10-31: the login prompt was in the way) – root without
# a login on this console only; ssh stays key-only, the serial console asks as before
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \u' --noclear --autologin root %I $TERM
