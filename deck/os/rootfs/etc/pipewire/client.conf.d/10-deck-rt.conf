# The stage's own PipeWire data thread (its `process` callback) realtime too (#834): the daemon's config (pipewire.conf.d)
# lifts only the daemon's threads; a client without module-rt runs its data thread as SCHED_OTHER next to the busy frame
# thread – "late" glitches with a cheap callback. Under the daemon's 88, above the stage's render thread (70). The stage
# also asks for SCHED_FIFO itself when this fails, and moves the thread onto the audio core (deck-session DECK_AUDIO_CPUS).
context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level    = -11
            rt.prio       = 83
            rt.time.soft  = -1
            rt.time.hard  = -1
        }
        flags = [ ifexists nofail ]
    }
]
