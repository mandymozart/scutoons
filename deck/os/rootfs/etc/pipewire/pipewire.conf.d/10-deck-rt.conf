# PipeWire realtime config of the deck (CYBERDECKS.md §3): 48 kHz, quantum 128 (≈ 2.7 ms), rtkit lifts the threads.
# deck-check reads these keys (configured) and pw-metadata (live) and reports both.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 ]
    default.clock.quantum       = 128
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 1024
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level    = -11
            rt.prio       = 88
            rt.time.soft  = -1
            rt.time.hard  = -1
        }
        flags = [ ifexists nofail ]
    }
]
