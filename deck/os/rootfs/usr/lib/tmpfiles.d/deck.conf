# /var/lib/deck: the deck's state (the persistence partition mounts here on a live stick – deck-persist).
d /var/lib/deck 0755 deck deck -
d /var/lib/deck/home 0750 deck deck -
# the stage's library cache (chapters + CDN files, deck-stage --cache)
d /var/lib/deck/cache 0755 deck deck -
d /var/lib/deck/pacman-cache 0755 root root -
# remote updates (#237, deck-update): downloads, the staged bundle the boot re-applies, the state – root only
d /var/lib/deck/update 0700 root root -
# user@1000 at boot (linger) so PipeWire answers deck-check before the kiosk session exists.
f /var/lib/systemd/linger/deck 0644 root root -
# deck-link's run directory (#180): the code + the deck token for the stage and deck-tls – root writes, the group deck
# reads (setgid: every file in it is group deck; the token 0640)
d /run/deck-link 2750 root deck -
# Chromium's managed policy (#268): the conductor window has no DevTools / printing / translate – linked from /usr/share/deck so a remote update can deliver it
d /etc/chromium/policies/managed 0755 root root -
L+ /etc/chromium/policies/managed/deck.json - - - - /usr/share/deck/chromium-policy.json
