LABEL scutoonsdeck
TEXT HELP
Boot the SCUTOONSDECK live system from this stick (nothing is installed).
Wi-Fi picker, hardware check, then the deck's kiosk.
ENDTEXT
MENU LABEL SCUTOONSDECK (live, %ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL recheck
TEXT HELP
The same, but deck-check runs again even if this stick already knows the machine.
ENDTEXT
MENU LABEL SCUTOONSDECK - ^recheck the hardware (live, %ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% deck.recheck %KERNEL_PARAMS%

LABEL safe
TEXT HELP
No KMS graphics driver (nomodeset), every kernel message on screen, no reboot on a panic:
the entry for a machine that resets or shows nothing.
ENDTEXT
MENU LABEL SCUTOONSDECK - ^safe graphics, messages stay on screen (live, %ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset panic=0 loglevel=7 console=tty1 plymouth.enable=0
