LABEL existing
TEXT HELP
Boot the operating system already on this machine's disk.
Press TAB to edit the disk and partition number to boot.
ENDTEXT
MENU LABEL Boot the existing OS
COM32 chain.c32
APPEND hd0 0

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32
