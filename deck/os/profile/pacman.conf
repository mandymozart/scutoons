#
# /etc/pacman.conf of the deck live image (releng's with the deck's own repository added once it exists, CYBERDECKS.md §3).
# Also used by mkarchiso to install the packages into the airootfs.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# The suite's own pacman repository (deck/pkg/, a bunny storage zone) – commented out until it is published:
# [scutoons]
# SigLevel = Optional TrustAll
# Server = https://pkg.scutoons.com/$arch
