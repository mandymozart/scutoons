# The live initramfs (replaces releng's: no PXE hooks – the deck boots from the stick, and the nbd / nfs / http hooks
# would need packages the image does not carry). plymouth after kms: the logo from the first second (#179). zstd: the rt kernel's image decompresses faster at boot than xz.
HOOKS=(base udev microcode modconf kms plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
