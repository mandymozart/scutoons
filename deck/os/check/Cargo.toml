# deck-check – the hardware check of the boot flow (CYBERDECKS.md §3, #173): probes the machine, prints a report,
# writes /var/lib/deck/machine.toml (class + feature set), exits 1 on a missing must-have. Linux only (sysfs, /proc,
# vulkaninfo, vainfo, pw-metadata); the parsers are plain functions with tests.
[package]
name = "deck-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "deck-check"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
