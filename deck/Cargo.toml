# deck/ – the SCUTOONS deck suite in Rust (agents/research/CYBERDECKS.md; relay + bridge: LIVE.md B.4, B.6, B.7).
# Build: `cargo build --release` here; run: deck/README.md. The release profile follows the dogma (CYBERDECKS.md §2).
[workspace]
resolver = "2"
# deck/lab is its own workspace: the #182 experiments (wasm, wasmtime, plugins, benchmarks) stay out of CI and the deck builds
exclude = ["lab"]
members = ["module", "module-macros", "modules/walk", "modules/fixture", "build", "core", "live-core", "scene-features", "protocol", "adapters/core", "adapters/midi", "adapters/osc", "adapters/dmx-usbpro", "outputs", "relay", "bridge", "os/check", "space", "space-web", "stage", "link", "update", "conformance", "conformance/engine-lab"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
protocol = { path = "protocol" }
# the platform-free core (#182): its maths and batch columns are always there, its modules are features
deck-core = { path = "core", default-features = false }
adapters-core = { path = "adapters/core" }
adapters-midi = { path = "adapters/midi" }
adapters-osc = { path = "adapters/osc" }
adapters-dmx-usbpro = { path = "adapters/dmx-usbpro" }
deck-outputs = { path = "outputs" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
midir = "0.10"
rosc = "0.10"
# no libudev: Linux lists the USB ids from sysfs (no system library, cross builds stay plain)
serialport = { version = "4.10", default-features = false }

# Dogma (CYBERDECKS.md §2): LTO, one codegen unit, abort on panic; the bridge is built for size (per-package below).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true

[profile.release.package.bridge]
opt-level = "z"

# The stage's audio batches compute in deck-core's `F8` lanes (one closure per lane op): unoptimised, and at opt-level 1
# (closures not inlined), a debug stage and its tests run ~25× slower (no_alloc: 51 s instead of 0.6 s, #183).
[profile.dev.package.deck-stage]
opt-level = 2

[profile.dev.package.deck-core]
opt-level = 2

# the conformance probes render seconds of audio per test (#309)
[profile.dev.package.deck-engine-lab]
opt-level = 2

[profile.dev.package.deck-conformance]
opt-level = 2

# the being's frames in the stage's tests (no_alloc) and its own
[profile.dev.package.deck-space]
opt-level = 2

# the browser's 3D (#198, deck/space-web): built for size – wgpu, naga (WGSL → GLSL for WebGL2) and the space in one
# wasm the phone downloads (`npm run build:wasm -w shared/live-deck`)
[profile.wasm-web]
inherits = "release"
opt-level = "s"
