# deck/ – the SCUTOONS deck suite in Rust (agents/research/CYBERDECKS.md; relay + bridge: LIVE.md B.4, B.6, B.7).
# Build: `cargo build --release` here; run: deck/README.md. The release profile follows the dogma (CYBERDECKS.md §2).
[workspace]
resolver = "2"
# deck/lab is its own workspace: the #182 experiments (wasm, wasmtime, plugins, benchmarks) stay out of CI and the deck builds
exclude = ["lab"]
members = ["catalog", "module", "module-macros", "module-host", "engine", "modules/walk", "modules/stepseq", "modules/fixture", "modules/analog", "modules/dolly", "modules/bob", "modules/env", "modules/vca", "modules/filter", "modules/delay", "modules/noise", "modules/osc", "modules/mixer", "modules/transpose", "build", "core", "media", "media/wasm", "media/hw", "live-core", "scene-features", "protocol", "show", "adapters/core", "adapters/midi", "adapters/osc", "adapters/dmx-usbpro", "outputs", "relay", "bridge", "os/check", "space", "space-web", "relay-web", "outlet", "ui", "native", "editor", "kit", "link", "update", "conformance", "conformance/engine-wasm", "conformance/modules/context", "conformance/modules/catpope-rig", "headless", "module-bench", "module-bench/web", "module-bench/modules/fm16", "module-bench/modules/stress", "module-bench/modules/chain-stage", "module-bench/modules/chain-merged", "modules/reverb", "modules/arp", "modules/drumseq", "modules/convolver", "modules/cloud", "modules/bamboo", "modules/sampler", "spores", "spores-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
protocol = { path = "protocol" }
# the platform-free core (#182): its maths and batch columns are always there, its modules are features
deck-core = { path = "core", default-features = false }
adapters-core = { path = "adapters/core" }
adapters-midi = { path = "adapters/midi" }
adapters-osc = { path = "adapters/osc" }
adapters-dmx-usbpro = { path = "adapters/dmx-usbpro" }
deck-outputs = { path = "outputs" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
midir = "0.10"
rosc = "0.10"
# no libudev: Linux lists the USB ids from sysfs (no system library, cross builds stay plain)
serialport = { version = "4.10", default-features = false }

# Dev and test builds keep only line tables (#525): a panic's backtrace still names file and line, the ~100 test
# executables link faster and target/debug shrinks. split-debuginfo is no option on Windows: MSVC knows only "packed"
# (the PDB it already writes). A debugger session that needs variables: CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

# Dogma (CYBERDECKS.md §2): LTO, one codegen unit, abort on panic; the bridge is built for size (per-package below).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true

[profile.release.package.bridge]
opt-level = "z"

# The stage's audio batches compute in deck-core's `F8` lanes (one closure per lane op): unoptimised, and at opt-level 1
# (closures not inlined), a debug stage and its tests run ~25× slower (no_alloc: 51 s instead of 0.6 s, #183).
[profile.dev.package.deck-native]
opt-level = 2

[profile.dev.package.deck-engine]
opt-level = 2

[profile.dev.package.deck-core]
opt-level = 2

# the DSP units the engine's and the modules' audio paths run per sample
[profile.dev.package.deck-module]
opt-level = 2

# the synth renders eight voices a sample; its tests render seconds of audio (#331)
[profile.dev.package.analog-module]
opt-level = 2

# the conformance probes render seconds of audio per test (#309)
[profile.dev.package.deck-engine-wasm]
opt-level = 2

[profile.dev.package.deck-conformance]
opt-level = 2

# the headless host renders seconds of every scenario (#363)
[profile.dev.package.deck-headless]
opt-level = 2

# the being's frames in the stage's tests (no_alloc) and its own
[profile.dev.package.deck-space]
opt-level = 2

# AV1 in deck-media (rav1d, no assembly) and its picture conversions: unoptimised – or with rav1d's debug checks of its
# shared buffers – a dev deck decodes a 720p frame in half a second
[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.deck-media]
opt-level = 3

# wasmtime and its compiler in dev and test builds (#536): the conformance and headless wasm tests compile live-core,
# deck-engine-wasm and deck-headless (1–5 MB of wasm each) with Cranelift on every run – unoptimised, one module took
# ~100 s. Only the compiler gets faster: the machine code Cranelift emits depends on its settings (`Config`, opt level
# `speed` by default), not on how Cranelift itself was compiled, so the tests' native ≡ wasm bits do not move. Cargo takes
# no globs: every crate of wasmtime's own tree that does real work at run time is listed (`cargo tree -p wasmtime`).
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-internal-jit-icache-coherence]
opt-level = 3
[profile.dev.package.wasmtime-internal-math]
opt-level = 3
[profile.dev.package.wasmtime-internal-slab]
opt-level = 3
[profile.dev.package.wasmtime-internal-unwinder]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-bitset]
opt-level = 3
[profile.dev.package.cranelift-control]
opt-level = 3
[profile.dev.package.cranelift-native]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.gimli]
opt-level = 3
[profile.dev.package.object]
opt-level = 3

# the browser's 3D (#198, deck/space-web): built for size – wgpu, naga (WGSL → GLSL for WebGL2) and the space in one
# wasm the phone downloads (`npm run build:wasm -w shared/live-deck`)
[profile.wasm-web]
inherits = "release"
opt-level = "s"
