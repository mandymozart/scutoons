# deck-events (#236, research/EVENTS.md): generators that talk in events – the contract (Event, Time, the name
# dictionary with domains, the Generator trait), the event graph (no zero-delay cycles, delayed edges, per-edge caps, a
# hop limit), real-time events at frame offsets on deck-core's tempo map, the first generators and the gate_cv bridge.
# Platform-free (native + wasm32); encapsulated – the stage, the rigs and the being don't depend on it yet (§10).
[package]
name = "deck-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deck-core = { workspace = true, features = ["tempo"] }
