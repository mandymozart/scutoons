# "AV madness", step S2 (CYBERDECKS.md §8, #179): catpope chapter 1's music from scutoons.com (cached on the deck) plus
# a sequenced FM synth and pink noise, mixed, analysed by the FFT – bass, mid, high and the level drive the test
# pattern and two shader passes. S3–S6 add the chapter's slices, a video, a 3D object and MIDI / OSC mapping.
# Ports and kinds: deck/stage/README.md.
[stage]
name = "AV madness (S2)"

# ── sound ───────────────────────────────────────────────────────────────────────────────────────────────────────────
[[node]]
id = "music"
kind = "chapter_music"
toon = "catpope"
chapter = 1
quality = "medium"
gain = 0.9

[[node]]
id = "seq"
kind = "seq"
bpm = 96
division = 4
gate = 0.4
steps = [45, 0, 52, 45, 0, 57, 55, 0, 45, 0, 52, 60, 0, 57, 55, 52]

[[node]]
id = "fm"
kind = "fm"
ratio = 2.0
index = 1.5
gain = 0.22
release = 0.12

[[node]]
id = "hiss"
kind = "noise"
color = "pink"
cutoff = 6000
gain = 0.04

[[node]]
id = "mix"
kind = "mixer"

[[node]]
id = "fft"
kind = "fft"
release = 0.3

[[node]]
id = "out"
kind = "audio_out"
volume = 0.8

[[link]]
from = "seq.cv"
to = "fm.cv"

[[link]]
from = "music"
to = "mix.in1"

[[link]]
from = "fm"
to = "mix.in2"

[[link]]
from = "hiss"
to = "mix.in3"

[[link]]
from = "mix"
to = "fft.in"

[[link]]
from = "mix"
to = "out.in"

# the music's highs open the noise filter, its level pushes the FM index
[[link]]
from = "fft.high"
to = "hiss.cutoff"
scale = 9000
offset = 1500

[[link]]
from = "fft.level"
to = "fm.index"
scale = 3
offset = 0.5

# ── picture ─────────────────────────────────────────────────────────────────────────────────────────────────────────
[[node]]
id = "drift"
kind = "lfo"
rate = 0.05

[[node]]
id = "pattern"
kind = "test_pattern"

[[node]]
id = "kaleido"
kind = "shader"
effect = "kaleido"
b = 0.15
d = 0.25

[[node]]
id = "glitch"
kind = "shader"
effect = "rgb_shift"
b = 0.4

[[node]]
id = "screen"
kind = "screen"

[[link]]
from = "fft.bass"
to = "pattern.speed"
scale = 2.5
offset = 0.4

[[link]]
from = "fft.bass"
to = "pattern.pulse"

[[link]]
from = "fft.mid"
to = "pattern.zoom"
scale = -0.6
offset = 1.4

[[link]]
from = "drift"
to = "pattern.hue"

[[link]]
from = "fft.high"
to = "kaleido.a"

[[link]]
from = "fft.mid"
to = "kaleido.c"

[[link]]
from = "fft.level"
to = "glitch.a"
scale = 0.6

[[link]]
from = "pattern"
to = "kaleido.in"

[[link]]
from = "kaleido"
to = "glitch.in"

[[link]]
from = "glitch"
to = "screen.in"
