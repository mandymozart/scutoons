# deck-stage – the native AV app the deck boots into (CYBERDECKS.md §8, #179): winit + wgpu, a node graph from a TOML
# scene, an audio graph on PipeWire (cpal elsewhere), chapter music from the library API with a disk cache.
# Versions are pinned to the APIs this code was written against; a bump is its own step.
[package]
name = "deck-stage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "deck-stage"
path = "src/main.rs"

# Modules = cargo features (#185, CYBERDECKS.md §8): the core (graph, control, the basic audio nodes, the render passes,
# the HUD, the internal tempo clock) is always built; a module adds node kinds or tempo sources (deck-core's
# stage.rs table). A scene that uses a module this build lacks is refused with the feature's name, on screen.
# `cargo run -p deck-scene-features -- scenes/*.toml` lists what a set of scenes needs. The default = everything but the
# platform's (pipewire) and link (it needs cmake): a plain `cargo build` plays every bundled scene.
[features]
default = ["space", "sync", "chapter", "live", "midi", "osc"]
# the 3D space and the deck's being (#188): glTF rooms (meshopt, WebP), the orbit camera, the 3D buttons and their labels –
# deck-space's (deck/space, #198), with its GPU passes and its loaders on threads
space = ["deck-space/being", "deck-space/gpu", "deck-space/native", "dep:serde_json", "dep:ab_glyph", "image/webp"]
# the deck's sync (#195): what the scene needs – its sets' 3D, its beings' portraits – from the API (scene-content) into
# the cache, only what is missing or changed, offline from the cache (sync.rs)
# and the conductor's pushes (`scene.sync` → `deck.synced`, #195)
sync = ["dep:ureq", "dep:serde_json", "dep:protocol"]
# a chapter from scutoons.com (library API + disk cache): `chapter` (its slices, the dialog set in the reader's fonts)
# and `chapter_music` (its music, decoded with symphonia)
chapter = ["dep:ureq", "dep:serde_json", "dep:symphonia", "dep:ab_glyph", "image/webp"]
# a Live outlet (#186): the `outlet` node joins the relay as `output` of this deck's outlet, preloads the show media with
# the deck token (deck-link) and renders the outlet's cells natively (live/); slices and text come from `chapter`
live = ["chapter", "dep:protocol", "dep:tungstenite", "dep:deck-link"]
# MIDI clock in and out (the tempo clock's `midi` source, the tempo node's `midi_out`)
midi = ["dep:midir"]
# the OSC remote for the tempo clock (`/tempo/bpm` …, the `osc` source)
osc = ["dep:rosc"]
# the PipeWire backend (Linux, needs libpipewire + clang at build time); without it the stage plays through cpal
pipewire = ["dep:pipewire"]
# Ableton Link as a tempo source (tempo/link.rs; rusty_link builds Ableton's abl_link C++ library – needs cmake, a C++
# compiler and libclang at build time). On Windows a debug build links only with an optimised rusty_link:
# `--config 'profile.dev.package.rusty_link.opt-level=1'` (its cmake Debug build wants the debug CRT) – deck/stage/README.md
link = ["dep:rusty_link"]

[dependencies]
# the batch evaluator's pieces (#183): `math` (sine, rounding without libm), `batch` (input columns, dependency levels);
# the FFT analyzer and the tempo map (#185)
deck-core = { workspace = true, features = ["analysis", "tempo"] }
# the scene model (graph, params, scene) and – with `space` – the 3D space itself (#198: shared with the browser)
deck-space = { path = "../space", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu = "25"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
cpal = "0.15"
fundsp = { version = "0.20", default-features = false, features = ["std"] }
rtrb = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"], optional = true }
ureq = { version = "2", optional = true }
# --screenshot (png); the chapter's slices and the rooms' textures add webp; the splash logo (the SVG)
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = { version = "0.2", optional = true }
resvg = { version = "0.45", default-features = false }
# the tempo clock's external sources (#181): MIDI clock in / out, OSC
midir = { workspace = true, optional = true }
rosc = { workspace = true, optional = true }
rusty_link = { version = "0.4.9", optional = true }
# the Live outlet (#186): the relay protocol (one schema → TS + Rust), a blocking WebSocket client on its own thread (the
# version tokio-tungstenite already pulls), the deck's identity and token (#180)
protocol = { workspace = true, optional = true }
tungstenite = { version = "0.24", optional = true }
deck-link = { path = "../link", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", optional = true, features = ["v0_3_50"] }
# CLOCK_MONOTONIC for the time base (clock.rs – the clock PipeWire stamps its cycles with)
libc = "0.2"

# `cargo bench -p deck-stage`: the graph workloads (#183) – µs per audio block / control step
[[bench]]
name = "graph"
harness = false

[dev-dependencies]
# tests/live_relay.rs: the deck's outlet against the real relay on 127.0.0.1 (#186)
relay = { path = "../relay" }
tokio = { workspace = true }

# a stand-in conductor for trying an outlet (#186): `cargo run -p deck-stage --example live-cue -- <relay> examples/sermon.json`
[[example]]
name = "live-cue"
required-features = ["live"]

# stand-in decks for the Cathedral of decks (#188 phase 4): `cargo run -p deck-stage --example decks -- <relay> 4`
[[example]]
name = "decks"
required-features = ["live", "space"]
