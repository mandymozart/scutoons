# deck-stage – the native AV app the deck boots into (CYBERDECKS.md §8, #179): winit + wgpu, a node graph from a TOML
# scene, an audio graph on PipeWire (cpal elsewhere), chapter music from the library API with a disk cache.
# Versions are pinned to the APIs this code was written against; a bump is its own step.
[package]
name = "deck-stage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "deck-stage"
path = "src/main.rs"

[features]
default = []
# the PipeWire backend (Linux, needs libpipewire + clang at build time); without it the stage plays through cpal
pipewire = ["dep:pipewire"]
# Ableton Link as a tempo source (tempo/link.rs; rusty_link builds Ableton's abl_link C++ library – needs cmake, a C++
# compiler and libclang at build time). On Windows a debug build links only with an optimised rusty_link:
# `--config 'profile.dev.package.rusty_link.opt-level=1'` (its cmake Debug build wants the debug CRT) – deck/stage/README.md
link = ["dep:rusty_link"]

[dependencies]
# the batch evaluator's pieces (#183): `math` (sine, rounding without libm), `batch` (input columns, dependency levels);
# the FFT analyzer and the tempo map (#185)
deck-core = { workspace = true, features = ["analysis", "tempo"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu = "25"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
cpal = "0.15"
fundsp = { version = "0.20", default-features = false, features = ["std"] }
rtrb = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }
ureq = "2"
# S3: the chapter's slices (webp), its dialog set in the reader's fonts, the splash logo (the SVG)
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
ab_glyph = "0.2"
resvg = { version = "0.45", default-features = false }
# the space node (#188): vectors and matrices for the camera, the room, the being
glam = "0.28"
# the tempo clock's external sources (#181): MIDI clock in / out, OSC
midir.workspace = true
rosc.workspace = true
rusty_link = { version = "0.4.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", optional = true, features = ["v0_3_50"] }
# CLOCK_MONOTONIC for the time base (clock.rs – the clock PipeWire stamps its cycles with)
libc = "0.2"

# `cargo bench -p deck-stage`: the graph workloads (#183) – µs per audio block / control step
[[bench]]
name = "graph"
harness = false
