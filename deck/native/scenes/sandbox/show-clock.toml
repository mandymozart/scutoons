# The show clock's test (#321, plan P8): a deck that follows the show clock over the relay (the HUD: SHOW ±x MS). Nothing else plays: the click on every beat (higher on the bar's
# first) and a white flash on the screen at the beat's start (a red frame on the bar's first) – put two decks side by
# side and look and listen; a recording of the clicks gives the numbers (npm run clock:measure). Keys: K the click,
# F3 the source.
#   on a deck: deck-set relay ws://<relay>:7070/live/CLOCK; deck-set --restart scene /usr/share/deck/scenes/sandbox/show-clock.toml
[stage]
name = "show clock – follow"

[[node]]
id = "tempo"
kind = "tempo"
bpm = 120
beats = 4
source = "relay"
click = true

[[node]]
id = "click"
kind = "click"
gain = 0.5

[[node]]
id = "out"
kind = "audio_out"
volume = 0.8

[[link]]
from = "click"
to = "out.in"

[[node]]
id = "flash"
kind = "shader"
effect = "flash"

[[node]]
id = "screen"
kind = "screen"

[[link]]
from = "tempo.phase"
to = "flash.a"

[[link]]
from = "tempo.bar_phase"
to = "flash.c"

[[link]]
from = "flash"
to = "screen.in"