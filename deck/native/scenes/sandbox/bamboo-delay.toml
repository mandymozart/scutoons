# A sandbox (#780): the bamboo forest with a delay bus – the rig `bamboo-forest` flattened (the grove's wind sequencer
# `bamboo_forest`, its hits cabled into the perc track's knock `perc_knock`), in a gusty wind, and the perc track's
# sound sent at scene level to the bus `fx-delay` into the delay module (dotted eighths bouncing left and right), whose
# echoes join the mix on its second input – the scene's own spores, as crows-rave sends its crows.
# Written by deck-native's tests/bamboo_forest.rs `the_sandbox_is_the_rig_with_a_delay_bus` – never by hand:
#   UPDATE_FIXTURES=1 cargo test -p deck-native --features modules --test bamboo_forest
# From deck/ (modules: bamboo, analog, delay in DECK_MODULES):
#   cargo run -p deck-native --release --features modules -- --dev --scene bamboo-delay --windowed

[stage]
name = "Bamboo delay"
render_scale = 1.0
transition = "fade"
transition_secs = 0.4000000059604645

[[node]]
id = "bamboo_forest"
kind = "module:bamboo"
gust = 0.7
thick = 1.5
thin = 2.0
wind = 0.7

[[node]]
id = "perc_knock"
kind = "module:analog"
a1_level = 0.9
a1_pan = -0.1
a1_vel = 0.7
a2_level = 0.6
a2_pan = 0.1
a2_vel = 0.7
ae1_a = 0.001
ae1_d = 0.22
ae1_r = 0.12
ae1_s = 0.0
ae2_a = 0.001
ae2_d = 0.05
ae2_r = 0.04
ae2_s = 0.0
f1_cutoff = 2500.0
f1_env = 0.0
f1_key = 0.5
f1_mode = 0.0
f1_res = 0.1
f2_cutoff = 1800.0
f2_env = 0.3
f2_key = 0.8
f2_mode = 1.0
f2_res = 0.5
fe2_a = 0.001
fe2_d = 0.03
fe2_p2 = 7.0
fe2_r = 0.03
fe2_s = 0.0
noise_level = 0.25
noise_route = 1.0
o1_level = 0.9
o1_route = 0.0
o1_wave = 3.0
o2_level = 0.35
o2_route = 1.0
o2_semi = 19.0
o2_wave = 2.0
volume = 0.8

[[node]]
id = "mix1"
kind = "mixer"
gain1 = 1.0
gain2 = 1.0

[[node]]
id = "out"
kind = "audio_out"

[[node]]
id = "fft"
kind = "fft"

[[node]]
id = "space"
kind = "space"
bloom = 0.6
glow = 0.6
glow_light = 1.0
glow_range = 7.0
hue = 0.52
join = "deck"
light = 0.85
post = ["bloom", "curves", "pixelate", "fxaa"]
quality = "low"
threshold = 0.55

[[node]]
id = "screen"
kind = "screen"

[[node]]
id = "fx-delay"
kind = "bus"

[[node]]
id = "delay"
kind = "module:delay"
damp = 3000.0
feedback = 45.0
mix = 100.0
pingpong = 100.0
sync = 8.0

[[link]]
from = "perc_knock.out"
to = "mix1.in1"
scale = 1.0
offset = 0.0

[[link]]
from = "mix1.out"
to = "out.in"
scale = 1.0
offset = 0.0

[[link]]
from = "mix1.out"
to = "fft.in"
scale = 1.0
offset = 0.0

[[link]]
from = "bamboo_forest.hits"
to = "perc_knock.notes"
scale = 1.0
offset = 0.0

[[link]]
from = "space"
to = "screen.in"
scale = 1.0
offset = 0.0

[[link]]
from = "perc_knock.out"
to = "fx-delay.in"
scale = 0.5
offset = 0.0

[[link]]
from = "fx-delay.out"
to = "delay.in"
scale = 1.0
offset = 0.0

[[link]]
from = "delay.out"
to = "mix1.in2"
scale = 1.0
offset = 0.0

[being]
size = 0.5
drift = 0.05999999865889549
breath = 0.03500000014901161
wobble = 0.02500000037252903
hose = 1.0
bubbles = 1.0
expose = ["bamboo_forest.wind", "bamboo_forest.gust", "bamboo_forest.thin", "bamboo_forest.thick", "bamboo_forest.direction", "bamboo_forest.root", "bamboo_forest.scale", "bamboo_forest.debounce", "perc_knock.volume", "perc_knock.ae1_d", "perc_knock.f2_cutoff"]
character = ""
moods = ["neutral", "thinking", "happy", "laughing", "surprised"]
feel = []
react = []
