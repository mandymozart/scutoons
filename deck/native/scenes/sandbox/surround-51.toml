# #318 a 5.1 bed: one tone per channel in the 5.1 order L R C LFE Ls Rs (220, 277, 330, 55, 392, 466 Hz – each speaker its
# own pitch, the LFE a low hum), summed in a six-channel bus and played by one `out` with layout 5.1. On a device with six
# or more channels (the RME: outs 1–6) each channel plays itself; on a stereo device the deck folds it by ITU-R BS.775
# (L + C/√2 + Ls/√2, the LFE dropped). No picture. Run it:
#   cargo run --release -p deck-native -- --scene scenes/sandbox/surround-51.toml --windowed
[stage]
name = "5.1 bed (#318)"

[[node]]
id = "l"
kind = "osc"
freq = 220
gain = 0.08

[[node]]
id = "r"
kind = "osc"
freq = 277.2
gain = 0.08

[[node]]
id = "c"
kind = "osc"
freq = 329.6
gain = 0.08

[[node]]
id = "lfe"
kind = "osc"
freq = 55
gain = 0.1

[[node]]
id = "ls"
kind = "osc"
freq = 392
gain = 0.08

[[node]]
id = "rs"
kind = "osc"
freq = 466.2
gain = 0.08

[[node]]
id = "bed"
kind = "bus"
channels = 6

[[node]]
id = "out"
kind = "out"
layout = "5.1"

[[link]]
from = "l"
to = "bed.in"
map = [[1, 1]]

[[link]]
from = "r"
to = "bed.in"
map = [[1, 2]]

[[link]]
from = "c"
to = "bed.in"
map = [[1, 3]]

[[link]]
from = "lfe"
to = "bed.in"
map = [[1, 4]]

[[link]]
from = "ls"
to = "bed.in"
map = [[1, 5]]

[[link]]
from = "rs"
to = "bed.in"
map = [[1, 6]]

[[link]]
from = "bed.out"
to = "out.in"
