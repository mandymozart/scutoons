# The three crows rave (#747, research/audio-nodes-foundation.md §4): MIDI input 1, channel 1 plays three crows, each an arp
# (up, 1/8, two octaves) into analog's `hoover-dissonant` – the second a minor third up, the third a tritone up: a diminished
# triad on every eighth at 160 BPM. The drum machine stands next to the fox crow: four analog lanes with the drum presets.
# The analog values are analog.preset.json's presets written out (tests/crows_rave.rs holds them equal) until a node can
# name a module preset (#346). Needs the `modules` build with arp, analog, delay and reverb in DECK_MODULES:
#   cargo run --release -p deck-native --features modules -- --dev --scene crows-rave
[stage]
name = "Three crows rave"

[being]
character = "crows"
size = 0.5
drift = 0.06
breath = 0.04
wobble = 0.025

[[node]]
id = "tempo"
kind = "tempo"
bpm = 160
beats = 4
source = "internal"

[[node]]
id = "midi"
kind = "world"
source = "midi"
listen = ["midi.note"]
port = 1
channel = 1

# crow wolf: the played note, pan 0.0

[[node]]
id = "wolf-arp"
kind = "module:arp"
mode = 0.0
rate = 4.0
