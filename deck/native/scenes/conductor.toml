# The Cathedral of decks (#188 phase 4) – the conductor: a being made the same way as the decks' (its body = this
# graph's nodes, its parameters 3D buttons), bigger, with PLF's portrait as its head – not PLF herself (owner
# 2026-10-30) – in the middle of the nave; every deck that joins the session floats into a circle around it, its being
# built from what it streams, the hoses between beings following who sends to whom. Cat Pope s1c2: the sermon, the
# decks the congregation and the choir. Needs a relay (deck.toml `relay` or --relay) and, on a relay with a secret,
# the conductor's session token (--token / LIVE_TOKEN). Run it:
#   cargo run --release -p deck-native -- --scene conductor --windowed --relay ws://127.0.0.1:7700/live/CATH
# (local copies of the set and the portraits instead of the sync: --sets ../media/scutoons/rooms --portraits ../media/characters)
# Stand-in decks: cargo run --release -p deck-native --example decks -- ws://127.0.0.1:7700/live/CATH 4

[stage]
name = "Cathedral of decks - conductor"
render_scale = 1.0

# the conductor's head: PLF's portrait (plf_portrait-<mood> under --portraits); the moods of the sermon, calm → the
# explosive crescendo
[being]
character = "plf"
moods = ["neutral", "thinking", "smug", "laughing", "furious"]
size = 0.8
drift = 0.04
breath = 0.05
wobble = 0.02

# feedback → emotion and back (space/feel.rs; the format: scenes/cathedral.toml). The paths name nodes by their kind
# (fm.index, lfo.out ...), so the same rules read every deck's being in the circle too – from what it streams.
feel = [
  { mood = "smug", when = "touch", above = 0.5, weight = 6 },
  { mood = "embarrassed", when = "touch", falling = 0.3, weight = 6, hold = 2 },
  { mood = "dizzy", when = "strain", above = 0.4, weight = 7, hold = 2 },
  { mood = "dizzy", when = "lfo.shape", rising = 0.5, weight = 6, hold = 3 },
  { mood = "surprised", when = "fft.bass", rising = 0.12, weight = 5, hold = 1.2 },
  { mood = "scared", when = "fft.level", rising = 0.2, weight = 5 },
  { mood = "angry", when = "fft.high", rising = 0.08, weight = 4, hold = 1 },
  { mood = "dying", when = "fft.level", below = 0.015, for = 1.5, weight = 4 },
  { mood = "tripping", when = "lfo.rate", above = 0.4, weight = 4 },
  { mood = "furious", when = "fm.index", above = 4.2, weight = 3 },
  { mood = "confused", when = "fm.ratio", above = 2.6, weight = 3 },
  { mood = "crying", when = "fft.level", falling = 0.15, weight = 3 },
  { mood = "laughing", when = "bpm", above = 104, weight = 2 },
  { mood = "happy", when = "fft.mid", above = 0.3, for = 1, weight = 2, chance = 0.5, cooldown = 12 },
  { mood = "disgusted", when = "lfo.out", below = 0.05, weight = 2 },
  { mood = "denial", when = "phrase", above = 7, weight = 2 },
  { mood = "bargaining", when = "phrase", above = 3, below = 3.5, weight = 2, chance = 0.6 },
  { mood = "sad", when = "fft.bass", below = 0.04, for = 2 },
  { mood = "thinking", when = "fft.level", steady = 3, by = 0.06 },
  { mood = "acceptance", when = "energy", steady = 5, by = 0.08 },
  { mood = "neutral", when = "phrase", below = 0.25 },
]
react = [
  { mood = "neutral", set = "space.light", by = 0.15, release = 3 },
  { mood = "thinking", set = "organ.freq", by = -10, attack = 0.5, release = 4 },
  { mood = "thinking", set = "swell.depth", by = -0.4, release = 4 },
  { mood = "happy", set = "space.hue", by = 0.1, release = 3 },
  { mood = "happy", set = "voice.ratio", by = 0.5, release = 3 },
  { mood = "laughing", set = "swell.rate", by = 0.5, release = 4 },
  { mood = "laughing", set = "voice.freq", by = 82, attack = 0.25, release = 3 },
  { mood = "smug", set = "voice.ratio", by = 1, release = 3 },
  { mood = "smug", set = "space.glow", by = 0.3, release = 2 },
  { mood = "surprised", set = "space.glow", by = 0.7, attack = 0.03, release = 0.8 },
  { mood = "surprised", set = "organ.freq", by = 12, attack = 0.15, release = 0.8 },
  { mood = "scared", set = "space.light", by = -0.4, attack = 0.05, release = 1.5 },
  { mood = "scared", set = "voice.gain", by = 0.04, attack = 0.3, release = 1.5 },
  { mood = "furious", set = "space.hue", to = 0.0, attack = 0.2, release = 3 },
  { mood = "furious", set = "space.glow", by = 0.5, release = 3 },
  { mood = "furious", set = "organ.freq", by = -10, release = 2 },
  { mood = "angry", set = "space.hue", to = 0.03, release = 1.5 },
  { mood = "angry", set = "voice.freq", by = -20, release = 1.5 },
  { mood = "disgusted", set = "space.hue", to = 0.22, release = 3 },
  { mood = "disgusted", set = "voice.ratio", by = 1.41, release = 2.5 },
  { mood = "embarrassed", set = "space.hue", to = 0.95, release = 2.5 },
  { mood = "embarrassed", set = "voice.gain", by = -0.03, attack = 0.4, release = 2 },
  { mood = "confused", set = "swell.depth", by = -0.5, release = 3 },
  { mood = "confused", set = "mix.gain1", by = -0.3, attack = 0.5, release = 3 },
  { mood = "dizzy", set = "swell.rate", by = 0.8, release = 4 },
  { mood = "dizzy", set = "space.light", by = -0.2, release = 2 },
  { mood = "tripping", set = "space.hue", by = 0.5, attack = 1, release = 5 },
  { mood = "tripping", set = "voice.ratio", by = 0.5, release = 4 },
  { mood = "sad", set = "space.hue", to = 0.64, release = 4 },
  { mood = "sad", set = "music.gain", by = -0.2, attack = 0.8, release = 4 },
  { mood = "crying", set = "voice.freq", by = -10, release = 3 },
  { mood = "crying", set = "space.glow", by = -0.3, release = 3 },
  { mood = "dying", set = "space.light", by = -0.5, attack = 1, release = 4 },
  { mood = "dying", set = "organ.freq", by = -5, attack = 1.5, release = 4 },
  { mood = "dying", set = "voice.gain", by = -0.02, attack = 1.5, release = 4 },
  { mood = "denial", set = "mix.gain1", by = -0.5, attack = 0.4, release = 1.8 },
  { mood = "bargaining", set = "voice.ratio", by = -0.5, release = 3 },
  { mood = "bargaining", set = "swell.rate", by = 0.1, release = 3 },
  { mood = "acceptance", set = "space.glow", by = -0.2, release = 5 },
  { mood = "acceptance", set = "space.light", by = 0.1, release = 5 },
]

# the show's clock – the decks' beings breathe on it too
[[node]]
id = "tempo"
kind = "tempo"
bpm = 84
beats = 4
source = "internal"

# the sermon's chapter
[[node]]
id = "music"
kind = "chapter_music"
toon = "catpope"
chapter = 2
quality = "low"
gain = 0.6

# the organ under the sermon: a low drone that swells with the bass
[[node]]
id = "organ"
kind = "osc"
freq = 41.2
gain = 0.08

# the crescendo's swell: a slow LFO over the organ's partner voice
[[node]]
id = "swell"
kind = "lfo"
rate = 0.05
depth = 1.0

[[node]]
id = "voice"
kind = "fm"
freq = 82.4
ratio = 2.0
index = 1.0
gain = 0.06

[[node]]
id = "mix"
kind = "mixer"
gain1 = 1.0
gain2 = 1.0
gain3 = 1.0

[[node]]
id = "fft"
kind = "fft"
release = 0.4

[[node]]
id = "out"
kind = "audio_out"
volume = 0.8

# the middle of the nave (the set's metres), the camera outside the circle of decks; `ring` = the circle's radius (m)
[[node]]
id = "space"
kind = "space"
set = "cathedral"
quality = "low"
at = [5.2, -0.2, 0.5]
yaw = 180
pitch = 12
distance = 6.0
ring = 3.0
hue = 0.08
glow = 0.75
light = 0.8
join = "conductor"
# the post stack (#204, deck-space post.rs): passes in this order after the space is drawn – bloom, curves (lift /
# gamma / gain), pixelate (block size in render pixels, `levels` per channel, or `palette` = ["#rrggbb", …]), FXAA. Their
# knobs are the space node's control inputs (link them, nudge them from `react`); one at neutral costs nothing (curves at
# 0 / 1 / 1, pixel 1 without levels or palette), a pass not listed doesn't exist
post = ["bloom", "curves", "pixelate", "fxaa"]
bloom = 0.6
threshold = 0.55
# the being's core lights the room (#204): `glow_range` (m) how far, `glow_light` how strong (0 = off) – its colour the
# hue, its strength glow + the level's pulse
glow_range = 7.0
glow_light = 1.0

[[node]]
id = "screen"
kind = "screen"

[[link]]
from = "music"
to = "mix.in1"

[[link]]
from = "organ"
to = "mix.in2"

[[link]]
from = "voice"
to = "mix.in3"

[[link]]
from = "mix"
to = "fft.in"

[[link]]
from = "mix"
to = "out.in"

[[link]]
from = "swell"
to = "voice.index"
scale = 4
offset = 0.5

[[link]]
from = "fft.bass"
to = "organ.gain"
scale = 0.2
offset = 0.04

[[link]]
from = "fft.level"
to = "space.pulse"
scale = 0.8

[[link]]
from = "space"
to = "screen.in"
