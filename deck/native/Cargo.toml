# deck-native – the native AV app the deck boots into (CYBERDECKS.md §8, #179): winit + wgpu, a node graph from a TOML
# scene, an audio graph on PipeWire (cpal elsewhere), chapter music from the library API with a disk cache.
# Versions are pinned to the APIs this code was written against; a bump is its own step.
[package]
name = "deck-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "deck"
path = "src/main.rs"

# Modules = cargo features (#185, CYBERDECKS.md §8): the core (graph, control, the basic audio nodes, the render passes,
# the HUD, the internal tempo clock) is always built; a module adds node kinds or tempo sources (deck-core's
# stage.rs table). A scene that uses a module this build lacks is refused with the feature's name, on screen.
# `cargo run -p deck-scene-features -- scenes/*.toml` lists what a set of scenes needs. The default = everything but the
# platform's (pipewire) and link (it needs cmake): a plain `cargo build` plays every bundled scene.
[features]
default = ["space", "sync", "chapter", "live", "midi", "osc", "outputs", "events"]
# the 3D space and the deck's being (#188): glTF rooms (meshopt, WebP), the orbit camera, the 3D buttons and their labels –
# deck-space's (deck/space, #198), with its GPU passes and its loaders on threads
space = ["deck-space/being", "deck-engine/space", "deck-space/gpu", "deck-space/native", "dep:serde_json", "image/webp"]
# the deck's sync (#195): what the scene needs – its sets' 3D, its beings' portraits – from the API (scene-content) into
# the cache, only what is missing or changed, offline from the cache (sync.rs)
# and the conductor's pushes (`scene.sync` → `deck.synced`, #195)
sync = ["dep:ureq", "dep:serde_json", "dep:protocol"]
# a chapter from scutoons.com (library API + disk cache): `chapter` (its slices, the dialog set in the reader's fonts)
# and `chapter_music` (its music, decoded with symphonia)
chapter = ["dep:ureq", "dep:serde_json", "dep:symphonia", "image/webp"]
# a Live outlet (#186): the `outlet` node joins the relay as `output` of this deck's outlet, preloads the show media with
# the deck token (deck-link) and renders the outlet's cells natively (live/); slices and text come from `chapter`
live = ["chapter", "dep:protocol", "dep:deck-show", "dep:tungstenite", "dep:rustls", "dep:wtransport", "dep:webpki-roots", "dep:tokio"]
# generators that talk in events (#236, deck-events): the `walk` node – a seeded melody as seq's cv
events = ["dep:deck-events", "deck-engine/events"]
# rig modules (#280, research/RIG-EDITING.md §4): compiled wasm instruments (deck-module's SDK) run in wasmtime – the
# scene's `module:<name>` kinds, loaded from DECK_MODULES (module_host.rs). A trap or a time-budget overrun silences that
# node, never the show. Not in the default (wasmtime's compiler is a big dependency)
modules = ["dep:deck-module-host", "dep:deck-catalog", "deck-engine/modules"]
# MIDI clock in and out (the tempo clock's `midi` source, the tempo node's `midi_out`)
midi = ["dep:midir"]
# the parameters as outputs (#211): the scene's [outputs] – MIDI out (a port, or the conductor over the relay), DMX
# fixtures through a USB-DMX widget (the bridge's adapters in-process), the clock-synced strobe (deck-outputs)
outputs = ["dep:deck-outputs", "dep:adapters-core", "dep:adapters-dmx-usbpro", "dep:adapters-midi", "dep:protocol", "dep:tokio"]
# the OSC remote for the tempo clock (`/tempo/bpm` …, the `osc` source)
osc = ["dep:rosc"]
# the PipeWire backend (Linux, needs libpipewire + clang at build time); without it the stage plays through cpal
pipewire = ["dep:pipewire"]
# ASIO on Windows (#208: `--audio-host asio`, RME's driver for the Fireface): cpal's asio host. Its asio-sys builds
# bindings to Steinberg's ASIO SDK – set CPAL_ASIO_DIR to the unpacked SDK and have LLVM (libclang) installed;
# deck/native/README.md "Audio". Not in the default: a plain build needs no SDK
asio = ["cpal/asio"]
# Ableton Link as a tempo source (tempo/link.rs; rusty_link builds Ableton's abl_link C++ library – needs cmake, a C++
# compiler and libclang at build time). On Windows a debug build links only with an optimised rusty_link:
# `--config 'profile.dev.package.rusty_link.opt-level=1'` (its cmake Debug build wants the debug CRT) – deck/native/README.md
link = ["dep:rusty_link"]
# a gamepad on the native stage (#228): gilrs reads the pad, pad.rs maps its sticks and buttons onto deck-space's
# controls. Not in the default: gilrs needs libudev at build time on Linux; on Windows and macOS it needs nothing.
# The sticks drive the being's knobs, so it needs the space.
gamepad = ["space", "dep:gilrs"]

[dependencies]
# the batch evaluator's pieces (#183): `math` (sine, rounding without libm), `batch` (input columns, dependency levels);
# the FFT analyzer and the tempo map (#185)
deck-core = { workspace = true, features = ["analysis", "tempo"] }
# the scene model (graph, params, scene) and – with `space` – the 3D space itself (#198: shared with the browser)
deck-space = { path = "../space", default-features = false, features = ["gpu"] }
deck-events = { path = "../events", optional = true }
# #317: the audio engine, the control domain and the FFT half – the universal core's; this crate keeps the device I/O
deck-engine = { path = "../engine" }
# #280: the module host (feature `modules`) – the wasm engine, the SDK's descriptor + ABI layout, the compile cache's key
deck-module-host = { path = "../module-host", optional = true }
deck-catalog = { path = "../catalog", optional = true }
# #378: the Live outlet's logic (the plan, the composer, the crossfade, the dialog / text layout in the reader's fonts, the
# relay messages' routing) – platform-free; this crate keeps its threads, socket, HTTP, disk cache and decoding (live/)
deck-outlet = { path = "../outlet" }
# #91: a flash's deck side (the show this outlet plays at its pinned version, its pieces checked, the report's words) –
# deck-show's ready.rs; live/flash.rs is its thread
deck-show = { path = "../show", optional = true }
# #374: the deck's UI model (the HUD's lines, the bar's items, the F1 mode) – platform-free; this crate reads its objects
# into deck-ui's Status (hud_status.rs) and rasters the answer (hud.rs)
deck-ui = { path = "../ui" }
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu = "25"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.15"
rtrb = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"], optional = true }
ureq = { version = "2", optional = true }
# --screenshot (png); the chapter's slices and the rooms' textures add webp
image = { version = "0.25", default-features = false, features = ["png"] }
# the tempo clock's external sources (#181): MIDI clock in / out, OSC
midir = { workspace = true, optional = true }
rosc = { workspace = true, optional = true }
rusty_link = { version = "0.4.9", optional = true }
# the Live outlet (#186): the relay protocol (one schema → TS + Rust), a blocking WebSocket client on its own thread (the
# version tokio-tungstenite already pulls)
protocol = { workspace = true, optional = true }
# wss:// (#199 – the hosted relay wss://live.scutoons.com): rustls with the webpki roots, no OpenSSL; rustls (ring) is
# the one ureq already links, named here so `live` has its crypto provider on its own
tungstenite = { version = "0.30", optional = true, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
# QUIC to the relay (#438, live/quic.rs): the door browsers open as WebTransport; ring, as above; a live deck has no CA store of its own
wtransport = { version = "0.7", optional = true, default-features = false, features = ["ring"] }
webpki-roots = { version = "1", optional = true }
# #211: the outputs' engine + runner and the bridge's adapters (USB-DMX, MIDI out)
deck-outputs = { workspace = true, optional = true }
adapters-core = { workspace = true, optional = true }
adapters-dmx-usbpro = { workspace = true, optional = true }
adapters-midi = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# a stop signal ends the show the normal way (#263, stop.rs): SIGTERM / SIGHUP / SIGINT, Ctrl+C on Windows
ctrlc = { version = "3.4", features = ["termination"] }
# the deck's pairing (#180): the code for the splash, the token from deck-link's run directory (no crypto, no HTTP – its
# `net` feature off; the daemon `deck-link run` pairs)
deck-link = { path = "../link", default-features = false }
# #228: the native stage's gamepad (the feature `gamepad`, pad.rs)
gilrs = { version = "0.11.1", optional = true }

[target.'cfg(windows)'.dependencies]
# the audio threads in MMCSS "Pro Audio" (#208, audio/priority.rs) – the version cpal and wgpu already pull
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", optional = true, features = ["v0_3_50"] }
# CLOCK_MONOTONIC for the time base (clock.rs – the clock PipeWire stamps its cycles with)
libc = "0.2"

# `cargo bench -p deck-native`: the graph workloads (#183) – µs per audio block / control step
[[bench]]
name = "graph"
harness = false

[dev-dependencies]
# tests/live_relay.rs: the deck's outlet against the real relay on 127.0.0.1 (#186)
relay = { path = "../relay" }
# tests/live_quic.rs: a certificate pinned by hash, as a venue's self-signed relay would be
wtransport = { version = "0.7", default-features = false, features = ["ring", "self-signed"] }
tokio = { workspace = true }

# a stand-in conductor for trying an outlet (#186): `cargo run -p deck-native --example live-cue -- <relay> examples/sermon.json`
[[example]]
name = "live-cue"
required-features = ["live"]

# stand-in decks for the Cathedral of decks (#188 phase 4): `cargo run -p deck-native --example decks -- <relay> 4`
[[example]]
name = "decks"
required-features = ["live", "space"]

[[example]]
name = "midi-clock"
required-features = ["live", "midi"]
