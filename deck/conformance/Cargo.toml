# deck-conformance – dev only (#309, P0 of agents/research/ENGINE-REFACTOR-PLAN.md; #317 moved the engine): EVIDENCE about how
# far the engine (deck-engine, driven as the native deck drives it) and the browser's (live-core's BatchGraph behind
# deck-space's `lower()`) differ per node kind, whether live-core and deck-engine are bit-exact native vs wasm
# (engine-wasm/ is deck-engine behind raw exports). The tests print the report tables; fixtures/ holds the engine's renders
# as hashes (the guard of every engine change).
[package]
name = "deck-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
deck-native = { path = "../native" }
deck-space = { path = "../space", default-features = false }
deck-core = { workspace = true, features = ["analysis"] }
live-core = { path = "../live-core" }
deck-engine-wasm = { path = "engine-wasm" }
deck-engine = { path = "../engine", features = ["events"] }
wasmtime = { version = "38", default-features = false, features = ["cranelift", "runtime", "std"] }
serde_json.workspace = true
toml.workspace = true
