[package]
name = "deck-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The native editor's proof (#444): one window, the stage beside a panel, on deck-native's pieces"

[[bin]]
name = "deck-editor"
path = "src/main.rs"

[features]
# the stage on ASIO (the RME's driver on Windows; the SDK as deck/native/README.md "Audio" says); no-op elsewhere
default = ["asio"]
asio = ["deck-native/asio"]

[dependencies]
# the deck's own pieces: the window and its GPU (#443), the audio stack, the rig player, the stage
deck-native = { path = "../native", default-features = false, features = ["bundled", "modules"] }
# the Module workspace: a local build by the compile service's own rules (deck/build `local`), the descriptors
scutoons-build = { path = "../build" }
deck-catalog = { path = "../catalog" }
deck-kit = { path = "../kit", features = ["editor", "icons"] }
deck-space = { path = "../space", default-features = false, features = ["being", "gpu", "native", "media"] }
# the hardware video decoders (Media Foundation on Windows) for the Build cards' videos
deck-media-hw = { path = "../media/hw" }
# #632: a medium's Asset tab – a sound's waveform (deck-media audio), a use's trim
deck-media = { path = "../media" }
# the motion slots' modules on the stage (deck-engine `motion`)
deck-engine = { path = "../engine", features = ["modules", "space"] }
# the scene camera's points on the stage (deck-space's own vectors)
glam = "0.28"
deck-core = { workspace = true, features = ["tempo"] }
# #629: a MIDI message into the stage's MIDI world nodes in Play (deck-events' MIDI adapter, as the deck's)
deck-events = { path = "../events" }
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# #485: the editor's UI is deck-kit's egui screen (the deck's mono face, deck-outlet's) drawn by egui-wgpu – the same
# base and renderer as the decks' menu and panel (deck-space stage/ui.rs); no default features, no eframe
egui-wgpu = { version = "0.37", default-features = false }
deck-outlet = { path = "../outlet" }
# the logo and the icons
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
# the OS clipboard for the text field's copy and paste
arboard = { version = "3", default-features = false }
serde_json.workspace = true
# #91: the Show and Perform workspaces draw deck-show's conductor; the relay's envelopes; show documents over /api/shows
deck-show = { path = "../show" }
# #763: the node view's painting, shared with the creator's Spores tab
deck-spores = { path = "../spores" }
# #531: the Session sheet – deck-ui's panel model, the viewer's address (deck-link `app_url`: DECK_APP, else scutoons.com)
deck-ui = { path = "../ui" }
# the editor's sign-in: the decks' handshake as the kind editor (sign_in.rs)
deck-link = { path = "../link", default-features = false, features = ["net"] }
protocol = { workspace = true }
ureq = { version = "2", features = ["json"] }
