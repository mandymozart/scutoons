# deck-module-macros outside the deck/ workspace: see module.Cargo.toml (#281).
[package]
name = "deck-module-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "proc-macro", "full"] }
quote = "1"
proc-macro2 = "1"
