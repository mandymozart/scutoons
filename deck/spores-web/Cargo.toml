# spores-web (#763): the Spores widget (deck-spores) in the browser – the creator's Spores tab draws one weave of the
# spore network with wgpu into a canvas (WebGPU where the browser has an adapter, else WebGL2) through deck-kit's egui
# screen and egui-wgpu, the way the editor and the browser deck draw deck-kit. Build: `npm run build:wasm -w
# shared/live-deck -- --spores`. Natively the crate is empty.
[package]
name = "spores-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
deck-spores = { path = "../spores" }
deck-kit = { path = "../kit", features = ["editor", "icons"] }
protocol = { workspace = true }
serde_json.workspace = true
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
egui-wgpu = { version = "0.37", default-features = false }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
