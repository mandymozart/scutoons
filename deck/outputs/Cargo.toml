# deck-outputs (#211): parameters as outputs – the mapping math (range, curve, invert, smoothing, 7 / 14 / 16 bit), the
# fixture profiles (TOML: channel names → numbers), the clock-synced strobe and the engine that turns the deck's values
# into timed MIDI / DMX messages. Platform-free (no ports, no threads) like deck-core; the `host` feature adds the
# runner that plays the engine's messages through the bridge's adapters (adapters-core) on the deck's clock.
[package]
name = "deck-outputs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# the browser (wasm) takes it without `host`: default-features = false
default = ["host"]
# the runner: a time queue in front of `adapters-core::Adapter`s (the stage's MIDI out port, the USB-DMX widget)
host = ["dep:adapters-core", "dep:protocol", "dep:anyhow", "dep:tracing", "dep:tokio"]

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
adapters-core = { workspace = true, optional = true }
protocol = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
adapters-dmx-usbpro = { workspace = true }
