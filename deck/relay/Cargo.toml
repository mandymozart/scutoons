[package]
name = "relay"
description = "The Live relay (LIVE.md B.4): sessions, roles, groups, the B.6 envelope – one binary on the deck and in the hosted container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# B.6 session tokens: HMAC-SHA256 with the secret shared with the API (src/token.rs)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# a resume key is compared in constant time
subtle = "2"
# wss in the venue (#201, src/tls.rs): rustls with ring (the provider deck-native already links), no OpenSSL; the PEM
# files are read by rustls' own pki-types
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# #223: the accepted sockets' send buffer / TCP_NOTSENT_LOWAT (the backlog stays in the outbox, where it can be coalesced)
socket2 = { version = "0.6", features = ["all"] }

# #441: the hosted relay fetches its certificate from the API (src/cert.rs); the roots are compiled in, the image has no CA store
ureq = { version = "2", default-features = false, features = ["tls"] }

# #438: the QUIC door (src/doors), which browsers open as WebTransport and the native decks dial; opens only with --quic
wtransport = { version = "0.7", default-features = false, features = ["ring", "quinn"] }

[dev-dependencies]
# the acceptance of #90: real relays, real conductors (tests/tree.rs)
deck-show = { path = "../show" }
# a self-signed certificate for the wss tests (tests/tls.rs)
rcgen = "0.13"
# the QUIC door's client end in tests and the bench, and a two-week certificate a browser pins by hash
wtransport = { version = "0.7", default-features = false, features = ["ring", "quinn", "self-signed"] }

# the bench's thread CPU time (examples/bench.rs; Windows calls kernel32 directly)
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
