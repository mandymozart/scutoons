[package]
name = "relay"
description = "The Live relay (LIVE.md B.4): sessions, roles, groups, the B.6 envelope – one binary on the deck and in the hosted container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# B.6 session tokens: HMAC-SHA256 with the secret shared with the API (src/token.rs)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# wss in the venue (#201, src/tls.rs): rustls with ring (the provider deck-stage already links), no OpenSSL; the PEM
# files are read by rustls' own pki-types
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# #223: the accepted sockets' send buffer / TCP_NOTSENT_LOWAT (the backlog stays in the outbox, where it can be coalesced)
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
# a self-signed certificate for the wss tests (tests/tls.rs)
rcgen = "0.13"
