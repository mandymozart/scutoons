[package]
name = "relay"
description = "The Live relay (LIVE.md B.4): sessions, roles, groups, the B.6 envelope – one binary on the deck and in the hosted container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[[example]]
name = "doors_bench"
required-features = ["doors"]

[[test]]
name = "doors"
required-features = ["doors"]

[dependencies]
protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# B.6 session tokens: HMAC-SHA256 with the secret shared with the API (src/token.rs)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# wss in the venue (#201, src/tls.rs): rustls with ring (the provider deck-native already links), no OpenSSL; the PEM
# files are read by rustls' own pki-types
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# #223: the accepted sockets' send buffer / TCP_NOTSENT_LOWAT (the backlog stays in the outbox, where it can be coalesced)
socket2 = { version = "0.6", features = ["all"] }

# #438 prototype, off the default path: every transport into the same sessions (src/doors, agents/research/RELAY-TRANSPORTS.md)
quinn = { version = "0.11", optional = true }
wtransport = { version = "0.7", default-features = false, features = ["ring", "self-signed"], optional = true }
renet2 = { version = "1", default-features = false, optional = true }
renet2_netcode = { version = "1", default-features = false, features = ["native_transport", "wt_server_transport"], optional = true }

[features]
doors = ["dep:quinn", "dep:wtransport", "dep:renet2", "dep:renet2_netcode"]

[dev-dependencies]
# a self-signed certificate for the wss tests (tests/tls.rs)
rcgen = "0.13"

# the bench's thread CPU time (examples/bench.rs; Windows calls kernel32 directly)
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
