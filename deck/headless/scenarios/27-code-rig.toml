name = "catpope as a code rig: its mood switching is a policy module over the tracks"
about = "#408 (T1 of #314, research/RIG-MODULE-GROUPS.md §3): the core catpope rig with a `policy` instead of its mood tables – the module catpope_rig chooses the voice's preset, sets its FM index and the drone's level. The core checks it with the module's descriptor (validate.rs, what the build service's POST /validate runs), flattens it with the policy node and its target links (@preset a table of the choices), describes its face (Rig::describe). Then the moods: the policy must choose what the tables chose – that needs the live mood in the module (T2, #409) and the deck applying @preset (#410). Native and wasm give the same answers"
expected_fail = "#408 the rig's policy in deck-space"

# the policy as its module document's descriptor says (the build service stores it; `module:catpope_rig`)
[[step]]
do = "code_rig"
[step.with]
core = "character.catpope"
policy = { module = "catpope_rig" }
[step.with.module]
name = "catpope_rig"
domain = "control"
abi = 2
doc = "catpope: the voice's preset and FM index, the drone's level, by mood"
ports = [
  { name = "voice_preset", dir = "out", type = "control", path = "voice:@preset", choices = ["cathedral_voice.base", "cathedral_voice.low", "cathedral_voice.bright"] },
  { name = "voice_index", dir = "out", type = "control", path = "voice:voice.index" },
  { name = "drone_gain", dir = "out", type = "control", path = "drone:drone.gain" },
]
params = [{ name = "heat", min = 0.0, max = 1.0, default = 0.0, doc = "how far the being's energy opens the FM index (0 = the table alone)" }]
[step.expect]
problems = []
# decision 2: the policy owns voice.index (set), so the low preset's index = 1 is dropped – said, not refused
warnings = { has = "cathedral_voice.low sets voice.index, which the policy drives (voice:voice.index, set): dropped" }
nodes = { has = "policy" }
kind = "module:catpope_rig"
cables = ["policy.drone_gain → drone_drone.gain", "policy.voice_index → voice_voice.index"]
presets = { voice = ["cathedral_voice.base", "cathedral_voice.low", "cathedral_voice.bright"] }
streamed = { has = "policy.voice_preset" }
knobs = { has = "policy.heat" }
targets = ["voice:@preset → preset of voice", "voice:voice.index → voice_voice.index", "drone:drone.gain → drone_drone.gain"]
driven = ["drone:drone.gain", "voice:voice.index"]

# the tables and the code may not both write one input (decision 2): catpope's own mood tables set voice.index too
[[step]]
do = "code_rig"
[step.with]
core = "character.catpope"
keep_moods = true
policy = { module = "catpope_rig" }
[step.with.module]
name = "catpope_rig"
domain = "control"
abi = 2
ports = [
  { name = "voice_preset", dir = "out", type = "control", path = "voice:@preset", choices = ["cathedral_voice.base", "cathedral_voice.low", "cathedral_voice.bright"] },
  { name = "voice_index", dir = "out", type = "control", path = "voice:voice.index" },
  { name = "drone_gain", dir = "out", type = "control", path = "drone:drone.gain" },
]
params = [{ name = "heat", min = 0.0, max = 1.0, default = 0.0 }]
[step.expect]
problem = { contains = "the policy chooses voice's preset" }

# a policy without its module document is refused
[[step]]
do = "code_rig"
with = { core = "character.catpope", policy = { module = "catpope_rig" } }
expect = { problem = { contains = "no module 'catpope_rig'" } }

# the moods: what the policy chooses for each must be what catpope's tables choose (the same values on the same inputs)
[[step]]
do = "code_rig_moods"
[step.with]
core = "character.catpope"
policy = { module = "catpope_rig" }
moods = ["neutral", "thinking", "sad", "happy", "laughing", "surprised"]
[step.with.module]
name = "catpope_rig"
domain = "control"
abi = 2
ports = [
  { name = "voice_preset", dir = "out", type = "control", path = "voice:@preset", choices = ["cathedral_voice.base", "cathedral_voice.low", "cathedral_voice.bright"] },
  { name = "voice_index", dir = "out", type = "control", path = "voice:voice.index" },
  { name = "drone_gain", dir = "out", type = "control", path = "drone:drone.gain" },
]
params = [{ name = "heat", min = 0.0, max = 1.0, default = 0.0 }]
[step.expect]
same_as_tables = true
presets = { neutral = "cathedral_voice.base", thinking = "cathedral_voice.low", sad = "cathedral_voice.low", happy = "cathedral_voice.bright", laughing = "cathedral_voice.bright", surprised = "cathedral_voice.bright" }
