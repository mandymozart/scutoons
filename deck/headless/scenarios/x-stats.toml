name = "one monitor: the stats from samples, judged once"
about = "#364: FPS, frame time, CPU per frame, glitches per window and their judgement are computed in main.rs (Stats, bar_items, hud.rs PerMinute over 10 min) and again in TS (FrameStats, timing.ts, perMinute over 1 min) by other rules. One report in the core: samples in, numbers + judgement + text out. The numbers here are the native rules (the owner decides the final ones in #364)"
expected_fail = "#364 the stats computation lives in main.rs and in TS"

[[step]]
do = "load"
scene = "native/scenes/cathedral.toml"

[[step]]
do = "run"
ms = 1000

[[step]]
do = "stats"
with = { frame_ms = 16.667, frames = 180, work_ms = 3.0, glitches_at_s = [1.0, 2.5], dsp_peak = 0.4 }
expect = { fps = { near = 60.0, tol = 0.5 }, frame_ms = { near = 16.67, tol = 0.05 }, cpu_ms = { near = 3.0, tol = 0.01 }, glitches_per_10_min = 2, fps_bad = false, cpu_bad = false, audio_bad = true }
