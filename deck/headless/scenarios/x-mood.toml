name = "the energy ladder walks the being's moods"
about = "#367: the mood ladder (level and tempo up quickly, down slowly; a rung held before the next) is TS (scene.ts Moods, LADDER) next to deck-space being.rs step_head, which only the 3D being runs. The ladder in the core, the page shows its mood"
expected_fail = "#367 the mood ladder lives in live-deck scene.ts"

[[step]]
do = "load"
scene = "native/scenes/cathedral.toml"

[[step]]
do = "run"
ms = 1000
expect = { sound = true }

[[step]]
do = "mood"
with = { moods = ["neutral", "thinking", "happy", "laughing", "surprised"], level = [0.0, 0.2, 0.5, 0.8, 1.0, 1.0], bpm = 140.0, step_s = 3.0 }
expect = { first = "neutral", last = "surprised", seen = { has = "happy" } }
