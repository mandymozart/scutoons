name = "the X1's cathedral: which part a build plays"
about = "#360: the native stage plays a scene's carried part – the nodes its modules have (modules.rs carried_part over deck-core's node_needs) – the browser plays a TS copy (FIXED_SCENE). One filter in the core: given the modules, the part. Note: deck-space's lower() splits by ENGINE_KINDS (the screen leaves, the space stays) – a second rule for the same question"
expected_fail = "#360 carried_part lives in deck-native modules.rs"

[[step]]
do = "load"
scene = "native/scenes/cathedral.toml"

[[step]]
do = "carried_part"
with = { scene = "native/scenes/cathedral.toml", modules = ["core"] }
expect = { dropped = ["music", "space"], kept = 11 }
