name = "the tempo line and the clock choices are the core's"
about = "#370: the tempo line's wording is main.rs tempo_line (BPM x  BAR y BEAT z) and differently deck-clock.svelte's (x BPM <line>); the picker's choice and the MIDI-out flag live in three copies in the page. One line and the choices as core state"
expected_fail = "#370 the tempo line lives in main.rs and deck-clock.svelte"

[[step]]
do = "load"
scene = "native/scenes/show-clock-lead.toml"

[[step]]
do = "run"
ms = 2250
expect = { bpm = 120.0, running = true }

[[step]]
do = "tempo_line"
expect = { line = "BPM 120.0  BAR 2 BEAT 1 CLK", source = "internal", lead = true, midi_out = false }
