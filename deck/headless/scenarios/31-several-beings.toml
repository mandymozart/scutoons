name = "several beings on one stage: a look per character holder, each moved only by what its own rig wires"
about = "#492 (research/SCENES.md §9.6 2·1; owner 2026-11-12 [rigs]: \"if a rig has no mapping to visual properties nothing moves\", and \"Breath with my loudness is a demo remain. Only if i decided the wiring\"): the template scene:stage resolved by the core with two fillers – Cat Pope (her core rig sounds but wires nothing to her being) and a character whose rig wires its sum's level into its being (`sound:level → being:pulse`). The stage has a `look` node per holder at its spot; only the wired rig moves its look, and only its own. The space draws one being per look node (deck-space space/mod.rs `Cast`), native and browser alike"

[[step]]
do = "load"
document = "../server/tests/fixtures/scenes/templates/stage.json"
with = { where = "location:dom", left = "character:catpope", right = "character:hum" }
[step.rigs."character.hum".rig]
subject = "character.hum"
track = [{ id = "hum", instrument = "hum" }]
route = [{ from = "sound:level", to = "being:pulse", scale = 0.6 }]
[[step.rigs."character.hum".instrument]]
id = "hum"
kind = "pad"
name = { en = "Hum" }
out = "osc"
node = [{ id = "osc", kind = "osc", freq = 110.0, gain = 0.1 }]
[step.expect]
page = []
ids = { has = "left_look" }
stage = { cast = [{ holder = "left", look = "left_look", character = "catpope", spot = "spot_left" }, { holder = "right", look = "right_look", character = "hum", spot = "spot_right" }], slots = ["left_", "right_"], notes = [], location = "location:dom" }

[[step]]
do = "run"
ms = 1500
expect = { sound = true }

# the hum's look breathes with its own sum, because its rig wires it (its fft.level → its look's pulse) …
[[step]]
do = "heard"
path = "right_look.pulse"
expect = { value = { min = 0.001 } }

# … and Cat Pope's does not: she sounds, but her rig wires nothing to her being – no default breath
[[step]]
do = "heard"
path = "left_look.pulse"
expect = { value = 0.0 }

[[step]]
do = "heard"
path = "left_look.glow"
expect = { value = 0.6 }

[[step]]
do = "heard"
path = "left_look.hue"
expect = { value = 0.52 }

# the room is no one's being: no rig drives the space's own being inputs on a stage of several
[[step]]
do = "heard"
path = "space.pulse"
expect = { value = 0.0 }
