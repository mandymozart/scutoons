name = "rig facts and the rig's lifecycle come from deck-space"
about = "#368: deck-space's deck (deck.rs) plays a rig once for every deck: which paths stream, where a knob's value goes, which knobs the sticks turn, whether a mood's replay reloads the engine or only moves values (Played::diff), no rig = no sound (#425: the silent scene). Native and wasm give the same facts"

[[step]]
do = "load"
rig = "character.catpope"
mood = "happy"

[[step]]
do = "rig_facts"
with = { subject = "character.catpope", from = "happy", to = "laughing" }
expect = { rig = true, failed = false, audio_out = 1, mood = "laughing", reload = false, changed = { has = "voice_voice.index" }, sticks = { has = "voice_voice.ratio" }, streamed = { has = "mix1.out" }, targets = { has = "voice_melody.spread" } }

# a character the deck carries no rig for (#425): no rig, no sound – the silent scene plays, said so; only the being's look streams (no fft, no audio), no audio output
[[step]]
do = "rig_facts"
with = { subject = "nobody", from = "neutral", to = "happy" }
expect = { rig = false, failed = false, note = { contains = "no core rig for character.nobody" }, audio_out = 0, streamed = ["space.hue", "space.glow", "space.light", "space.pulse"], room = "" }

# and the engine renders nothing for it: the silent scene loads in live-core (no audio graph) and runs without a sound
[[step]]
do = "load"
silent = true
expect = { page = [] }

[[step]]
do = "run"
ms = 1500
expect = { sound = false }
