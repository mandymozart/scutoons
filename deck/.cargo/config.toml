# Cargo settings for the deck workspace.
[alias]
# deck-native built whole for x86-64-v3 (AVX2, FMA, BMI2 …) into its own target folder (#183) – the optional second
# binary for CPUs that have it (deck/native/README.md "x86-64-v3"). The default build stays baseline x86-64 and picks
# its audio batches' AVX2 loops at start. Add flags as usual: `cargo stage-v3 --locked --features deck-native/pipewire`.
stage-v3 = ["build", "--release", "-p", "deck-native", "--target-dir", "target-v3", "--config", "build.rustflags=['-Ctarget-cpu=x86-64-v3']"]
