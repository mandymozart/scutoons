<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- sc-boot:style (generated from shared/boot by `npm run boot:sync` – edit there) -->
		<style>
			/* The boot screen of every app (viewer, creator, admin) – edit HERE, then `npm run boot:sync` writes it into each
			   app's src/app.html (between the sc-boot markers; `npm run check` fails when an app.html is out of date). Plain CSS:
			   the app's tokens aren't loaded yet. Owner 2026-10-16: "before the app is fully loaded our screen is a dull white";
			   a skeleton of the page in the reader ("klassischer Skeleton-Loader, minimal animiert"), the logo and "Patience …"
			   in the middle, the load progress as a thin line at the very top ("less game, more app"). */
			#sc-boot {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				overflow: hidden;
				background: #fff;
				color: #000;
				font: 1rem/1.4 'IBM Plex Mono', ui-monospace, monospace;
			}

			/* the page's shape (the reader only – boot.js builds it by the address): grey blocks under one soft sweep */
			#sc-boot .sk {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
			}
			#sc-boot .sk i {
				display: block;
				background: #ececec;
			}
			#sc-boot .sk::after {
				content: '';
				position: absolute;
				inset: 0;
				background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.55) 50%, transparent 70%);
				background-size: 250% 100%;
				animation: sc-sweep 1.6s ease-in-out infinite;
			}
			@keyframes sc-sweep {
				from {
					background-position: 120% 0;
				}
				to {
					background-position: -20% 0;
				}
			}
			/* the header: the logo and the round buttons */
			#sc-boot .sk-head {
				flex: none;
				display: flex;
				align-items: center;
				gap: 0.5rem;
				height: 7.5rem;
				box-sizing: border-box;
				padding: 0 0.75rem 1.5rem;
				background: #f4f4f4;
			}
			#sc-boot .sk .sk-logo {
				width: 2.25rem;
				height: 4rem;
				margin-right: auto;
				border-radius: 0.25rem;
			}
			#sc-boot .sk .round {
				flex: none;
				width: 3.75rem;
				height: 3.75rem;
				box-sizing: border-box;
				border-radius: 50%;
				border: 2px solid #e2e2e2;
				background: #fff;
			}
			/* the toon page: the cover, the text, the button, the chapter rows */
			#sc-boot .sk-cover {
				flex: none;
				height: min(55vh, 36rem);
			}
			#sc-boot .sk-body {
				width: min(40rem, 100%);
				box-sizing: border-box;
				margin: 0 auto;
				padding: 2rem 1rem;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
			}
			#sc-boot .sk-line {
				height: 1rem;
			}
			#sc-boot .sk-button {
				width: 13rem;
				height: 3.25rem;
				margin-top: 1rem;
			}
			#sc-boot .sk-row {
				display: flex;
				gap: 1rem;
				margin-top: 1.5rem;
			}
			#sc-boot .sk-row > i {
				flex: none;
				width: 7rem;
				height: 4.5rem;
			}
			#sc-boot .sk-row > span {
				flex: 1;
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}
			/* a chapter: the strip of slices, one under the other */
			#sc-boot .sk-strip {
				width: min(40rem, 100%);
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				gap: 0.25rem;
			}
			#sc-boot .sk-slice {
				aspect-ratio: 4 / 5;
			}

			/* the logo and "Patience …" in the middle */
			#sc-boot .mid {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.75rem;
			}
			#sc-boot .mid img {
				width: min(12rem, 45vw);
				height: auto;
			}
			#sc-boot .text {
				padding: 0 0.5rem;
				background: #fff;
			}

			/* the app's code loaded so far: a thin line at the very top */
			#sc-boot .bar {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				height: 2px;
			}
			#sc-boot .fill {
				display: block;
				width: 0;
				height: 100%;
				background: #000;
				transition: width 0.15s linear;
			}

			@media (min-width: 64rem) {
				#sc-boot .sk-head {
					height: 6rem;
					padding: 0 1.5rem;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#sc-boot .sk::after {
					animation: none;
					background: none;
				}
			}
		</style>
		<!-- /sc-boot:style -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- sc-boot:body (generated from shared/boot by `npm run boot:sync` – edit there) -->
		<div id="sc-boot" data-expect="1300000">
			<div class="mid">
				<img src="%sveltekit.assets%/SCUTOONS-logo-animated.svg" alt="" />
				<span class="text"></span>
			</div>
			<span class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="fill"></span></span>
		</div>
		<div id="sc-app" style="display: contents">%sveltekit.body%</div>
		<script>
			// The boot screen's script (shared/boot – edit here, `npm run boot:sync` writes it into each app.html). Runs inline right
	// after #sc-boot, before the app's code: draws the reader's page skeleton for the address (data-skeleton="reader"),
	// "Patience …", the thin line for the app code loaded so far, and goes away as soon as the app has drawn something.
	(() => {
		const boot = document.getElementById('sc-boot');
		const app = document.getElementById('sc-app');
		const bar = boot.querySelector('.bar');
		const fill = boot.querySelector('.fill');
		boot.querySelector('.text').textContent = document.documentElement.lang === 'de' ? 'Geduld …' : 'Patience …';

		// the reader: the page's shape by its address – a chapter = a strip of slices, a toon = cover, text, chapter rows;
		// anything else: the logo and the line alone
		if (boot.dataset.skeleton === 'reader') {
			const parts = location.pathname.split('/').filter(Boolean);
			if (parts[0] === 'de' || parts[0] === 'en') parts.shift();
			const other = ['account', 'attributions', 'contact', 'events', 'stores'];
			const kind = parts[1] === 'chapter' ? 'chapter' : parts.length === 1 && !other.includes(parts[0]) ? 'toon' : null;
			if (kind) {
				const line = (w) => `<i class="sk-line" style="width:${w}%"></i>`;
				const head = '<div class="sk-head"><i class="sk-logo"></i>' + '<i class="round"></i>'.repeat(5) + '</div>';
				const row = (a, b) => `<div class="sk-row"><i></i><span>${line(a)}${line(b)}</span></div>`;
				const body =
					kind === 'chapter'
						? '<div class="sk-strip">' + '<i class="sk-slice"></i>'.repeat(3) + '</div>'
						: '<i class="sk-cover"></i><div class="sk-body">' + line(92) + line(78) + line(55) + '<i class="sk-button"></i>' + row(70, 40) + row(62, 35) + '</div>';
				const sk = document.createElement('div');
				sk.className = 'sk';
				sk.setAttribute('aria-hidden', 'true');
				sk.innerHTML = head + body;
				boot.prepend(sk);
			}
		}

		// the line: bytes of the app's own files (/_app/) arrived so far against the expected size (never full before the
		// app draws)
		let expect = Number(boot.dataset.expect) || 1000000;
		let loaded = 0;
		const show = () => {
			if (loaded > expect * 0.95) expect = loaded / 0.95;
			const share = Math.round((loaded / expect) * 100);
			fill.style.width = share + '%';
			bar.setAttribute('aria-valuenow', String(share));
		};
		let files = null;
		try {
			files = new PerformanceObserver((list) => {
				for (const entry of list.getEntries()) if (entry.name.includes('/_app/')) loaded += entry.decodedBodySize || entry.encodedBodySize || 0;
				show();
			});
			files.observe({ type: 'resource', buffered: true });
		} catch {
			/* no PerformanceObserver: the logo alone */
		}
		// away as soon as the app has drawn something (its first element that isn't a script) – but not while it only waits
		// (an element with data-sc-booting: the sign-in gate checking the session, the reader's own loader)
		const drawn = () => [...app.children].some((el) => el.tagName !== 'SCRIPT') && !app.querySelector('[data-sc-booting]');
		const done = () => {
			files?.disconnect();
			boot.remove();
		};
		if (drawn()) return done();
		const watch = new MutationObserver(() => {
			if (!drawn()) return;
			watch.disconnect();
			done();
		});
		watch.observe(app, { childList: true, subtree: true });
		// never stuck: whatever the app shows after 10 s (an API that doesn't answer) is better than the logo
		setTimeout(() => {
			watch.disconnect();
			if (boot.isConnected) done();
		}, 10000);
	})();
		</script>
		<!-- /sc-boot:body -->
	</body>
</html>
